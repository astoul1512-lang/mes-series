<title>Tests — Mes Séries</title>
<!--
  Ouvre ce fichier dans un navigateur : le titre de l'onglet dit tout de suite
  si quelque chose est cassé, et la page détaille lequel.

  Ce ne sont PAS des tests d'écran. Ils portent sur les fonctions pures — celles
  dont personne ne peut valider le comportement à la lecture, et dont une
  régression est invisible :

    · `mergeRemote` et `noterDecoches` — la fusion entre deux appareils. Un CRDT
      artisanal de quatre-vingt-dix lignes d'arbitrage par horodatage. C'est le
      seul endroit du projet où une erreur peut RESSUSCITER ou EFFACER des
      épisodes vus sans que rien ne s'affiche.
    · `progress`, `isFinished`, `nextToWatch`, `statutSerie` — tout l'affichage
      en dépend.
    · `esc` et `escJs` — l'échappement. Le bug des acteurs à apostrophe aurait
      été attrapé par trois lignes ici.
    · `migrer` — il tourne au démarrage : une erreur empêche l'app de s'ouvrir.

  Les fichiers chargés sont les VRAIS, dans l'ordre d'`index.html`. `MODE_TEST`
  empêche `boot()` de démarrer l'app pour de bon.

  Ce fichier ne doit pas entrer dans le SHELL du service worker.
-->
<style>
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:0;padding:22px 18px 60px;
       background:#0b0d11;color:#e8eaee}
  h1{font-size:18px;margin:0 0 4px}
  .bilan{font-size:15px;font-weight:700;margin:0 0 18px;padding:10px 14px;border-radius:10px}
  .bilan.vert{background:#12301f;color:#5fe0a0}
  .bilan.rouge{background:#3a1418;color:#ff8a8a}
  .grp{margin:20px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b93a3}
  .t{padding:3px 0 3px 22px;position:relative;border-bottom:1px solid #171a21}
  .t::before{position:absolute;left:0;top:3px}
  .ok::before{content:'✓';color:#3ecf8e}
  .ko::before{content:'✗';color:#ff6b6b}
  .ko{color:#ff9b9b}
  .ko em{display:block;color:#ff6b6b;font-style:normal;font-size:12.5px;padding-left:2px}
</style>

<!-- Le même squelette qu'`index.html`. Les scripts s'y accrochent au
     chargement (`#sheet` notamment) : sans lui, app-02 s'interrompt en pleine
     initialisation et la moitié du fichier ne s'exécute jamais. Masqué : on
     teste des fonctions, pas des écrans. -->
<div style="display:none">
  <div class="app" id="app"></div>
  <nav><div class="navin" id="nav"></div></nav>
  <div class="toast" id="toast"></div>
  <div class="undobar" id="undo"></div>
  <div class="sheet" id="sheet"><div class="sheetin" id="sheetin"></div></div>
</div>

<h1>Tests — Mes Séries</h1>
<div id="bilan" class="bilan">…</div>
<div id="out"></div>

<script>
/* `MODE_TEST` fait DEUX choses, et la seconde est la plus importante :
   1. elle empêche `boot()` et l'enregistrement du service worker ;
   2. elle force `memoryOnly`, donc AUCUNE écriture dans IndexedDB ni dans
      localStorage. Cette page charge les vrais scripts et partage l'origine de
      l'app : sans ce verrou, `migrer()` — appelé par les cas de migration —
      se termine par `saveDB()` et écrase la bibliothèque de la personne par la
      base vierge des tests. C'est arrivé en production le 30/07.
   NE JAMAIS retirer cette ligne, ni la déplacer après le chargement des
   scripts : `memoryOnly` est fixé au moment où app-01 s'évalue. */
window.MODE_TEST = true;
</script>
<script src="./app-01-noyau.js"></script>
<script src="./app-02-outils.js"></script>
<script src="./app-03-vues.js"></script>
<script src="./app-04-decouvrir.js"></script>
<script src="./app-05-plateformes.js"></script>
<script src="./app-06-serie.js"></script>
<script src="./app-07-partage.js"></script>
<script src="./app-09-notifications.js"></script>
<script src="./app-10-sorties.js"></script>
<script src="./app-11-gouts.js"></script>
<script src="./app-12-recherche.js"></script>
<script src="./app-08-reglages.js"></script>

<script>
(function(){
  let n = 0, ko = 0;
  const sortie = document.getElementById('out');

  function groupe(titre){
    const d = document.createElement('div');
    d.className = 'grp'; d.textContent = titre;
    sortie.appendChild(d);
  }
  function test(nom, fn){
    n++;
    const d = document.createElement('div');
    try{
      fn();
      d.className = 't ok'; d.textContent = nom;
    }catch(e){
      ko++;
      d.className = 't ko'; d.textContent = nom;
      const em = document.createElement('em'); em.textContent = e.message;
      d.appendChild(em);
    }
    sortie.appendChild(d);
  }
  function egal(a, b, msg){
    const sa = JSON.stringify(a), sb = JSON.stringify(b);
    if(sa !== sb) throw new Error((msg ? msg+' : ' : '')+'attendu '+sb+', obtenu '+sa);
  }
  function vrai(c, msg){ if(!c) throw new Error(msg || 'faux'); }

  /* Une base neuve à chaque test : les fonctions écrivent dans `db`, il ne
     faut pas qu'un test hérite de l'état du précédent. */
  function baseVierge(){
    db.shows = {}; db.movies = {};
    db.deleted = { shows:{}, movies:{} };
    db.gouts = { genres:[], exclus:[], acteurs:[], propose:true, jour:'',
                 plates:[], platesDemande:true, suggMesPlates:false,
                 graines:[], animeSous:[], pasVus:[] };
    /* LOT A — les trois clés du signal d'appréciation. Sans elles, un test qui
       pose un avis hériterait de celui du test précédent. */
    db.avis = { tv:{}, movie:{} };
    db.avisRetires = { tv:{}, movie:{} };
    db.podium = { film:[], serie:[], anime:[], maj:0 };
    db.profil = { couleur:'corail', embleme:'lettre' };
    db.pseudo = ''; db.auth = null; db.v = 2;
  }
  const ep = (e, jour, st) => ({ e:e, n:'E'+e, d:jour, r:42, st:st||null });
  function serie(id, eps, vus, extra){
    return Object.assign({ id:id, name:'S'+id, status:'Ended', seasons:{1:eps},
                           watched:vus||{}, addedAt:1, updated:1 }, extra||{});
  }
  const HIER = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const DEMAIN = new Date(Date.now()+86400000).toISOString().slice(0,10);

  /* ==================== Échappement ==================== */
  groupe('Échappement');

  test('esc neutralise les cinq caractères dangereux', ()=>{
    egal(esc('<a href="x">&\'</a>'),
         '&lt;a href=&quot;x&quot;&gt;&amp;&#39;&lt;/a&gt;');
  });

  test("escJs survit à une apostrophe une fois posé dans un onclick", ()=>{
    /* Le vrai parcours : le parseur HTML décode, puis JavaScript lit. C'est
       exactement ce que `esc(...).replace()` ne faisait PAS. */
    window.__recu = null;
    const d = document.createElement('div');
    d.innerHTML = '<b onclick="window.__recu = \'' + escJs("O'Brien") + '\'"></b>';
    d.firstChild.click();
    egal(window.__recu, "O'Brien");
  });

  test('escJs survit aussi à une barre oblique inverse et à un guillemet', ()=>{
    window.__recu = null;
    const nom = 'A\\B"C\'D';
    const d = document.createElement('div');
    d.innerHTML = '<b onclick="window.__recu = \'' + escJs(nom) + '\'"></b>';
    d.firstChild.click();
    egal(window.__recu, nom);
  });

  test('cheminImage refuse ce qui n\'est pas un chemin TMDB', ()=>{
    ['https://x.fr/p.gif', '//evil.example/x.jpg', 'javascript:alert(1)',
     '/a.jpg" onerror="x', '/a//b.jpg', '', null, 42].forEach(c=>{
      if(cheminImage(c) !== null) throw new Error('accepté : '+JSON.stringify(c));
    });
  });
  test('cheminImage accepte les vrais chemins TMDB', ()=>{
    ['/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', '/a-b_c.1.png', '/t/p/w342/abc.jpg']
      .forEach(c=>{ if(cheminImage(c) !== c) throw new Error('refusé : '+c); });
  });

  /* ==================== Statut d'un titre ==================== */
  groupe('Statut d\'un titre');

  test('progress ne compte que ce qui est diffusé', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,HIER), ep(3,DEMAIN)], {'1x1':1});
    egal(progress(s), { watched:1, total:2, pct:50 });
  });

  test('nextToWatch SAUTE un épisode sans date au lieu de s\'arrêter dessus', ()=>{
    /* B4 : c'est le bug qui faisait disparaître une série entière du rail
       « À rattraper », sans que rien ne le signale. */
    const s = serie(1, [ep(1,HIER), ep(2,null), ep(3,HIER), ep(4,HIER)], {'1x1':1});
    const nx = nextToWatch(s);
    vrai(nx, 'aucun épisode proposé : la série disparaîtrait du rail');
    egal(nx.e, 3, 'épisode proposé');
  });

  test('nextToWatch s\'arrête bien sur une date future', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,DEMAIN), ep(3,HIER)], {'1x1':1});
    egal(nextToWatch(s), null, 'un épisode à venir a été proposé');
  });

  test('nextToWatch rend null quand tout est vu', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,HIER)], {'1x1':1,'1x2':1});
    egal(nextToWatch(s), null);
  });

  test('isFinished exige une série terminée ET intégralement vue', ()=>{
    const eps = [ep(1,HIER), ep(2,HIER)];
    vrai(!isFinished(serie(1, eps, {'1x1':1})), 'partiellement vue');
    vrai(!isFinished(serie(1, eps, {'1x1':1,'1x2':1}, {status:'Returning Series'})),
         'série non terminée');
    vrai(isFinished(serie(1, eps, {'1x1':1,'1x2':1})), 'terminée et tout vu');
  });

  test('statutSerie : les trois états, et la pause qui prime', ()=>{
    const eps = [ep(1,HIER), ep(2,HIER)];
    egal(statutSerie(serie(1, eps, {})), 'avoir');
    egal(statutSerie(serie(1, eps, {'1x1':1}, {status:'Returning Series'})), 'asuivre');
    egal(statutSerie(serie(1, eps, {'1x1':1,'1x2':1})), 'vu');
    egal(statutSerie(serie(1, eps, {'1x1':1}, {pause:true})), 'pause');
  });

  test('les hors-série ne comptent jamais dans la progression', ()=>{
    const s = serie(1, [ep(1,HIER)], {'1x1':1});
    s.seasons[0] = [ep(1,HIER), ep(2,HIER)];
    egal(progress(s).total, 1, 'la saison 0 a été comptée');
  });

  /* ==================== Fusion entre appareils ==================== */
  groupe('Fusion entre appareils — mergeRemote');

  test('une série inconnue arrive', ()=>{
    baseVierge();
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER)], {'1x1':1}) }, movies:{} });
    vrai(db.shows[7], 'la série n\'est pas arrivée');
    egal(progress(db.shows[7]).watched, 1);
  });

  test('les épisodes vus des deux côtés fusionnent, aucun n\'est perdu', ()=>{
    baseVierge();
    db.shows[7] = serie(7, [ep(1,HIER),ep(2,HIER),ep(3,HIER)], {'1x1':1});
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER),ep(2,HIER),ep(3,HIER)], {'1x3':1}) },
                  movies:{} });
    egal(Object.keys(db.shows[7].watched).sort(), ['1x1','1x3']);
  });

  test('un décochage RÉCENT gagne sur un vu ancien venu d\'ailleurs', ()=>{
    baseVierge();
    const local = serie(7, [ep(1,HIER)], {});
    local.unwatched = { '1x1': Date.now() };          // décoché ici, à l'instant
    db.shows[7] = local;
    const distant = serie(7, [ep(1,HIER)], { '1x1': Date.now() - 3600000 });
    mergeRemote({ shows:{ 7: distant }, movies:{} });
    vrai(!db.shows[7].watched['1x1'],
         'l\'épisode décoché est revenu : le décochage se perd à chaque synchro');
  });

  test('un vu RÉCENT gagne sur un décochage ancien', ()=>{
    baseVierge();
    const local = serie(7, [ep(1,HIER)], {});
    local.unwatched = { '1x1': Date.now() - 3600000 };
    db.shows[7] = local;
    const distant = serie(7, [ep(1,HIER)], { '1x1': Date.now() });
    mergeRemote({ shows:{ 7: distant }, movies:{} });
    vrai(db.shows[7].watched['1x1'], 'le recochage n\'a pas pris');
  });

  test('une série supprimée ici ne revient pas de l\'autre appareil', ()=>{
    baseVierge();
    markDeleted('shows', 7);
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER)], {'1x1':1}) }, movies:{},
                  deleted:{shows:{},movies:{}} });
    vrai(!db.shows[7], 'une série supprimée est ressuscitée par la synchro');
  });

  test('une série supprimée AILLEURS disparaît ici', ()=>{
    baseVierge();
    db.shows[7] = serie(7, [ep(1,HIER)], {'1x1':1});
    mergeRemote({ shows:{}, movies:{}, deleted:{ shows:{ 7: Date.now() }, movies:{} } });
    vrai(!db.shows[7], 'la suppression ne s\'est pas propagée');
  });

  test('une série RAJOUTÉE après sa suppression survit', ()=>{
    baseVierge();
    markDeleted('shows', 7);
    const rajoutee = serie(7, [ep(1,HIER)], {'1x1':1});
    rajoutee.addedAt = Date.now() + 1000;             // rajoutée après la suppression
    mergeRemote({ shows:{ 7: rajoutee }, movies:{}, deleted:{shows:{},movies:{}} });
    vrai(db.shows[7], 'une série rajoutée volontairement a été effacée');
  });

  test('un film vu plus récemment l\'emporte', ()=>{
    baseVierge();
    db.movies[3] = { id:3, title:'F', seen:false, watchedAt:1000 };
    mergeRemote({ shows:{}, movies:{ 3:{ id:3, title:'F', seen:true, watchedAt:2000 } } });
    vrai(db.movies[3].seen, 'le film vu ailleurs n\'est pas remonté');
  });

  test('normaliserSerie garantit watched et seasons', ()=>{
    const s = normaliserSerie({ id:9, name:'X' });
    egal(s.watched, {}); egal(s.seasons, {});
    egal(normaliserSerie(null), null);
    egal(normaliserSerie('bidon'), null);
  });

  test('une vignette locale n\'est pas effacée par une absence distante', ()=>{
    /* Ce que la normalisation existe pour garantir : le jour où les vignettes
       sortiront du payload (F5), un appareil à jour ne doit pas les perdre. */
    const local = serie(7, [ep(1,HIER,'/vignette.jpg')], {});
    const distant = serie(7, [ep(1,HIER,null)], {});
    const s = normaliserSerie(distant, local);
    egal(s.seasons[1][0].st, '/vignette.jpg');
  });

  test('un objet distant vide ou cassé ne casse pas la fusion', ()=>{
    baseVierge();
    mergeRemote({ shows:{ 1:null, 2:'bidon', 3:{} }, movies:{ 1:null } });
    egal(Object.keys(db.shows).length, 0);
    egal(Object.keys(db.movies).length, 0);
  });

  /* ==================== Préférences ==================== */
  groupe('Préférences — la plus récente gagne');

  test('des goûts plus récents s\'imposent en bloc', ()=>{
    baseVierge();
    db.gouts.genres = ['Drame']; db.gouts.maj = 1000;
    mergeRemote({ shows:{}, movies:{},
                  gouts:{ genres:['Comédie','Action'], exclus:[], acteurs:[],
                          plates:[], maj:2000 } });
    egal(db.gouts.genres, ['Comédie','Action']);
  });

  test('des goûts plus anciens ne remplacent rien', ()=>{
    baseVierge();
    db.gouts.genres = ['Drame']; db.gouts.maj = 3000;
    mergeRemote({ shows:{}, movies:{},
                  gouts:{ genres:['Comédie'], exclus:[], acteurs:[], plates:[], maj:2000 } });
    egal(db.gouts.genres, ['Drame']);
  });

  test('un avatar plus récent s\'impose', ()=>{
    baseVierge();
    db.profil = { couleur:'corail', maj:1000 };
    mergeRemote({ shows:{}, movies:{}, profil:{ couleur:'menthe', maj:2000 } });
    egal(db.profil.couleur, 'menthe');
  });

  test('payload emporte les préférences et AUCUN secret', ()=>{
    baseVierge();
    db.auth = { token:'JETON', refresh:'REFRESH', uid:'u', email:'a@b.fr' };
    db.syncDernierEchec = { quand:1, motif:'x' };
    const p = payload(), t = JSON.stringify(p);
    vrai(p.gouts !== undefined && p.profil !== undefined, 'préférences absentes');
    vrai(p.auth === undefined && p.sync === undefined, 'auth ou sync présents');
    vrai(p.syncDernierEchec === undefined, 'un état local part au serveur');
    vrai(p.v === undefined && p.proprio === undefined, 'schéma ou propriétaire envoyés');
    vrai(t.indexOf('JETON') < 0 && t.indexOf('REFRESH') < 0, 'UN JETON PART AU SERVEUR');
  });

  /* ==================== Migrations ==================== */
  groupe('Migrations — B7');

  test('une base sans version et avec l\'ancienne clé JWT est réparée', ()=>{
    baseVierge();
    delete db.v;
    db.sync = { url:'https://x.supabase.co', key:'eyJhbGciOiJIUzI1NiJ9.abc' };
    migrer();
    egal(db.v, SCHEMA, 'version');
    vrai(!/^eyJ/.test(db.sync.key), 'la clé héritée n\'a pas été remplacée');
  });

  test('une base déjà à jour n\'est pas retouchée', ()=>{
    baseVierge();
    db.v = SCHEMA;
    db.sync = { url:'https://x.supabase.co', key:'sb_publishable_abc' };
    migrer();
    egal(db.v, SCHEMA);
    egal(db.sync.key, 'sb_publishable_abc', 'la clé a été écrasée sans raison');
  });

  test('une base plus récente que le code est signalée, pas dégradée', ()=>{
    baseVierge();
    db.v = 99;
    db.sync = { url:'https://x.supabase.co', key:'eyJdonc_ancienne' };
    migrer();
    egal(db.v, 99, 'la version a été rétrogradée');
    vrai(db.schemaTropRecent, 'aucun signalement');
    egal(db.sync.key, 'eyJdonc_ancienne', 'une migration a tourné quand même');
  });

  test('une migration qui échoue ne bloque pas le démarrage', ()=>{
    baseVierge();
    delete db.v;
    const vraie = MIGRATIONS[2];
    MIGRATIONS[2] = function(){ throw new Error('boum'); };
    try{ migrer(); } finally { MIGRATIONS[2] = vraie; }
    egal(db.v, 1, 'la version a avancé malgré l\'échec');
  });

  /* ==================== Routes — C1 ==================== */
  groupe('Routes — C1');

  test('un écran simple se sérialise', ()=>{
    egal(routeVersFragment('discover', {}), '#/decouvrir');
    egal(routeVersFragment('follow', {}), '#/a-suivre');
  });

  test('un écran à identité porte son identité', ()=>{
    egal(routeVersFragment('show', {id:1399}), '#/serie/1399');
    egal(routeVersFragment('movie', {id:550}), '#/film/550');
    egal(routeVersFragment('acteur', {id:287}), '#/personne/287');
    egal(routeVersFragment('preview', {id:1399, type:'tv'}), '#/apercu/1399/tv');
  });

  test('se relit dans l\'autre sens', ()=>{
    egal(fragmentVersRoute('#/decouvrir'), {view:'discover', params:{}});
    egal(fragmentVersRoute('#/serie/1399'), {view:'show', params:{id:'1399'}});
    egal(fragmentVersRoute('#/apercu/550/movie'), {view:'preview', params:{id:'550', type:'movie'}});
    /* L'identifiant revient en CHAÎNE — une adresse ne transporte que du texte.
       `db.shows[params.id]` marche dans les deux cas (les clés d'objet sont des
       chaînes), mais un `===` sur un nombre, non. À retenir pour C3. */
    egal(typeof fragmentVersRoute('#/serie/1399').params.id, 'string');
  });

  test('l\'ancienne forme des notifications marche encore', ()=>{
    egal(fragmentVersRoute('#show-1399'), {view:'show', params:{id:'1399'}});
    egal(fragmentVersRoute('#movie-550'), {view:'movie', params:{id:'550'}});
    /* Sans le dièse non plus : le service worker manipule les deux formes. */
    egal(fragmentVersRoute('show-1399'), {view:'show', params:{id:'1399'}});
  });

  test('un identifiant qui n\'est pas un nombre est refusé', ()=>{
    egal(fragmentVersRoute('#/serie/abc'), null);
    egal(fragmentVersRoute('#/serie/'), null, 'identifiant vide accepté');
    egal(fragmentVersRoute('#/serie'), null, 'identifiant absent accepté');
    egal(fragmentVersRoute('#/serie/1399bis'), null);
  });

  test('un écran non partageable n\'a pas d\'adresse, dans les deux sens', ()=>{
    ['rangee','biblio','account','avatar','motdepasse'].forEach(v=>{
      vrai(routeVersFragment(v, {id:1}) === null, v+' se sérialise alors qu\'il ne devrait pas');
    });
    egal(fragmentVersRoute('#/compte'), null);
    egal(fragmentVersRoute('#/avatar'), null);
    egal(fragmentVersRoute('#/motdepasse'), null);
    egal(fragmentVersRoute('#/bibliotheque/abc'), null);
  });

  test('le lien de réinitialisation n\'est pas pris pour une route', ()=>{
    egal(fragmentVersRoute('#access_token=xyz&type=recovery'), null);
    egal(fragmentVersRoute('#error_description=Lien+expire'), null);
  });

  test('une route inventée ne renvoie rien', ()=>{
    egal(fragmentVersRoute('#/nimportequoi'), null);
    egal(fragmentVersRoute('#/'), null);
    egal(fragmentVersRoute('#'), null);
    egal(fragmentVersRoute(''), null);
    egal(fragmentVersRoute(null), null);
    egal(fragmentVersRoute(undefined), null);
  });

  test('un type d\'aperçu inconnu est refusé', ()=>{
    /* `loadPreview` colle ce type dans un chemin d'API : « #/apercu/1/person »
       enverrait le relais TMDB demander /person/1. On ne laisse passer que les
       deux types que l'app sait rendre. */
    egal(fragmentVersRoute('#/apercu/1399/person'), null);
    egal(fragmentVersRoute('#/apercu/1399/../../secret'), null);
    egal(fragmentVersRoute('#/apercu/1399'), null, 'type absent accepté');
    egal(fragmentVersRoute('#/apercu/1399/tv'), {view:'preview', params:{id:'1399', type:'tv'}});
  });

  test('un fragment mal encodé ne fait pas jeter', ()=>{
    egal(fragmentVersRoute('#/%E0%A4%A'), null);
    egal(fragmentVersRoute('#/serie/%'), null);
  });

  test('aller-retour sur toutes les routes partageables', ()=>{
    const echantillon = { id:1399, type:'tv' };
    let vues = 0;
    for(const v in ROUTES){
      if(!ROUTES[v].partageable) continue;
      vues++;
      const p = {};
      (ROUTES[v].cles||[]).forEach(k=>{ p[k] = echantillon[k]; });
      const frag = routeVersFragment(v, p);
      vrai(frag, v+' ne se sérialise pas');
      const r = fragmentVersRoute(frag);
      vrai(r, v+' : '+frag+' ne se relit pas');
      egal(r.view, v, 'aller-retour sur '+v);
      (ROUTES[v].cles||[]).forEach(k=>{

    egal(Object.keys(saisonsFinies(s)), [], 'la saison 0 compte comme une saison');
  });

  test('la question ne se repose pas sur un titre déjà qualifié', ()=>{
    baseVierge();
    db.shows[1] = serie(1, [ep(1,HIER)], {'1x1':1});
    poserAvis('tv', 1, 1);
    fermerAvis();
    proposerAvis('tv', 1, 'S1 terminée');
    vrai(!document.getElementById('barreavis') ||
         !document.getElementById('barreavis').classList.contains('show'),
         'la barre relance quelqu\'un qui a déjà répondu');
  });

  groupe('Lot A — le duel');

  test('qui entre dans le jeu, et qui n\'y entre pas', ()=>{
    baseVierge();
    db.movies[1] = film(1, ['Drame']);                  // vu, sans avis → entre
    db.movies[2] = film(2, ['Drame']); poserAvis('movie', 2, 1);   // vu + 👍 → entre
    db.movies[3] = film(3, ['Drame']); poserAvis('movie', 3, -1);  // 👎 → sort
    db.movies[4] = film(4, ['Drame'], false);           // ajouté, jamais vu → ignoré
    db.movies[5] = film(5, ['Drame']);
    db.gouts.pasVus = ['movie:5'];                      // récusé en duel → sort
    egal(titresEligiblesDuel('film').map(t=>t.id).sort(), ['1','2']);
  });

  test('une famille ne s\'ouvre qu\'à partir de dix titres', ()=>{
    baseVierge();
    for(let i=1;i<=9;i++) db.movies[i] = film(i, ['Drame']);
    egal(famillesDuel().map(f=>f.cle), [], 'une famille trop maigre est proposée');
    db.movies[10] = film(10, ['Drame']);
    egal(famillesDuel().map(f=>f.cle), ['film']);
  });

  test('battre un titre 👍 fait passer le gagnant à 👍 — et le perdant ne devient jamais 👎', ()=>{
    /* §1.7, l'exception : la personne vient de déclarer qu'elle préfère ce
       titre à quelque chose qu'elle aime. Déclaration, pas déduction. */
    baseVierge();
    for(let i=1;i<=10;i++) db.movies[i] = film(i, ['Drame']);
    poserAvis('movie', 2, 1);
    ouvrirDuel('film');
    duel.paire = [ { media:'movie', id:'1' }, { media:'movie', id:'2' } ];
    duel.scores['movie:1'] = 1000; duel.scores['movie:2'] = 1000;
    appliquerVote(0);
    egal(avisDe('movie', 1), 1, 'le gagnant n\'a pas hérité du 👍');
    egal(avisDe('movie', 2), 1, 'le perdant a perdu son 👍');
    fermerDuel();
  });

  test('un titre non aimé qui gagne ne devient pas 👍 pour autant', ()=>{
    baseVierge();
    for(let i=1;i<=10;i++) db.movies[i] = film(i, ['Drame']);
    ouvrirDuel('film');
    duel.paire = [ { media:'movie', id:'1' }, { media:'movie', id:'2' } ];
    duel.scores['movie:1'] = 1000; duel.scores['movie:2'] = 1000;
    appliquerVote(0);
    egal([avisDe('movie',1), avisDe('movie',2)], [0,0],
         'le duel a donné un signe alors qu\'il ne donne qu\'un ordre');
    fermerDuel();
  });

  /* `terminerDuel` va chercher cinq titres à découvrir : c'est le seul appel
     réseau du lot. On le coupe ici — cette page teste des fonctions pures, et
     une requête sortante ferait échouer le lanceur sur une erreur de console. */
  function horsLigne(fn){
    const vrai_ = tmdb;
    window.tmdb = ()=> Promise.reject(new Error('hors ligne'));
    try{ fn(); } finally { window.tmdb = vrai_; }
  }

  test('le duel écrit un podium de dix au plus, du meilleur au moins bon', ()=>{
    baseVierge();
    for(let i=1;i<=12;i++) db.movies[i] = film(i, ['Drame']);
    ouvrirDuel('film');
    horsLigne(()=>{
      /* On force un classement lisible plutôt que de jouer douze duels au hasard. */
      duel.paquet.forEach((t,i)=>{ duel.scores['movie:'+t.id] = 2000 - i; });
      const attendu = duel.paquet.slice(0,10).map(t=>String(t.id));
      terminerDuel();
      egal(db.podium.film, attendu);
      vrai(db.podium.maj > 0, 'le podium n\'est pas daté : la synchro ne saura pas l\'arbitrer');
    });
    fermerDuel();
  });

  test('« Je ne l\'ai pas vu » sort le titre du paquet, pour de bon', ()=>{
    baseVierge();
    for(let i=1;i<=11;i++) db.movies[i] = film(i, ['Drame']);
    ouvrirDuel('film');
    duelPasVu('movie', 1);
    vrai(duel.paquet.every(t=>t.id !== '1'), 'le titre est resté dans le paquet');
    vrai(db.gouts.pasVus.indexOf('movie:1') >= 0, 'rien n\'est retenu : il reviendra demain');
    egal(avisDe('movie', 1), 0, '« pas vu » a été pris pour un avis');
    fermerDuel();
  });

  test('un titre au nom truqué ne produit aucun gestionnaire exécutable', ()=>{
    /* Le nom vient de TMDB, mais aussi d\'une bibliothèque partagée et d\'un
       fichier de sauvegarde importé. Toute chaîne posée dans un `onclick` passe
       par `escJs`. */
    baseVierge();
    db.movies[1] = film(1, ['Drame']);
    db.movies[1].title = 'X\' onclick=\'alert(1)';
    duel.rattrapage = [{ media:'movie', id:'1', nom:db.movies[1].title, date:null }];
    duel.actif = true; duel.ecran = 'rattrapage';
    const boite = document.createElement('div');
    boite.innerHTML = ecranRattrapage();
    const gestionnaires = [...boite.querySelectorAll('[onclick]')].map(e=>e.getAttribute('onclick'));
    vrai(gestionnaires.length, 'aucune ligne rendue : le test ne prouve rien');
    vrai(gestionnaires.every(g=> g.indexOf('alert') < 0), 'du code injecté est devenu exécutable');
    fermerDuel();
  });

  groupe('Lot A — les deux barres du bas');

  /* Elles occupent le MÊME emplacement, au pixel près. Tout ce groupe existe
     parce qu'une seule d'entre elles a le droit d'être à l'écran : la question
     posée par-dessus « Annuler » offrait ses pouces là où le doigt visait
     « Annuler », et on posait un 👍 en croyant annuler une saison. */
  const barreAvisMontree = ()=>{
    const el = document.getElementById('barreavis');
    return !!(el && el.classList.contains('show'));
  };
  const barreUndoMontree = ()=> document.getElementById('undo').classList.contains('show');

  test('une barre « Annuler » fait reculer la question, qui revient après elle', ()=>{
    baseVierge();
    db.movies[1] = film(1, ['Drame']);
    db.shows[9] = serie(9, [ep(1,HIER)], {});
    proposerAvis('movie', 1, 'F1, vu 🎉');
    vrai(barreAvisMontree(), 'la question ne s\'est pas affichée');
    pushUndo(9, {}, 'Saison 1 · 1 vu');
    vrai(barreUndoMontree(), '« Annuler » ne s\'est pas affichée');
    vrai(!barreAvisMontree(), 'LES DEUX BARRES SONT À L\'ÉCRAN : le doigt qui vise Annuler pose un pouce');
    hideUndo();
    vrai(barreAvisMontree(), 'la question a été perdue au lieu de revenir');
    fermerAvis();
  });

  test('deux questions coup sur coup se posent l\'une après l\'autre', ()=>{
    /* La file n'avait qu'une place : la seconde question écrasait la première,
       qui n'était alors jamais posée. */
    baseVierge();
    db.movies[1] = film(1, ['Drame']); db.movies[2] = film(2, ['Drame']);
    db.shows[9] = serie(9, [ep(1,HIER)], {});
    pushUndo(9, {}, 'geste groupé');
    proposerAvis('movie', 1, 'F1, vu 🎉');
    proposerAvis('movie', 2, 'F2, vu 🎉');
    hideUndo();
    vrai(barreAvisMontree() && avisAffiche.id === '1', 'la première question a été écrasée');
    fermerAvis(); filerAvis();
    vrai(barreAvisMontree() && avisAffiche.id === '2', 'la seconde question a disparu');
    fermerAvis();
  });

  test('annuler une saison ne jette que la question de CETTE série', ()=>{
    baseVierge();
    db.movies[1] = film(1, ['Drame']);
    db.shows[9] = serie(9, [ep(1,HIER)], {'1x1':1});
    pushUndo(9, {}, 'Saison 1');
    proposerAvis('tv', 9, 'S9, terminée 🎉');      // sur la série annulée
    proposerAvis('movie', 1, 'F1, vu 🎉');          // sur un film, sans rapport
    doUndo();
    vrai(barreAvisMontree() && avisAffiche.id === '1',
         'la question du film a été jetée avec celle de la saison annulée');
    fermerAvis();
  });

  test('la question fait taire le toast qui la recouvrait', ()=>{
    /* Le toast a le z-index le plus fort et le même bas d'écran : « Marqué
       comme vu ✓ » masquait le fait et le pouce 👎 pendant deux secondes. */
    baseVierge();
    db.movies[1] = film(1, ['Drame']);
    toast('Marqué comme vu ✓');
    vrai(document.getElementById('toast').classList.contains('show'), 'le toast ne s\'affiche pas');
    proposerAvis('movie', 1, 'F1, vu 🎉');
    vrai(!document.getElementById('toast').classList.contains('show'), 'le toast recouvre la question');
    fermerAvis();
  });

  test('quitter Mes goûts range la session de duel', ()=>{
    /* La barre du bas reste atteignable pendant une partie. Un duel laissé
       actif ailleurs confisquait le premier appui sur « retour » dans TOUTE
       l'app et désarmait le geste de bord partout. */
    baseVierge();
    db.auth = { token:'t', uid:'u1', email:'a@b.c' }; db.proprio = 'u1';
    for(let i=1;i<=10;i++) db.movies[i] = film(i, ['Drame']);
    const vueAvant = view;
    view = 'gouts';                       // sans passer par le rendu de l'écran
    ouvrirDuel('film');
    vrai(duel.actif, 'le duel ne s\'est pas ouvert');
    go('follow');
    vrai(!duel.actif, 'le duel survit à un changement d\'onglet');
    db.auth = null; view = vueAvant;
  });

  groupe('Lot A — §1.4 : « un second appui défait-il le geste ? »');

  /* La règle avait d'abord été formulée « geste unitaire ou geste groupé », et
     c'était faux. Le rond de la carte « À rattraper » est unitaire, il avait
     donc perdu sa barre — sauf qu'il ne se ré-appuie PAS : dès le premier appui
     il vise l'épisode suivant. Résultat, le geste le plus exposé de l'app
     n'offrait plus aucun retour en arrière. Les cinq cas qui suivent fixent le
     vrai critère, pour qu'il ne se reperde pas. */
  const raz = ()=>{ hideUndo(); annulerFileAvis(null); fermerAvis(); };

  test('la coche d\'un épisode, sur la fiche, ne pose PAS de barre', ()=>{
    /* Ici un second appui au même endroit défait le geste : la coche ne bouge
       pas. La barre serait du bruit, et elle occuperait la place de la question. */
    baseVierge(); raz();
    db.shows[1] = serie(1, [ep(1,HIER), ep(2,HIER)], {});
    toggleEp(1, 1, 1);
    vrai(!barreUndoMontree(), 'une barre est posée sur un geste qui se ré-appuie');
    marquerSeul(1, 1, 2);
    vrai(!barreUndoMontree(), 'idem sur « cet épisode uniquement »');
    raz();
  });

  test('le rond « À rattraper », lui, POSE une barre', ()=>{
    baseVierge(); raz();
    db.shows[1] = serie(1, [ep(1,HIER), ep(2,HIER)], {});
    quickWatch(1);
    vrai(barreUndoMontree(),
         'le geste le plus exposé de l\'app n\'offre aucun retour en arrière');
    raz();
  });

  test('et voici pourquoi : le rond ne se ré-appuie pas, il vise déjà le suivant', ()=>{
    /* La raison de la règle, noir sur blanc. Deux appuis ne défont pas le
       premier — ils marquent DEUX épisodes. C'est ce cas qui invalide la
       formulation « unitaire donc réversible ». */
    baseVierge(); raz();
    db.shows[1] = serie(1, [ep(1,HIER), ep(2,HIER)], {});
    quickWatch(1);
    quickWatch(1);
    egal(Object.keys(db.shows[1].watched).sort(), ['1x1','1x2'],
         'le second appui a défait le premier : la règle « unitaire » serait alors juste');
    raz();
  });

  test('une action groupée garde sa barre', ()=>{
    baseVierge(); raz();
    db.shows[1] = serie(1, [ep(1,HIER), ep(2,HIER), ep(3,HIER)], {});
    marquerCascade(1, 1, 3);
    vrai(barreUndoMontree(), 'la barre a disparu d\'une cascade');
    raz();
  });

  test('le rond qui termine une saison : la question attend derrière la barre', ()=>{
    /* Le prix assumé du retour de la barre. Les deux ne doivent jamais être à
       l'écran ensemble, et la question ne doit pas être perdue pour autant. */
    baseVierge(); raz();
    db.shows[1] = serie(1, [ep(1,HIER), ep(2,HIER)], {'1x1':1});
    quickWatch(1);                                   // dernier épisode de la saison
    vrai(barreUndoMontree(), '« Annuler » ne s\'est pas affichée');
    vrai(!barreAvisMontree(), 'LES DEUX BARRES SONT À L\'ÉCRAN');
    hideUndo();
    vrai(barreAvisMontree(), 'la question a été perdue au lieu d\'attendre son tour');
    raz();
  });

  groupe('Lot A — l\'échappement, jusqu\'au bout');

  test('la fiche ⓘ d\'un duel n\'écrit aucun identifiant brut dans la page', ()=>{
    /* L'identifiant partait sans filtre dans l'attribut `id` du bloc synopsis,
       alors que le nom du titre, juste à côté, était bien échappé. Pas
       exploitable — ces identifiants viennent de TMDB ou de ta propre
       sauvegarde — mais c'est la règle maison, et elle vaut partout. */
    baseVierge();
    duel.paire = [{ media:'movie', id:'1" onload="alert(1)', nom:'Piège', date:null },
                  { media:'movie', id:'2', nom:'Autre', date:null }];
    let html = '';
    const vraiOpen = window.openSheet, vraiCharge = window.chargerFiche;
    window.openSheet = h => { html = h; };
    /* `zoneBande` appelle `chargerFiche` dans un `setTimeout(…, 0)` : la rendre
       à sa place ici, dans le `finally` SYNCHRONE, la restituerait avant que le
       minuteur ne parte — et la vraie fonction irait sur le réseau. On rend donc
       la main par un minuteur à son tour : celui de `zoneBande` a été posé le
       premier, il passe le premier. */
    window.chargerFiche = ()=>{};
    /* `synopsisDe`, lui, est appelé tout de suite et va sur le réseau : le
       bouchon synchrone de `horsLigne` suffit pour celui-là. */
    horsLigne(()=>{
      try{ ficheDuel('movie', '1" onload="alert(1)'); }
      finally { window.openSheet = vraiOpen; }
    });
    setTimeout(()=>{ window.chargerFiche = vraiCharge; }, 0);
    const boite = document.createElement('div');
    boite.innerHTML = html;
    egal([...boite.querySelectorAll('[onload]')].length, 0,
         'un identifiant truqué a produit un attribut exécutable');
    /* Et les deux blocs restent retrouvables : `esc` protège la SOURCE, le
       parseur la redécode, donc `peindreSynopsisDuel` et `peindreBande`
       continuent de viser la clé brute. */
    vrai(boite.querySelector('[id^="syn-"]'), 'le bloc synopsis a disparu');
    vrai(boite.querySelector('[id^="ba-"]'), 'la zone bande-annonce a disparu');
    duel.paire = null;
  });

  test('le bouton « Bande-annonce » passe par escJs comme partout ailleurs', ()=>{
    /* Antérieur au lot, trouvé en écrivant le cas ci-dessus : la clé partait
       nue dans l'`onclick`. Elle est aujourd'hui « movie:550 » — le test fixe
       la règle, pas une faille. */
    const k = "movie:1');alert(1);//";
    const avant = bandes[k];
    bandes[k] = { key:'abc' };
    try{
      const boite = document.createElement('div');
      boite.innerHTML = boutonBande(k);
      const b = boite.querySelector('button[onclick]');
      vrai(b, 'aucun bouton produit : le test ne prouve rien');
      /* On ne cherche PAS la chaîne « alert » : elle survit légitimement à
         l'échappement, sous forme de texte. On EXÉCUTE le gestionnaire dans un
         bac à sable où `ouvrirBande` et `alert` sont deux paramètres — donc
         aucune boîte de dialogue réelle ne peut s'ouvrir — et on regarde ce qui
         arrive vraiment. */
      let recu = null;
      new Function('ouvrirBande', 'alert', b.getAttribute('onclick'))(
        x => { recu = x; },
        ()=>{ throw new Error('du code injecté s\'est exécuté'); });
      egal(recu, k, 'la clé n\'est pas arrivée intacte');
    } finally { if(avant === undefined) delete bandes[k]; else bandes[k] = avant; }
  });

  groupe('Lot A — la synchro');

  test('payload emporte les avis, leurs effacements et le podium', ()=>{
    baseVierge();
    const p = payload();
    ['avis','avisRetires','podium'].forEach(k=>{
      if(p[k] === undefined) throw new Error(k+' ne monte pas au serveur');
    });
  });

  test('un avis se fusionne titre par titre, le plus récent gagne', ()=>{
    /* Le bloc entier ne se remplace PAS : deux appareils qui ont noté dix
       titres différents doivent finir avec vingt avis. */
    baseVierge();
    db.avis.movie['1'] = { v:1, quand:1000 };
    db.avis.movie['9'] = { v:1, quand:1000 };
    fusionnerAvis({ avis:{ movie:{ '1':{v:-1,quand:2000},      // plus récent : gagne
                                   '2':{v:1,quand:500} } } }); // inconnu ici : arrive
    egal(avisDe('movie',1), -1, 'le plus récent n\'a pas gagné');
    egal(avisDe('movie',2), 1, 'un avis venu d\'ailleurs a été perdu');
    egal(avisDe('movie',9), 1, 'un avis local a été écrasé par un bloc distant');
  });

  test('un avis plus ANCIEN que le nôtre ne l\'écrase pas', ()=>{
    baseVierge();
    db.avis.movie['1'] = { v:1, quand:5000 };
    fusionnerAvis({ avis:{ movie:{ '1':{v:-1,quand:1000} } } });
    egal(avisDe('movie',1), 1);
  });

  test('un 👎 repris ici ne revient pas par la synchro', ()=>{
    /* Sans la trace d\'effacement, l\'autre appareil le croit toujours posé et
       le renvoie à la première synchro — le geste de reprise serait inutile. */
    baseVierge();
    db.avisRetires.movie['1'] = 5000;
    fusionnerAvis({ avis:{ movie:{ '1':{v:-1,quand:3000} } } });
    egal(avisDe('movie',1), 0, 'le 👎 est revenu de lui-même');
  });

  test('un effacement distant retire l\'avis d\'ici', ()=>{
    baseVierge();
    db.avis.movie['1'] = { v:1, quand:1000 };
    fusionnerAvis({ avisRetires:{ movie:{ '1':4000 } } });
    egal(avisDe('movie',1), 0);
  });

  test('le podium se remplace famille par famille, sur sa date', ()=>{
    baseVierge();
    db.podium.film = ['1','2']; db.podium.maj = 1000;
    fusionnerAvis({ podium:{ film:['9'], serie:[], anime:[], maj:500 } });
    egal(db.podium.film, ['1','2'], 'un podium plus ancien a gagné');
    fusionnerAvis({ podium:{ film:['9'], serie:[], anime:[], maj:2000 } });
    egal(db.podium.film, ['9']);
  });

  test('jouer une famille sur un autre appareil n\'efface pas celle d\'ici', ()=>{
    /* Le scénario réel : duel des films sur le téléphone, duel des séries sur
       la tablette. En remplaçant l'objet entier sur sa date, le podium des
       films disparaissait des DEUX appareils, sans un mot. */
    baseVierge();
    db.podium.film = ['11','12']; db.podium.maj = 1000;
    fusionnerAvis({ podium:{ film:[], serie:['99','98'], anime:[], maj:2000 } });
    egal(db.podium.film, ['11','12'], 'le podium des films a été effacé');
    egal(db.podium.serie, ['99','98'], 'le podium des séries n\'est pas arrivé');
  });

  test('une famille que seul le distant porte arrive, même s\'il est plus ancien', ()=>{
    baseVierge();
    db.podium.film = ['11']; db.podium.maj = 5000;
    fusionnerAvis({ podium:{ film:[], serie:['99'], anime:[], maj:1000 } });
    egal(db.podium.serie, ['99'], 'un podium que nous n\'avons pas a été refusé');
    egal(db.podium.maj, 5000, 'la date la plus récente a reculé');
  });

  test('un avis sans date franchit quand même la synchro', ()=>{
    /* `reparerAvis` garde un avis dont la date manque — export bricolé, base
       venue d'ailleurs — en lui posant `quand = 0`. Il ne doit pas rester
       prisonnier de son appareil pour autant : sans effacement en face, il
       passe. */
    baseVierge();
    db.avis.movie['5'] = { v:1 };
    reparerAvis();
    egal(avisDe('movie', 5), 1, 'l\'avis a été jeté au lieu d\'être daté à zéro');
    const paquet = payload();
    baseVierge();                                   // un appareil vierge
    fusionnerAvis(paquet);
    egal(avisDe('movie', 5), 1, 'l\'avis n\'a jamais quitté son appareil');
  });

  test('« Tes préférés » ne confond pas un film et une série de même identifiant', ()=>{
    /* Les espaces d'identifiants TMDB se recouvrent : 550 est Fight Club côté
       film ET un identifiant de série valide. Le podium ne garde que des
       identifiants nus. */
    baseVierge();
    db.movies[550] = film(550, ['Drame']); db.movies[550].title = 'Fight Club';
    db.shows[550] = serie(550, [ep(1,HIER)], {'1x1':1}); db.shows[550].name = 'Une série';
    db.podium.film = ['550']; db.podium.maj = 1;
    vrai(explicationProfil().podium.indexOf('Fight Club') >= 0,
         'le podium des films nomme un titre qui n\'a jamais été départagé');
  });

  test('reparerAvis jette un avis qui n\'en est pas un', ()=>{
    baseVierge();
    db.avis = { tv:{ '1':{v:2,quand:1}, '2':{v:-1} }, movie:null };
    db.podium = null; db.avisRetires = null;
    reparerAvis();
    egal(avisDe('tv',1), 0, 'un « v » inventé a été gardé');
    egal(avisDe('tv',2), -1);
    egal(db.avis.tv['2'].quand, 0, 'une date absente n\'a pas été comblée');
    egal(db.podium, { film:[], serie:[], anime:[], maj:0 });
    vrai(db.avisRetires && db.avisRetires.tv && db.avisRetires.movie, 'les traces manquent');
  });

  /* ==================== Bilan ==================== */
  const b = document.getElementById('bilan');
  b.className = 'bilan ' + (ko ? 'rouge' : 'vert');
  b.textContent = ko ? (ko + ' échec' + (ko>1?'s':'') + ' sur ' + n + ' tests')
                     : ('Tout passe — ' + n + ' tests');
  document.title = ko ? (ko + ' échec(s) — Mes Séries') : (n + ' tests OK — Mes Séries');
})();
