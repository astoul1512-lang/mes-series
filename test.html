<title>Tests — Mes Séries</title>
<!--
  Ouvre ce fichier dans un navigateur : le titre de l'onglet dit tout de suite
  si quelque chose est cassé, et la page détaille lequel.

  Ce ne sont PAS des tests d'écran. Ils portent sur les fonctions pures — celles
  dont personne ne peut valider le comportement à la lecture, et dont une
  régression est invisible :

    · `mergeRemote` et `noterDecoches` — la fusion entre deux appareils. Un CRDT
      artisanal de quatre-vingt-dix lignes d'arbitrage par horodatage. C'est le
      seul endroit du projet où une erreur peut RESSUSCITER ou EFFACER des
      épisodes vus sans que rien ne s'affiche.
    · `progress`, `isFinished`, `nextToWatch`, `statutSerie` — tout l'affichage
      en dépend.
    · `esc` et `escJs` — l'échappement. Le bug des acteurs à apostrophe aurait
      été attrapé par trois lignes ici.
    · `migrer` — il tourne au démarrage : une erreur empêche l'app de s'ouvrir.

  Les fichiers chargés sont les VRAIS, dans l'ordre d'`index.html`. `MODE_TEST`
  empêche `boot()` de démarrer l'app pour de bon.

  Ce fichier ne doit pas entrer dans le SHELL du service worker.
-->
<style>
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:0;padding:22px 18px 60px;
       background:#0b0d11;color:#e8eaee}
  h1{font-size:18px;margin:0 0 4px}
  .bilan{font-size:15px;font-weight:700;margin:0 0 18px;padding:10px 14px;border-radius:10px}
  .bilan.vert{background:#12301f;color:#5fe0a0}
  .bilan.rouge{background:#3a1418;color:#ff8a8a}

  .t{padding:3px 0 3px 22px;position:relative;border-bottom:1px solid #171a21}
  .t::before{position:absolute;left:0;top:3px}
  .ok::before{content:'✓';color:#3ecf8e}
  .ko::before{content:'✗';color:#ff6b6b}
  .ko{color:#ff9b9b}
  .ko em{display:block;color:#ff6b6b;font-style:normal;font-size:12.5px;padding-left:2px}
</style>

<!-- Le même squelette qu'`index.html`. Les scripts s'y accrochent au
     chargement (`#sheet` notamment) : sans lui, app-02 s'interrompt en pleine
     initialisation et la moitié du fichier ne s'exécute jamais. Masqué : on
     teste des fonctions, pas des écrans. -->
<div style="display:none">
  <div class="app" id="app"></div>
  <nav><div class="navin" id="nav"></div></nav>

<h1>Tests — Mes Séries</h1>
<div id="bilan" class="bilan">…</div>
<div id="out"></div>

<script>
/* `MODE_TEST` fait DEUX choses, et la seconde est la plus importante :
   1. elle empêche `boot()` et l'enregistrement du service worker ;
   2. elle force `memoryOnly`, donc AUCUNE écriture dans IndexedDB ni dans
      localStorage. Cette page charge les vrais scripts et partage l'origine de
      l'app : sans ce verrou, `migrer()` — appelé par les cas de migration —
      se termine par `saveDB()` et écrase la bibliothèque de la personne par la
      base vierge des tests. C'est arrivé en production le 30/07.
   NE JAMAIS retirer cette ligne, ni la déplacer après le chargement des
   scripts : `memoryOnly` est fixé au moment où app-01 s'évalue. */
window.MODE_TEST = true;
</script>
<script src="./app-01-noyau.js"></script>
<script src="./app-02-outils.js"></script>
<script src="./app-03-vues.js"></script>
<script src="./app-04-decouvrir.js"></script>
<script src="./app-05-plateformes.js"></script>
<script src="./app-06-serie.js"></script>
<script src="./app-07-partage.js"></script>
<script src="./app-09-notifications.js"></script>
<script src="./app-10-sorties.js"></script>
<script src="./app-11-gouts.js"></script>
<script src="./app-12-recherche.js"></script>
<script src="./app-13-inscription.js"></script>
<script src="./app-08-reglages.js"></script>

<script>
(function(){
  let n = 0, ko = 0;
  const sortie = document.getElementById('out');

  function groupe(titre){
    const d = document.createElement('div');
    d.className = 'grp'; d.textContent = titre;
    sortie.appendChild(d);
  }
  function test(nom, fn){
    n++;
    const d = document.createElement('div');
    try{
      fn();
      d.className = 't ok'; d.textContent = nom;
    }catch(e){
      ko++;
      d.className = 't ko'; d.textContent = nom;
      const em = document.createElement('em'); em.textContent = e.message;
      d.appendChild(em);
    }
    sortie.appendChild(d);
  }
  /* ===== LES CAS ASYNCHRONES =====
     Trois règles du lot E ne s'éprouvent QUE sur une fonction `async` :
     le remplissage d'une rangée de Découvrir (`remplirSugg`, point 12) va
     chercher la page suivante derrière un `await`. Le reste de cette page est
     synchrone et le reste — on met les cas asynchrones dans une file, jouée
     APRÈS tous les autres, et le bilan n'est écrit qu'à la fin.

     DEUX GARDE-FOUS, parce qu'un test qui bloque ne dit rien :
       · chaque cas est couru contre un délai maximum (`ASYNC_MAX`) ;
       · le lanceur (`tests/lance-tests.js`) attend `window.__testsFinis`
         plutôt que de lire le bilan à un instant qu'il aurait deviné. */
  const ASYNC_MAX = 4000;
  const fileAsync = [];
  function testAsync(nom, fn){ fileAsync.push({ nom:nom, fn:fn }); }
  function limite(p, nom){
    return new Promise((ok, ko2)=>{
      const t = setTimeout(()=> ko2(new Error('BLOQUÉ : plus de '+ASYNC_MAX+' ms')), ASYNC_MAX);
      Promise.resolve(p).then(v=>{ clearTimeout(t); ok(v); },
                              e=>{ clearTimeout(t); ko2(e); });
    });
  }
  async function jouerAsync(){
    for(const cas of fileAsync){
      n++;
      const d = document.createElement('div');
      try{
        await limite(cas.fn(), cas.nom);
        d.className = 't ok'; d.textContent = cas.nom;
      }catch(e){
        ko++;
        d.className = 't ko'; d.textContent = cas.nom;
        const em = document.createElement('em'); em.textContent = e.message;
        d.appendChild(em);
      }
      sortie.appendChild(d);
    }
  }
  function egal(a, b, msg){
    const sa = JSON.stringify(a), sb = JSON.stringify(b);
    if(sa !== sb) throw new Error((msg ? msg+' : ' : '')+'attendu '+sb+', obtenu '+sa);
  }
  function vrai(c, msg){ if(!c) throw new Error(msg || 'faux'); }

  /* Une base neuve à chaque test : les fonctions écrivent dans `db`, il ne
     faut pas qu'un test hérite de l'état du précédent. */
  function baseVierge(){
    db.shows = {}; db.movies = {};
    db.deleted = { shows:{}, movies:{} };
    db.gouts = { genres:[], exclus:[], acteurs:[], propose:true, jour:'',
                 plates:[], platesDemande:true, suggMesPlates:false,
                 graines:[], animeSous:[], pasVus:[] };
    /* LOT A — les trois clés du signal d'appréciation. Sans elles, un test qui
       pose un avis hériterait de celui du test précédent. */
    db.avis = { tv:{}, movie:{} };
    db.avisRetires = { tv:{}, movie:{} };
    db.podium = { film:[], serie:[], anime:[], maj:0 };
    /* R1 — le classement global. Sans lui, un test qui joue un duel hériterait
       des scores du test précédent : ils ne sont plus jetés à la fin. */
    db.classement = { film:{}, serie:{}, anime:{}, maj:0 };
    db.profil = { couleur:'corail', embleme:'lettre' };
    db.pseudo = ''; db.auth = null; db.v = 2;
  }
  const ep = (e, jour, st) => ({ e:e, n:'E'+e, d:jour, r:42, st:st||null });
  function serie(id, eps, vus, extra){
    return Object.assign({ id:id, name:'S'+id, status:'Ended', seasons:{1:eps},
                           watched:vus||{}, addedAt:1, updated:1 }, extra||{});
  }
  const HIER = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const DEMAIN = new Date(Date.now()+86400000).toISOString().slice(0,10);

  /* ==================== Échappement ==================== */
  groupe('Échappement');

  test('esc neutralise les cinq caractères dangereux', ()=>{
    egal(esc('<a href="x">&\'</a>'),
         '&lt;a href=&quot;x&quot;&gt;&amp;&#39;&lt;/a&gt;');
  });

  test("escJs survit à une apostrophe une fois posé dans un onclick", ()=>{
    /* Le vrai parcours : le parseur HTML décode, puis JavaScript lit. C'est
       exactement ce que `esc(...).replace()` ne faisait PAS. */
    window.__recu = null;
    const d = document.createElement('div');
    d.innerHTML = '<b onclick="window.__recu = \'' + escJs("O'Brien") + '\'"></b>';
    d.firstChild.click();
    egal(window.__recu, "O'Brien");
  });

  test('escJs survit aussi à une barre oblique inverse et à un guillemet', ()=>{
    window.__recu = null;
    const nom = 'A\\B"C\'D';
    const d = document.createElement('div');
    d.innerHTML = '<b onclick="window.__recu = \'' + escJs(nom) + '\'"></b>';
    d.firstChild.click();
    egal(window.__recu, nom);
  });

  test('cheminImage refuse ce qui n\'est pas un chemin TMDB', ()=>{
    ['https://x.fr/p.gif', '//evil.example/x.jpg', 'javascript:alert(1)',
     '/a.jpg" onerror="x', '/a//b.jpg', '', null, 42].forEach(c=>{
      if(cheminImage(c) !== null) throw new Error('accepté : '+JSON.stringify(c));
    });
  });
  test('cheminImage accepte les vrais chemins TMDB', ()=>{
    ['/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', '/a-b_c.1.png', '/t/p/w342/abc.jpg']
      .forEach(c=>{ if(cheminImage(c) !== c) throw new Error('refusé : '+c); });
  });

  /* ==================== Statut d'un titre ==================== */
  groupe('Statut d\'un titre');

  test('progress ne compte que ce qui est diffusé', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,HIER), ep(3,DEMAIN)], {'1x1':1});
    egal(progress(s), { watched:1, total:2, pct:50 });
  });

  test('nextToWatch SAUTE un épisode sans date au lieu de s\'arrêter dessus', ()=>{
    /* B4 : c'est le bug qui faisait disparaître une série entière du rail
       « À rattraper », sans que rien ne le signale. */
    const s = serie(1, [ep(1,HIER), ep(2,null), ep(3,HIER), ep(4,HIER)], {'1x1':1});
    const nx = nextToWatch(s);
    vrai(nx, 'aucun épisode proposé : la série disparaîtrait du rail');
    egal(nx.e, 3, 'épisode proposé');
  });

  test('nextToWatch s\'arrête bien sur une date future', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,DEMAIN), ep(3,HIER)], {'1x1':1});
    egal(nextToWatch(s), null, 'un épisode à venir a été proposé');
  });

  test('nextToWatch rend null quand tout est vu', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,HIER)], {'1x1':1,'1x2':1});
    egal(nextToWatch(s), null);
  });

  test('isFinished exige une série terminée ET intégralement vue', ()=>{
    const eps = [ep(1,HIER), ep(2,HIER)];
    vrai(!isFinished(serie(1, eps, {'1x1':1})), 'partiellement vue');
    vrai(!isFinished(serie(1, eps, {'1x1':1,'1x2':1}, {status:'Returning Series'})),
         'série non terminée');
    vrai(isFinished(serie(1, eps, {'1x1':1,'1x2':1})), 'terminée et tout vu');
  });

  test('statutSerie : les trois états, et la pause qui prime', ()=>{
    const eps = [ep(1,HIER), ep(2,HIER)];
    egal(statutSerie(serie(1, eps, {})), 'avoir');
    egal(statutSerie(serie(1, eps, {'1x1':1}, {status:'Returning Series'})), 'asuivre');
    egal(statutSerie(serie(1, eps, {'1x1':1,'1x2':1})), 'vu');
    egal(statutSerie(serie(1, eps, {'1x1':1}, {pause:true})), 'pause');
  });

  test('les hors-série ne comptent jamais dans la progression', ()=>{
    const s = serie(1, [ep(1,HIER)], {'1x1':1});
    s.seasons[0] = [ep(1,HIER), ep(2,HIER)];
    egal(progress(s).total, 1, 'la saison 0 a été comptée');
  });

  /* ==================== Fusion entre appareils ==================== */
  groupe('Fusion entre appareils — mergeRemote');

  test('une série inconnue arrive', ()=>{
    baseVierge();
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER)], {'1x1':1}) }, movies:{} });
    vrai(db.shows[7], 'la série n\'est pas arrivée');
    egal(progress(db.shows[7]).watched, 1);
  });

  test('les épisodes vus des deux côtés fusionnent, aucun n\'est perdu', ()=>{
    baseVierge();
    db.shows[7] = serie(7, [ep(1,HIER),ep(2,HIER),ep(3,HIER)], {'1x1':1});
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER),ep(2,HIER),ep(3,HIER)], {'1x3':1}) },
                  movies:{} });
    egal(Object.keys(db.shows[7].watched).sort(), ['1x1','1x3']);
  });

  test('un décochage RÉCENT gagne sur un vu ancien venu d\'ailleurs', ()=>{
    baseVierge();
    const local = serie(7, [ep(1,HIER)], {});
    local.unwatched = { '1x1': Date.now() };          // décoché ici, à l'instant
    db.shows[7] = local;
    const distant = serie(7, [ep(1,HIER)], { '1x1': Date.now() - 3600000 });
    mergeRemote({ shows:{ 7: distant }, movies:{} });
    vrai(!db.shows[7].watched['1x1'],
         'l\'épisode décoché est revenu : le décochage se perd à chaque synchro');
  });

  test('un vu RÉCENT gagne sur un décochage ancien', ()=>{
    baseVierge();
    const local = serie(7, [ep(1,HIER)], {});
    local.unwatched = { '1x1': Date.now() - 3600000 };
    db.shows[7] = local;
    const distant = serie(7, [ep(1,HIER)], { '1x1': Date.now() });
    mergeRemote({ shows:{ 7: distant }, movies:{} });
    vrai(db.shows[7].watched['1x1'], 'le recochage n\'a pas pris');
  });

  test('une série supprimée ici ne revient pas de l\'autre appareil', ()=>{
    baseVierge();
    markDeleted('shows', 7);
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER)], {'1x1':1}) }, movies:{},
                  deleted:{shows:{},movies:{}} });
    vrai(!db.shows[7], 'une série supprimée est ressuscitée par la synchro');
  });

  test('une série supprimée AILLEURS disparaît ici', ()=>{
    baseVierge();
    db.shows[7] = serie(7, [ep(1,HIER)], {'1x1':1});
    mergeRemote({ shows:{}, movies:{}, deleted:{ shows:{ 7: Date.now() }, movies:{} } });
    vrai(!db.shows[7], 'la suppression ne s\'est pas propagée');
  });

  test('une série RAJOUTÉE après sa suppression survit', ()=>{
    baseVierge();
    markDeleted('shows', 7);
    const rajoutee = serie(7, [ep(1,HIER)], {'1x1':1});
    rajoutee.addedAt = Date.now() + 1000;             // rajoutée après la suppression
    mergeRemote({ shows:{ 7: rajoutee }, movies:{}, deleted:{shows:{},movies:{}} });
    vrai(db.shows[7], 'une série rajoutée volontairement a été effacée');
  });

  test('un film vu plus récemment l\'emporte', ()=>{
    baseVierge();
    db.movies[3] = { id:3, title:'F', seen:false, watchedAt:1000 };
    mergeRemote({ shows:{}, movies:{ 3:{ id:3, title:'F', seen:true, watchedAt:2000 } } });
    vrai(db.movies[3].seen, 'le film vu ailleurs n\'est pas remonté');
  });

  test('normaliserSerie garantit watched et seasons', ()=>{
    const s = normaliserSerie({ id:9, name:'X' });
    egal(s.watched, {}); egal(s.seasons, {});
    egal(normaliserSerie(null), null);
    egal(normaliserSerie('bidon'), null);
  });

  test('une vignette locale n\'est pas effacée par une absence distante', ()=>{
    /* Ce que la normalisation existe pour garantir : le jour où les vignettes
       sortiront du payload (F5), un appareil à jour ne doit pas les perdre. */
    const local = serie(7, [ep(1,HIER,'/vignette.jpg')], {});
    const distant = serie(7, [ep(1,HIER,null)], {});
    const s = normaliserSerie(distant, local);
    egal(s.seasons[1][0].st, '/vignette.jpg');
  });

  test('un objet distant vide ou cassé ne casse pas la fusion', ()=>{
    baseVierge();
    mergeRemote({ shows:{ 1:null, 2:'bidon', 3:{} }, movies:{ 1:null } });
    egal(Object.keys(db.shows).length, 0);
    egal(Object.keys(db.movies).length, 0);
  });

  /* ==================== Préférences ==================== */
  groupe('Préférences — la plus récente gagne');

  test('des goûts plus récents s\'imposent en bloc', ()=>{
    baseVierge();
    db.gouts.genres = ['Drame']; db.gouts.maj = 1000;
    mergeRemote({ shows:{}, movies:{},
                  gouts:{ genres:['Comédie','Action'], exclus:[], acteurs:[],
                          plates:[], maj:2000 } });
    egal(db.gouts.genres, ['Comédie','Action']);
  });

  test('des goûts plus anciens ne remplacent rien', ()=>{
    baseVierge();
    db.gouts.genres = ['Drame']; db.gouts.maj = 3000;
    mergeRemote({ shows:{}, movies:{},
                  gouts:{ genres:['Comédie'], exclus:[], acteurs:[], plates:[], maj:2000 } });
    egal(db.gouts.genres, ['Drame']);
  });

  test('un avatar plus récent s\'impose', ()=>{
    baseVierge();
    db.profil = { couleur:'corail', maj:1000 };
    mergeRemote({ shows:{}, movies:{}, profil:{ couleur:'menthe', maj:2000 } });
    egal(db.profil.couleur, 'menthe');
  });

  test('payload emporte les préférences et AUCUN secret', ()=>{
    baseVierge();
    db.auth = { token:'JETON', refresh:'REFRESH', uid:'u', email:'a@b.fr' };
    db.syncDernierEchec = { quand:1, motif:'x' };
    const p = payload(), t = JSON.stringify(p);
    vrai(p.gouts !== undefined && p.profil !== undefined, 'préférences absentes');
    vrai(p.auth === undefined && p.sync === undefined, 'auth ou sync présents');
    vrai(p.syncDernierEchec === undefined, 'un état local part au serveur');
    vrai(p.v === undefined && p.proprio === undefined, 'schéma ou propriétaire envoyés');
    vrai(t.indexOf('JETON') < 0 && t.indexOf('REFRESH') < 0, 'UN JETON PART AU SERVEUR');
  });

  /* ==================== Migrations ==================== */
  groupe('Migrations — B7');

  test('une base sans version et avec l\'ancienne clé JWT est réparée', ()=>{
    baseVierge();
    delete db.v;
    db.sync = { url:'https://x.supabase.co', key:'eyJhbGciOiJIUzI1NiJ9.abc' };
    migrer();
    egal(db.v, SCHEMA, 'version');
    vrai(!/^eyJ/.test(db.sync.key), 'la clé héritée n\'a pas été remplacée');
  });

  test('une base déjà à jour n\'est pas retouchée', ()=>{
    baseVierge();
    db.v = SCHEMA;
    db.sync = { url:'https://x.supabase.co', key:'sb_publishable_abc' };
    migrer();
    egal(db.v, SCHEMA);
    egal(db.sync.key, 'sb_publishable_abc', 'la clé a été écrasée sans raison');
  });

  test('une base plus récente que le code est signalée, pas dégradée', ()=>{
    baseVierge();
    db.v = 99;
    db.sync = { url:'https://x.supabase.co', key:'eyJdonc_ancienne' };
    migrer();
    egal(db.v, 99, 'la version a été rétrogradée');
    vrai(db.schemaTropRecent, 'aucun signalement');
    egal(db.sync.key, 'eyJdonc_ancienne', 'une migration a tourné quand même');
  });

  test('une migration qui échoue ne bloque pas le démarrage', ()=>{
    baseVierge();
    delete db.v;
    const vraie = MIGRATIONS[2];
    MIGRATIONS[2] = function(){ throw new Error('boum'); };
    try{ migrer(); } finally { MIGRATIONS[2] = vraie; }
    egal(db.v, 1, 'la version a avancé malgré l\'échec');
  });

  /* ==================== Routes — C1 ==================== */
  groupe('Routes — C1');

  test('un écran simple se sérialise', ()=>{
    egal(routeVersFragment('discover', {}), '#/decouvrir');
    egal(routeVersFragment('follow', {}), '#/a-suivre');
  });

  test('un écran à identité porte son identité', ()=>{
    egal(routeVersFragment('show', {id:1399}), '#/serie/1399');
    egal(routeVersFragment('movie', {id:550}), '#/film/550');
    egal(routeVersFragment('acteur', {id:287}), '#/personne/287');
    egal(routeVersFragment('preview', {id:1399, type:'tv'}), '#/apercu/1399/tv');
  });

  test('se relit dans l\'autre sens', ()=>{
    egal(fragmentVersRoute('#/decouvrir'), {view:'discover', params:{}});
    egal(fragmentVersRoute('#/serie/1399'), {view:'show', params:{id:'1399'}});
    egal(fragmentVersRoute('#/apercu/550/movie'), {view:'preview', params:{id:'550', type:'movie'}});
    /* L'identifiant revient en CHAÎNE — une adresse ne transporte que du texte.
       `db.shows[params.id]` marche dans les deux cas (les clés d'objet sont des
       chaînes), mais un `===` sur un nombre, non. À retenir pour C3. */
    egal(typeof fragmentVersRoute('#/serie/1399').params.id, 'string');
  });

  test('l\'ancienne forme des notifications marche encore', ()=>{
    egal(fragmentVersRoute('#show-1399'), {view:'show', params:{id:'1399'}});
    egal(fragmentVersRoute('#movie-550'), {view:'movie', params:{id:'550'}});
    /* Sans le dièse non plus : le service worker manipule les deux formes. */
    egal(fragmentVersRoute('show-1399'), {view:'show', params:{id:'1399'}});
  });

  test('un identifiant qui n\'est pas un nombre est refusé', ()=>{
    egal(fragmentVersRoute('#/serie/abc'), null);
    egal(fragmentVersRoute('#/serie/'), null, 'identifiant vide accepté');
    egal(fragmentVersRoute('#/serie'), null, 'identifiant absent accepté');
    egal(fragmentVersRoute('#/serie/1399bis'), null);
  });

  test('un écran non partageable n\'a pas d\'adresse, dans les deux sens', ()=>{
    ['rangee','biblio','account','avatar','motdepasse'].forEach(v=>{
      vrai(routeVersFragment(v, {id:1}) === null, v+' se sérialise alors qu\'il ne devrait pas');
    });
    egal(fragmentVersRoute('#/compte'), null);
    egal(fragmentVersRoute('#/avatar'), null);
    egal(fragmentVersRoute('#/motdepasse'), null);
    egal(fragmentVersRoute('#/bibliotheque/abc'), null);
  });

    window.openSheet = h => { html = h; };
    /* `zoneBande` appelle `chargerFiche` dans un `setTimeout(…, 0)` : la rendre
       à sa place ici, dans le `finally` SYNCHRONE, la restituerait avant que le
       minuteur ne parte — et la vraie fonction irait sur le réseau. On rend donc
       la main par un minuteur à son tour : celui de `zoneBande` a été posé le

    window.chargerFiche = ()=>{};

    horsLigne(()=>{
      try{ ficheDuel('movie', '1" onload="alert(1)'); }
      finally { window.openSheet = vraiOpen; }

    const boite = document.createElement('div');
    boite.innerHTML = html;
    egal([...boite.querySelectorAll('[onload]')].length, 0,
         'un identifiant truqué a produit un attribut exécutable');
    /* Et les deux blocs restent retrouvables : `esc` protège la SOURCE, le

       continuent de viser la clé brute. */
    vrai(boite.querySelector('[id^="syn-"]'), 'le bloc synopsis a disparu');

  /* ==================== Recherche — lot B ====================
     Ce qui est vérifié ici, ce sont les trois choses qu'une régression casse
     en silence : la règle « le profil trie, il ne filtre jamais », les

  groupe('Recherche — la phrase et les recettes');

  /* Une base de recherche neuve : `ui.rech` est un état d'écran, il traîne
     d'un test à l'autre si on ne le remet pas. */
  function rechVierge(fam){
    baseVierge();
    delete db.avis; delete db.podium;
    ui.rech = null;
    const r = etatRech();
    r.fam = fam || 'film';

  /* ========== LOT E — POINT 8 : LES QUATRE CHEMINS DE RETOUR ==========

     LE MARQUEUR `params.rechOuvert` N'EXISTE PLUS. Il voyageait dans `params`
     et se perdait selon le chemin : le retour depuis une fiche de la
     bibliothèque (`show`) gardait la phrase, celui depuis un aperçu

     qui lit `dernierGo = {vue, dir, historique}` rempli par `go()` — les
     QUATRE chemins de retour y passent, il n'y a plus rien à perdre en route.

     LE TÉMOIN DU DÉFAUT est la puce « ↩ Reprendre » : elle ne s'écrit que dans
     `nouvelleOuvertureRech`, au moment de sauvegarder une phrase qu'on
     remplace. Si elle apparaît au retour, c'est que le retour a été traité
     comme une ouverture. On l'éprouve donc à l'ÉCRAN et pas seulement sur un
     booléen.

     On pilote de vrais `go()` plutôt qu'un navigateur : `dir:'back'` couvre la
     flèche de l'app et le balayage, `{depuisHistorique:true}` couvre le bouton
     matériel d'Android et celui du navigateur. */
  function rechPosee(){
    const r = rechVierge('film');
    r.amb = 'rigoler'; r.touche = true;        // une phrase composée à la main
    r.res = [t_(1,'movie'), t_(2,'movie')];
    r.charge = true; r.total = 351;
    return r;
  }
  function retourVers(depuis, retour){
    /* `go` repeint : on le musèle, on n'éprouve ici que la navigation. */
    const vraiRender = window.render, vraiCharger = window.chargerGrilleRech;
    const sauveV = view, sauveP = params;
    window.render = function(){};
    window.chargerGrilleRech = function(){};
    try{
      go('search', {});                                    // entrée par l'onglet du bas
      go(depuis, { id:1399, type:'tv', from:'search' });    // on ouvre un titre
      retour();                                            // et on revient
      return ouvertureRech();
    } finally {
      window.render = vraiRender; window.chargerGrilleRech = vraiCharger;
      view = sauveV; params = sauveP;
    }
  }
  /* Les quatre appels sont ceux que fait le code réel :
       · la flèche de l'app  → `goBack` → `go(cible, …, 'back', {remplacer:true})`
         (app-02 l.1011) ;
       · le balayage         → `glisseRetour.terminer` → `go(cible, …, 'back',
         {depuisHistorique:true})` quand il recule dans la pile (l.1168) ;
       · `popstate`          → même chose, `{depuisHistorique:true}`.
     On les rejoue tels quels plutôt que de piloter un navigateur. */
  [ ['une fiche de la bibliothèque', 'show',    ()=> go('search', {}, 'back', { remplacer:true })],
    ['un aperçu',                    'preview', ()=> go('search', {}, 'back', { remplacer:true })],
    ['la flèche de l\'app',          'movie',   ()=> go('search', {}, 'back', { remplacer:true })],
    ['le balayage ou le bouton matériel', 'show',
      ()=> go('search', {}, 'back', { depuisHistorique:true })]
  ].forEach(cas=>{

      const phrase = phraseTexte();
      const neuve = retourVers(cas[1], cas[2]);
      vrai(!neuve, 'le retour est traité comme une ouverture : la phrase est jetée');
      egal(phraseTexte(), phrase, 'la phrase n\'est pas revenue intacte');
      egal(r.res.length, 2, 'les résultats déjà chargés ont disparu');
      egal(r.reprise, null, 'la puce « ↩ Reprendre » a été armée : c\'est le témoin du défaut');
      const boite = document.createElement('div');
      boite.innerHTML = blocPhraseRech();
      vrai(boite.textContent.indexOf('Reprendre') < 0,
           'la puce « ↩ Reprendre » est à l\'écran après un simple retour');

    egal(raisonDuJour({ signal:'podium', nom:'Severance', famille:'serie' }),
         'Ta série préférée : Severance');
    vrai(!/ador/i.test(raisonDuJour({ signal:'aime', nom:'X', famille:'film' })),
         'jamais « adoré » sur un simple 👍 — c\'est le travers du §1.1');
  });

  test('le point de départ des rangées de cœur est un titre AIMÉ, pas regardé', ()=>{
    baseVierge();
    db.movies[7] = film(7, ['Drame']);          // vu, sans avis
    egal(graineEsprit(cadreSugg('movie')), null,
         '« vu » suffisait à devenir un modèle à copier : c\'est l\'équation fausse du §1.1');
    poserAvis('movie', 7, 1);
    const g = graineEsprit(cadreSugg('movie'));
    egal([g.id, g.signal], ['7','aime']);
    db.podium.film = ['7'];
    egal(graineEsprit(cadreSugg('movie')).signal, 'podium',
         'un duel joué autorise « ton film préféré », un 👍 seul ne l\'autorise pas');
  });

  test('les graines de la grille d\'amorçage comptent comme des 👍', ()=>{
    baseVierge();
    db.gouts.graines = [{ media:'movie', id:42, nom:'Le Sixième Sens', famille:'film' }];
    egal(titresAimesSugg(cadreSugg('movie')).map(t=>t.id), ['42'],
         'la grille demande « lesquels tu as AIMÉS » : les écarter fermerait les rangées de cœur');
  });

  test('la proposition du jour saute ce qui est écarté et ce qu\'on a déjà', ()=>{
    const c = vitrineVierge('tout');
    c.propositions = [d_(11), d_(12), d_(13)];
    db.movies[11] = film(11, ['Drame']);            // entré dans la bibliothèque entre-temps
    refuserSugg(d_(12));
    egal(propositionDuJour().id, 13);
  });

  groupe('LOT D — §3.8 : « Pas pour moi » n\'est pas un 👎');

  test('un refus n\'écrit rien dans db.avis', ()=>{
    const c = vitrineVierge('tout');
    c.propositions = [Object.assign({ pourquoi:'p' }, d_(11,'movie',[18]))];
    pasPourMoiProposition();
    egal(avisDe('movie', 11), 0, 'un refus de politesse est devenu un rejet ferme');
    egal(Object.keys(db.avis.movie).length, 0);
    vrai(estRefuseSugg('movie', 11), 'le titre écarté doit ne plus revenir');
  });

  test('la carte est remplacée immédiatement par le candidat suivant', ()=>{
    const c = vitrineVierge('tout');
    c.propositions = [d_(11), d_(12)];
    egal(propositionDuJour().id, 11);
    pasPourMoiProposition();
    egal(propositionDuJour().id, 12,
         'un geste qui ne change rien à l\'écran est un geste qu\'on ne refait pas');
  });

  test('un titre écarté sort de TOUTES les rangées, pas seulement de la sienne', ()=>{
    vitrineVierge('tout');
    refuserSugg(d_(5,'movie',[18]));
    const l = tamiser([d_(5), d_(6)], {}, cadreSugg('movie'), false);
    egal(l.map(x=>x.id), [6], 'le tamis du prochain calcul laisse repasser un titre refusé');
  });

  test('un titre écarté disparaît des rangées DÉJÀ calculées, sans attendre', ()=>{
    /* Les listes en mémoire ont été bâties avant le refus : si le retrait
       n'était fait qu'au calcul suivant, le titre qu'on vient d'écarter en
       grand réapparaîtrait aussitôt dans la rangée d'où il vient. */
    const c = vitrineVierge('tout');
    c.esprit = { titre:'X', id:1, media:'movie', l:[d_(5), d_(6)] };
    refuserSugg(d_(5,'movie',[18]));
    egal(rangeesSuggerees()[0].l.map(x=>x.id), [6]);
  });

  test('le malus de genre décale, il ne retire jamais rien', ()=>{
    vitrineVierge('tout');
    genresTMDB.movie = [{ id:18, nom:'Drame' }, { id:35, nom:'Comédie' }];
    genresTMDB.tv    = [{ id:18, nom:'Drame' }];
    [101,102,103].forEach(id => refuserSugg(d_(id,'movie',[18])));
    const dedans = [d_(1,'movie',[18]), d_(2,'movie',[35])];
    const dehors = classerParMalus(dedans);
    egal(dehors.length, 2, 'un malus léger a fait disparaître un titre');
    egal(dehors.map(x=>x.id).sort(), [1,2]);
    egal(dehors[0].id, 2, 'trois refus de drame et le drame reste en tête');
  });

  test('sans aucun refus, l\'ordre du moteur est conservé au titre près', ()=>{
    vitrineVierge('tout');
    const l = [d_(1), d_(2), d_(3)];
    egal(classerParMalus(l).map(x=>x.id), [1,2,3]);
  });

  groupe('LOT D — les genres, le cercle, les époques');

  test('les deux libellés du même genre se ramènent à un seul', ()=>{
    egal(genreCanon('Action & Adventure'), 'Action');
    egal(genreCanon('Sci-Fi & Fantasy'), 'Science-Fiction');
    egal(genreCanon('War & Politics'), 'Guerre');
    egal(genreCanon('Comédie'), 'Comédie', 'la canonisation normalise, elle ne filtre pas');
  });

  test('« Genres retenus » n\'écrit plus deux fois le même genre', ()=>{
    baseVierge();
    db.movies[1] = film(1, ['Action']);
    db.movies[2] = film(2, ['Action']);
    db.shows[3]  = serie(3, [ep(1,HIER)], {'1x1':1}, { genres:['Action & Adventure'] });
    ui.disc.type = 'tout';
    const g = explicationProfil(true).genres;
    egal(g.filter(x => genreCanon(x) === 'Action').length, 1,
         '« action, action & adventure » : le même genre compté deux fois');
  });

  test('le titre de la rangée de genre se suffit à lui-même', ()=>{
    egal(titreRangeeGenre('Drame'), 'Des drames pour toi');
    egal(titreRangeeGenre('Science-Fiction'), 'De la science-fiction pour toi');
    egal(titreRangeeGenre('Action & Adventure'), 'De l\'action pour toi');
    vrai(/Zarbi/.test(titreRangeeGenre('Zarbi')),
         'un genre inconnu doit rester nommé, pas disparaître');
  });

  test('les incontournables sont bornés par époque, et l\'époque est dans le titre', ()=>{
    vrai(DECENNIES_INCONT.every(d => /années/.test(d.titre)), 'l\'époque doit passer dans le titre');
    const d = decennieVitrine();
    vrai(DECENNIES_INCONT.indexOf(d) >= 0);
    const r = requeteIncont('movie', d);
    vrai(!r.p.with_genres, 'bornée par époque, PAS par genre — c\'est l\'antidote à la bulle');
    egal(r.p['primary_release_date.gte'], d.de);
  });

  test('un genre écarté ne ressort jamais, incontournables compris', ()=>{
    baseVierge();
    genresTMDB.movie = [{ id:27, nom:'Horreur' }, { id:18, nom:'Drame' }];
    genresTMDB.tv    = [];
    db.gouts.exclus  = ['Horreur'];
    const l = tamiser([d_(1,'movie',[27]), d_(2,'movie',[18])], {}, cadreSugg('movie'), false);
    egal(l.map(x=>x.id), [2], 'une consigne donnée par la personne a sauté');
  });

  test('la rangée des plateformes nomme les plateformes tant qu\'elles tiennent', ()=>{
    baseVierge();
    db.gouts.plates = [{ id:8, nom:'Netflix' }];
    egal(titreRangeePlates(), 'Sur Netflix');
    db.gouts.plates.push({ id:1899, nom:'Max' });
    egal(titreRangeePlates(), 'Sur Netflix et Max');
    db.gouts.plates.push({ id:337, nom:'Disney+' });
    egal(titreRangeePlates(), 'Sur tes plateformes');
  });

  test('le cercle classe par corroboration, puis par goût, puis par récence', ()=>{
    baseVierge();
    genresTMDB.movie = [{ id:18, nom:'Drame' }];
    genresTMDB.tv    = [];
    const aff = { poster:'/x.jpg', date:'2015-01-01', genres:['Drame'] };
    biblios.a = { movies:{ 1:Object.assign({ id:1, title:'Un', watchedAt:10 }, aff),
                           2:Object.assign({ id:2, title:'Deux', watchedAt:99 }, aff) } };
    biblios.b = { movies:{ 1:Object.assign({ id:1, title:'Un', watchedAt:5 }, aff) } };
    const l = cercleDepuisBiblios([{ id:'a' },{ id:'b' }], cadreSugg('movie'));
    egal(l.map(x=>x.id), [1,2],
         'le titre présent chez deux proches doit passer devant : c\'est la corroboration');
  });

  test('un identifiant venu d\'un proche qui n\'est pas un nombre n\'entre pas', ()=>{
    baseVierge();
    genresTMDB.movie = []; genresTMDB.tv = [];
    biblios.a = { movies:{ x:{ id:'1);alert(1)//', title:'Piège', poster:'/x.jpg', genres:[] } } };
    egal(cercleDepuisBiblios([{ id:'a' }], cadreSugg('movie')).length, 0,
         'frontière de confiance : cet identifiant part dans un onclick et dans un chemin d\'API');
  });

  test('les genres d\'un proche sont retraduits, sinon l\'exclusion saute', ()=>{
    baseVierge();
    genresTMDB.movie = [{ id:27, nom:'Horreur' }];
    genresTMDB.tv    = [];
    biblios.a = { movies:{ 1:{ id:1, title:'Peur', poster:'/x.jpg', genres:['Horreur'],
                               date:'2015-01-01' } } };
    const l = cercleDepuisBiblios([{ id:'a' }], cadreSugg('movie'));
    egal(l[0].genre_ids, [27]);
    db.gouts.exclus = ['Horreur'];
    egal(tamiser(l, {}, cadreSugg('movie'), true).length, 0);
  });

  groupe('LOT D — point 8 : les deux pavés de texte ont disparu');

  test('l\'écran ne porte plus qu\'un lien, sans chiffre ni explication', ()=>{
    baseVierge();
    db.movies[1] = film(1, ['Drame']);
    poserAvis('movie', 1, 1);
    const c = vitrineVierge('tout');
    db.movies[1] = film(1, ['Drame']);
    c.nouveautes = [d_(9)];
    const html = vitrineBody();
    vrai(/Ajuster mes goûts/.test(html), 'le lien qui remplace les deux pavés a disparu aussi');
    vrai(!/TMDB/.test(html), 'l\'aveu technique sur les plateformes est encore à l\'écran');
    vrai(!/Je pars de tes/.test(html), 'le rapport de diagnostic est encore à l\'écran');
    vrai(!/Genres retenus/.test(html));
    vrai(typeof window.blocProfilCourt === 'undefined', 'le bloc de profil traîne encore');
  });

  test('le réglage « seulement mes plateformes » n\'est pas resté orphelin', ()=>{
    baseVierge();
    egal(barreSuggPlates(), '', 'rien de déclaré : il n\'y a pas de question à poser');
    db.gouts.plates = [{ id:8, nom:'Netflix' }];
    vrai(/setSuggPlates/.test(barreSuggPlates()),
         'le choix a disparu de Découvrir sans réapparaître dans « Mes plateformes »');
    /* Les listes TMDB sont posées à la main : sans elles, `viewPlates` part
       les chercher sur le réseau, ce que cette page n'a pas le droit de faire. */
    platesTMDB.tv = [{ id:8, nom:'Netflix', logo:null, rang:1 }];
    platesTMDB.movie = platesTMDB.tv.slice();
    const p = view, q = params;
    view = 'plates'; params = { from:'settings' };
    let ecran = '';
    try{ ecran = viewPlates(); } finally { view = p; params = q; }
    platesTMDB.tv = null; platesTMDB.movie = null;
    vrai(/setSuggPlates/.test(ecran), 'l\'écran des plateformes ne porte pas le réglage');
  });

  test('la carte d\'appel au duel ne s\'affiche que si l\'app propose mal', ()=>{
    baseVierge();
    egal(carteProfilPauvre(), '', 'bibliothèque vide : c\'est la grille d\'amorçage qui parle');
    db.movies[1] = film(1, ['Drame']);
    vrai(/Je te propose mal/.test(carteProfilPauvre()));
    poserAvis('movie', 1, 1);
    egal(carteProfilPauvre(), '', 'un 👍 et elle doit s\'effacer d\'elle-même');
  });

  /* ==================== Bilan ====================
     Écrit UNE FOIS, après la file asynchrone. `window.__testsFinis` est le
     signal que le lanceur attend : sans lui il lirait un bilan encore
     provisoire et déclarerait la suite verte avant qu'elle ait fini. */
  window.__testsFinis = false;
  function bilan(){
    const b = document.getElementById('bilan');
    b.className = 'bilan ' + (ko ? 'rouge' : 'vert');
    b.textContent = ko ? (ko + ' échec' + (ko>1?'s':'') + ' sur ' + n + ' tests')
                       : ('Tout passe — ' + n + ' tests');
    document.title = ko ? (ko + ' échec(s) — Mes Séries') : (n + ' tests OK — Mes Séries');
  }
  bilan();                                   // provisoire : la page dit déjà où elle en est
  jouerAsync().then(()=>{
    bilan();
    window.__testsFinis = true;
  });
})();
</script>
</html>
