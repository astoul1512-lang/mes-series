<title>Tests — Mes Séries</title>
<!--
  Ouvre ce fichier dans un navigateur : le titre de l'onglet dit tout de suite
  si quelque chose est cassé, et la page détaille lequel.

  Ce ne sont PAS des tests d'écran. Ils portent sur les fonctions pures — celles
  dont personne ne peut valider le comportement à la lecture, et dont une
  régression est invisible :

    · `mergeRemote` et `noterDecoches` — la fusion entre deux appareils. Un CRDT
      artisanal de quatre-vingt-dix lignes d'arbitrage par horodatage. C'est le
      seul endroit du projet où une erreur peut RESSUSCITER ou EFFACER des
      épisodes vus sans que rien ne s'affiche.
    · `progress`, `isFinished`, `nextToWatch`, `statutSerie` — tout l'affichage
      en dépend.
    · `esc` et `escJs` — l'échappement. Le bug des acteurs à apostrophe aurait
      été attrapé par trois lignes ici.
    · `migrer` — il tourne au démarrage : une erreur empêche l'app de s'ouvrir.

  Les fichiers chargés sont les VRAIS, dans l'ordre d'`index.html`. `MODE_TEST`
  empêche `boot()` de démarrer l'app pour de bon.

  Ce fichier ne doit pas entrer dans le SHELL du service worker.
-->
<style>
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;margin:0;padding:22px 18px 60px;
       background:#0b0d11;color:#e8eaee}
  h1{font-size:18px;margin:0 0 4px}
  .bilan{font-size:15px;font-weight:700;margin:0 0 18px;padding:10px 14px;border-radius:10px}
  .bilan.vert{background:#12301f;color:#5fe0a0}
  .bilan.rouge{background:#3a1418;color:#ff8a8a}
  .grp{margin:20px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b93a3}
  .t{padding:3px 0 3px 22px;position:relative;border-bottom:1px solid #171a21}
  .t::before{position:absolute;left:0;top:3px}
  .ok::before{content:'✓';color:#3ecf8e}
  .ko::before{content:'✗';color:#ff6b6b}
  .ko{color:#ff9b9b}
  .ko em{display:block;color:#ff6b6b;font-style:normal;font-size:12.5px;padding-left:2px}
</style>

<!-- Le même squelette qu'`index.html`. Les scripts s'y accrochent au
     chargement (`#sheet` notamment) : sans lui, app-02 s'interrompt en pleine
     initialisation et la moitié du fichier ne s'exécute jamais. Masqué : on
     teste des fonctions, pas des écrans. -->
<div style="display:none">
  <div class="app" id="app"></div>
  <nav><div class="navin" id="nav"></div></nav>

<h1>Tests — Mes Séries</h1>
<div id="bilan" class="bilan">…</div>
<div id="out"></div>

<script>
/* `MODE_TEST` fait DEUX choses, et la seconde est la plus importante :
   1. elle empêche `boot()` et l'enregistrement du service worker ;
   2. elle force `memoryOnly`, donc AUCUNE écriture dans IndexedDB ni dans
      localStorage. Cette page charge les vrais scripts et partage l'origine de
      l'app : sans ce verrou, `migrer()` — appelé par les cas de migration —
      se termine par `saveDB()` et écrase la bibliothèque de la personne par la
      base vierge des tests. C'est arrivé en production le 30/07.
   NE JAMAIS retirer cette ligne, ni la déplacer après le chargement des
   scripts : `memoryOnly` est fixé au moment où app-01 s'évalue. */
window.MODE_TEST = true;
</script>
<script src="./app-01-noyau.js"></script>
<script src="./app-02-outils.js"></script>
<script src="./app-03-vues.js"></script>
<script src="./app-04-decouvrir.js"></script>
<script src="./app-05-plateformes.js"></script>
<script src="./app-06-serie.js"></script>
<script src="./app-07-partage.js"></script>
<script src="./app-09-notifications.js"></script>
<script src="./app-10-sorties.js"></script>
<script src="./app-11-gouts.js"></script>
<script src="./app-12-recherche.js"></script>
<script src="./app-13-inscription.js"></script>
<script src="./app-14-ia.js"></script>
<script src="./app-15-filtres.js"></script>
<script src="./app-16-duel-plus.js"></script>
<script src="./app-08-reglages.js"></script>

<script>
(function(){
  let n = 0, ko = 0;
  const sortie = document.getElementById('out');

  function groupe(titre){
    const d = document.createElement('div');
    d.className = 'grp'; d.textContent = titre;
    sortie.appendChild(d);
  }
  function test(nom, fn){
    n++;
    const d = document.createElement('div');
    try{
      fn();
      d.className = 't ok'; d.textContent = nom;
    }catch(e){
      ko++;
      d.className = 't ko'; d.textContent = nom;
      const em = document.createElement('em'); em.textContent = e.message;
      d.appendChild(em);
    }
    sortie.appendChild(d);
  }
  /* ===== LES CAS ASYNCHRONES =====
     Trois règles du lot E ne s'éprouvent QUE sur une fonction `async` :
     le remplissage d'une rangée de Découvrir (`remplirSugg`, point 12) va
     chercher la page suivante derrière un `await`. Le reste de cette page est
     synchrone et le reste — on met les cas asynchrones dans une file, jouée
     APRÈS tous les autres, et le bilan n'est écrit qu'à la fin.

     DEUX GARDE-FOUS, parce qu'un test qui bloque ne dit rien :
       · chaque cas est couru contre un délai maximum (`ASYNC_MAX`) ;
       · le lanceur (`tests/lance-tests.js`) attend `window.__testsFinis`
         plutôt que de lire le bilan à un instant qu'il aurait deviné. */
  const ASYNC_MAX = 4000;
  const fileAsync = [];
  function testAsync(nom, fn){ fileAsync.push({ nom:nom, fn:fn }); }
  function limite(p, nom){
    return new Promise((ok, ko2)=>{
      const t = setTimeout(()=> ko2(new Error('BLOQUÉ : plus de '+ASYNC_MAX+' ms')), ASYNC_MAX);
      Promise.resolve(p).then(v=>{ clearTimeout(t); ok(v); },
                              e=>{ clearTimeout(t); ko2(e); });
    });
  }
  async function jouerAsync(){
    for(const cas of fileAsync){
      n++;
      const d = document.createElement('div');
      try{
        await limite(cas.fn(), cas.nom);
        d.className = 't ok'; d.textContent = cas.nom;
      }catch(e){
        ko++;
        d.className = 't ko'; d.textContent = cas.nom;
        const em = document.createElement('em'); em.textContent = e.message;
        d.appendChild(em);
      }
      sortie.appendChild(d);
    }
  }
  function egal(a, b, msg){
    const sa = JSON.stringify(a), sb = JSON.stringify(b);
    if(sa !== sb) throw new Error((msg ? msg+' : ' : '')+'attendu '+sb+', obtenu '+sa);
  }
  function vrai(c, msg){ if(!c) throw new Error(msg || 'faux'); }

  /* Le CODE d'une fonction, commentaires retirés. Plusieurs cas ci-dessous
     lisent la source plutôt que de l'exécuter — c'est le seul moyen d'attraper
     un défaut de FORME (une ligne au mauvais endroit, un appelant qui oublie de
     se nommer). Sans ce nettoyage ils lisent aussi les commentaires, qui citent
     justement le code fautif : deux d'entre eux ont commencé par échouer sur la
     phrase qui expliquait leur propre correctif. */
  function codeDe(fn){
    return String(fn).replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/(^|[^:\w])\/\/[^\n]*/g, '$1');
  }

  /* Une base neuve à chaque test : les fonctions écrivent dans `db`, il ne
     faut pas qu'un test hérite de l'état du précédent. */
  function baseVierge(){
    db.shows = {}; db.movies = {};
    db.deleted = { shows:{}, movies:{} };
    db.gouts = { genres:[], exclus:[], acteurs:[], propose:true, jour:'',
                 plates:[], platesDemande:true, suggMesPlates:false,
                 graines:[], animeSous:[], pasVus:[] };
    /* LOT A — les trois clés du signal d'appréciation. Sans elles, un test qui
       pose un avis hériterait de celui du test précédent. */
    db.avis = { tv:{}, movie:{} };
    db.avisRetires = { tv:{}, movie:{} };
    db.podium = { film:[], serie:[], anime:[], maj:0 };
    /* R1 — le classement global. Sans lui, un test qui joue un duel hériterait
       des scores du test précédent : ils ne sont plus jetés à la fin. */
    db.classement = { film:{}, serie:{}, anime:{}, maj:0 };
    db.profil = { couleur:'corail', embleme:'lettre' };
    db.pseudo = ''; db.auth = null; db.v = 2;
  }
  const ep = (e, jour, st) => ({ e:e, n:'E'+e, d:jour, r:42, st:st||null });
  function serie(id, eps, vus, extra){
    return Object.assign({ id:id, name:'S'+id, status:'Ended', seasons:{1:eps},
                           watched:vus||{}, addedAt:1, updated:1 }, extra||{});
  }
  const HIER = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const DEMAIN = new Date(Date.now()+86400000).toISOString().slice(0,10);

  /* ==================== Échappement ==================== */
  groupe('Échappement');

  test('esc neutralise les cinq caractères dangereux', ()=>{
    egal(esc('<a href="x">&\'</a>'),
         '&lt;a href=&quot;x&quot;&gt;&amp;&#39;&lt;/a&gt;');
  });

  test("escJs survit à une apostrophe une fois posé dans un onclick", ()=>{
    /* Le vrai parcours : le parseur HTML décode, puis JavaScript lit. C'est
       exactement ce que `esc(...).replace()` ne faisait PAS. */
    window.__recu = null;
    const d = document.createElement('div');
    d.innerHTML = '<b onclick="window.__recu = \'' + escJs("O'Brien") + '\'"></b>';
    d.firstChild.click();
    egal(window.__recu, "O'Brien");
  });

  test('escJs survit aussi à une barre oblique inverse et à un guillemet', ()=>{
    window.__recu = null;
    const nom = 'A\\B"C\'D';
    const d = document.createElement('div');
    d.innerHTML = '<b onclick="window.__recu = \'' + escJs(nom) + '\'"></b>';
    d.firstChild.click();
    egal(window.__recu, nom);
  });

  test('cheminImage refuse ce qui n\'est pas un chemin TMDB', ()=>{
    ['https://x.fr/p.gif', '//evil.example/x.jpg', 'javascript:alert(1)',
     '/a.jpg" onerror="x', '/a//b.jpg', '', null, 42].forEach(c=>{
      if(cheminImage(c) !== null) throw new Error('accepté : '+JSON.stringify(c));
    });
  });
  test('cheminImage accepte les vrais chemins TMDB', ()=>{
    ['/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', '/a-b_c.1.png', '/t/p/w342/abc.jpg']
      .forEach(c=>{ if(cheminImage(c) !== c) throw new Error('refusé : '+c); });
  });

  /* ==================== Changer de serveur (S5) ==================== */
  groupe('Changer de serveur');

  test('une adresse en clair est refusée (S5)', ()=>{
    ['http://exemple.fr', 'http://exemple.fr/supabase', 'ftp://x.fr',
     'javascript:alert(1)', 'exemple.fr', 'https://', '', null, 42,
     'http://localhost.exemple.fr'   // le suffixe trompeur : ce n'est PAS local
    ].forEach(u=>{
      if(urlServeurValide(u)) throw new Error('acceptée : '+JSON.stringify(u));
    });
  });

  test('https et le serveur local restent acceptés (S5)', ()=>{
    ['https://abc.supabase.co', 'https://abc.supabase.co/',
     'http://localhost:54321', 'http://127.0.0.1:54321', 'http://localhost'
    ].forEach(u=>{
      if(!urlServeurValide(u)) throw new Error('refusée : '+JSON.stringify(u));
    });
  });

  /* LE CŒUR DE S5 : le jeton du serveur PRÉCÉDENT ne doit pas partir chez le
     suivant. `sbFetch` (app-01) pose `Authorization: Bearer db.auth.token` sur
     chaque appel — il suffit que `db.auth` survive au changement. */
  test('changer de serveur ferme la session en cours (S5)', ()=>{
    baseVierge();
    const oublie = (typeof oublierAppareil === 'function') ? oublierAppareil : null;
    if(oublie) oublierAppareil = ()=>{};        // aucun appel réseau depuis un test
    db.sync = { url:'https://ancien.supabase.co', key:'x'.repeat(30) };
    db.auth = { token:'jeton-de-l-ancien', uid:'u' };
    db.syncedAt = 123;
    syncEnAttente = { url:'https://nouveau.supabase.co', key:'y'.repeat(30) };
    try{
      appliquerSync();
      egal(db.sync.url, 'https://nouveau.supabase.co');
      egal(db.auth, null, 'le jeton de l\'ancien serveur a survécu au changement');
      egal(db.syncedAt, null);
      egal(syncEnAttente, null, 'la demande en attente n\'a pas été consommée');
    } finally {
      if(oublie) oublierAppareil = oublie;
      db.sync = Object.assign({}, DEFAULT_SYNC); db.auth = null;
    }
  });

  test('« Revenir au serveur d\'origine » sait qu\'il n\'y a rien à faire (S5)', ()=>{
    db.sync = Object.assign({}, DEFAULT_SYNC);
    vrai(!serveurPersonnalise(), 'le serveur d\'origine est pris pour un serveur perso');
    db.sync = { url:'https://ailleurs.fr', key:'z'.repeat(30) };
    vrai(serveurPersonnalise(), 'un serveur perso n\'est pas reconnu');
    db.sync = Object.assign({}, DEFAULT_SYNC);
  });

  /* S4 (09/08) — la photo d'un membre du cercle. Le danger n'est pas le script
     (l'attribut est échappé) : c'est la REQUÊTE RÉSEAU vers un serveur choisi
     par quelqu'un d'autre, qui lui livre notre adresse IP et l'heure à laquelle
     on ouvre l'app. Exactement ce que `cheminImage` empêche pour les affiches. */
  test('une photo de profil qui n\'est pas une image embarquée est ignorée (S4)', ()=>{
    ['https://sonserveur.fr/px.gif', '//evil.example/px.gif', 'http://x/p.png',
     'data:image/svg+xml;base64,PHN2Zz48L3N2Zz4=',   // un document, pas une image
     'data:text/html;base64,PGgxPng8L2gxPg==',
     'data:image/jpeg,pas-du-base64', 'javascript:alert(1)', '/local.jpg',
     '', null, 42].forEach(c=>{
      if(photoAvatar(c) !== null) throw new Error('acceptée : '+JSON.stringify(c));
    });
    const html = avatarDe({ pseudo:'Léa', photo:'https://sonserveur.fr/px.gif' }, 'moyen');
    vrai(html.indexOf('<img') < 0, 'une balise img est rendue malgré tout');
    vrai(html.indexOf('sonserveur') < 0, 'l\'adresse du tiers est encore dans la page');
  });

  test('une vraie photo d\'avatar s\'affiche comme avant (S4)', ()=>{
    const p = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ==';
    egal(photoAvatar(p), p);
    const html = avatarDe({ pseudo:'Léa', photo:p }, 'moyen');
    vrai(html.indexOf('<img') === 0 && html.indexOf(p) > 0, 'la photo ne s\'affiche plus');
  });

  test('une photo hors des bornes de la migration 006 est refusée (S4)', ()=>{
    vrai(photoAvatar('data:image/jpeg;base64,' + 'A'.repeat(PHOTO_MAX)) === null,
         'un data-URI aberrant passe encore');
  });

  /* S3 (09/08) — l'identifiant d'un proche traverse SIX gestionnaires de
     `ligneAbo`, et il vient de la table `profils` : c'est une donnée écrite
     par quelqu'un d'autre. Le test emprunte le VRAI chemin, comme les deux cas
     `escJs` ci-dessus — on pose le HTML dans le document et on clique. */
  test('l\'identifiant d\'un proche ne s\'évade pas d\'un onclick (S3)', ()=>{
    const PIEGE = "x');window.__evade=1;('";
    const vraiClic = glisAboClic;
    let recu = null;
    window.__evade = 0;
    glisAboClic = (e, id)=>{ recu = id; };
    try{
      const d = document.createElement('div');
      d.innerHTML = ligneAbo({ id:PIEGE, pseudo:'Léa' }, 'suivi');
      document.body.appendChild(d);
      d.querySelector('.glisrow').click();
      egal(recu, PIEGE, 'l\'identifiant n\'arrive pas entier au gestionnaire');
      egal(window.__evade, 0, 'du code glissé dans l\'identifiant s\'est exécuté');
      d.remove();
    } finally { glisAboClic = vraiClic; }
  });

  /* Le point d'entrée : une ligne de `recommandations` hors contrat est jetée à
     l'arrivée, comme le cercle l'est déjà dans `cercleDepuisBiblios`. */
  testAsync('une recommandation hors contrat est jetée à l\'entrée (S3)', async ()=>{
    baseVierge();
    db.auth = { token:'t', uid:'moi' };
    const vraiFetch = sbFetch;
    sbFetch = async ()=> ([
      { id:'a', de:'lui', vers:'moi', type:'tv',     tmdb_id:1399,  titre:'Conforme' },
      { id:'b', de:'lui', vers:'moi', type:'script', tmdb_id:1399,  titre:'Type hors contrat' },
      { id:'c', de:'lui', vers:'moi', type:'tv',     tmdb_id:'1);x', titre:'Identifiant douteux' },
      { id:'d', de:'lui', vers:'moi', type:'movie',  tmdb_id:null,  titre:'Sans identifiant' }
    ]);
    try{
      await chargerConseils();
      egal(conseils.recues.map(x=>x.id), ['a'], 'le filtre d\'entrée laisse passer autre chose');
      const html = blocConseilsRecus();
      vrai(html.indexOf('Type hors contrat') < 0 && html.indexOf('Identifiant douteux') < 0,
           'une ligne hors contrat s\'affiche encore');
      vrai(html.indexOf('Conforme') >= 0, 'la ligne conforme a disparu avec les autres');
    } finally {
      sbFetch = vraiFetch; db.auth = null;
      conseils.recues = []; conseils.envoyees = []; conseils.charge = false;
    }
  });

  /* S2 (09/08) — `ligne()` est locale à `viewSettings()` : on ne peut pas
     l'appeler seule, et c'est très bien — ce qui compte est ce que l'écran
     PEINT. Le nom de plateforme est la donnée la plus exposée du lot : elle
     arrive de la synchro distante ET de l'import de fichier, et personne ne la
     valide entre les deux. */
  test('un nom de plateforme hostile ressort en texte, pas en HTML (S2)', ()=>{
    baseVierge();
    db.gouts.plates = [{ id:8, nom:'<img src=x onerror="window.__xss=1">' }];
    const html = viewSettings();
    vrai(html.indexOf('<img src=x') < 0, 'le nom de plateforme est injecté tel quel');
    vrai(html.indexOf('&lt;img src=x') >= 0, 'le nom de plateforme n\'apparaît pas échappé');
  });

  test('deux plateformes hostiles : les deux sont échappées (S2)', ()=>{
    baseVierge();
    db.gouts.plates = [{ id:8, nom:'<b>A</b>' }, { id:9, nom:'<i>B</i>' }];
    const html = viewSettings();
    vrai(html.indexOf('<b>A</b>') < 0 && html.indexOf('<i>B</i>') < 0,
         'le résumé « A et B » laisse passer du HTML');
  });

  /* L'autre moitié de S2 : `ligne()` échappant désormais lui-même, l'appelant
     qui échappait déjà produirait `&amp;#39;` à l'écran. */
  test('l\'adresse du compte n\'est pas doublement échappée (S2)', ()=>{
    baseVierge();
    db.auth = { email:'o\'brien@exemple.fr', token:'t', uid:'u' };
    const html = viewSettings();
    vrai(html.indexOf('&amp;#39;') < 0, 'double échappement de l\'apostrophe');
    vrai(html.indexOf('o&#39;brien@exemple.fr') >= 0, 'l\'adresse ne s\'affiche plus');
    db.auth = null;
  });

  /* ==================== Statut d'un titre ==================== */
  groupe('Statut d\'un titre');

  test('progress ne compte que ce qui est diffusé', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,HIER), ep(3,DEMAIN)], {'1x1':1});
    egal(progress(s), { watched:1, total:2, pct:50 });
  });

  test('nextToWatch SAUTE un épisode sans date au lieu de s\'arrêter dessus', ()=>{
    /* B4 : c'est le bug qui faisait disparaître une série entière du rail
       « À rattraper », sans que rien ne le signale. */
    const s = serie(1, [ep(1,HIER), ep(2,null), ep(3,HIER), ep(4,HIER)], {'1x1':1});
    const nx = nextToWatch(s);
    vrai(nx, 'aucun épisode proposé : la série disparaîtrait du rail');
    egal(nx.e, 3, 'épisode proposé');
  });

  test('nextToWatch s\'arrête bien sur une date future', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,DEMAIN), ep(3,HIER)], {'1x1':1});
    egal(nextToWatch(s), null, 'un épisode à venir a été proposé');
  });

  test('nextToWatch rend null quand tout est vu', ()=>{
    const s = serie(1, [ep(1,HIER), ep(2,HIER)], {'1x1':1,'1x2':1});
    egal(nextToWatch(s), null);
  });

  test('isFinished exige une série terminée ET intégralement vue', ()=>{
    const eps = [ep(1,HIER), ep(2,HIER)];
    vrai(!isFinished(serie(1, eps, {'1x1':1})), 'partiellement vue');
    vrai(!isFinished(serie(1, eps, {'1x1':1,'1x2':1}, {status:'Returning Series'})),
         'série non terminée');
    vrai(isFinished(serie(1, eps, {'1x1':1,'1x2':1})), 'terminée et tout vu');
  });

  test('statutSerie : les trois états, et la pause qui prime', ()=>{
    const eps = [ep(1,HIER), ep(2,HIER)];
    egal(statutSerie(serie(1, eps, {})), 'avoir');
    egal(statutSerie(serie(1, eps, {'1x1':1}, {status:'Returning Series'})), 'asuivre');
    egal(statutSerie(serie(1, eps, {'1x1':1,'1x2':1})), 'vu');
    egal(statutSerie(serie(1, eps, {'1x1':1}, {pause:true})), 'pause');
  });

  test('les hors-série ne comptent jamais dans la progression', ()=>{
    const s = serie(1, [ep(1,HIER)], {'1x1':1});
    s.seasons[0] = [ep(1,HIER), ep(2,HIER)];
    egal(progress(s).total, 1, 'la saison 0 a été comptée');
  });

  /* ==================== Fusion entre appareils ==================== */
  groupe('Fusion entre appareils — mergeRemote');

  test('une série inconnue arrive', ()=>{
    baseVierge();
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER)], {'1x1':1}) }, movies:{} });
    vrai(db.shows[7], 'la série n\'est pas arrivée');
    egal(progress(db.shows[7]).watched, 1);
  });

  test('les épisodes vus des deux côtés fusionnent, aucun n\'est perdu', ()=>{
    baseVierge();
    db.shows[7] = serie(7, [ep(1,HIER),ep(2,HIER),ep(3,HIER)], {'1x1':1});
    mergeRemote({ shows:{ 7: serie(7, [ep(1,HIER),ep(2,HIER),ep(3,HIER)], {'1x3':1}) },
                  movies:{} });
    egal(Object.keys(db.shows[7].watched).sort(), ['1x1','1x3']);
  });

  test('on ne promet la rangée que si elle part vraiment de notre titre', ()=>{

        baseVierge();

        fermerDuel();
        return t;
      };
      window.graineEsprit = ()=> ({ media:'tv', id:'21', nom:'S21',

    window.openSheet = h => { html = h; };
    /* `zoneBande` appelle `chargerFiche` dans un `setTimeout(…, 0)` : la rendre

    window.chargerFiche = ()=>{};

    horsLigne(()=>{

    boite.innerHTML = html;
    egal([...boite.querySelectorAll('[onload]')].length, 0,
         'un identifiant truqué a produit un attribut exécutable');
    /* Et les deux blocs restent retrouvables : `esc` protège la SOURCE, le

  /* ==================== Recherche — lot B ====================
     Ce qui est vérifié ici, ce sont les trois choses qu'une régression casse
     en silence : la règle « le profil trie, il ne filtre jamais », les
     recettes mesurées (qu'un ajustement au jugé rendrait simplement moins

  groupe('Recherche — la phrase et les recettes');

  /* Une base de recherche neuve : `ui.rech` est un état d'écran, il traîne
     d'un test à l'autre si on ne le remet pas. */
  function rechVierge(fam){
    baseVierge();
    delete db.avis; delete db.podium;
    ui.rech = null;
    const r = etatRech();
    r.fam = fam || 'film';
    return r;
  }

  test('les dix recettes tiennent les trois règles du §4.6', ()=>{
    RECH_AMBIANCES.forEach(a=>{

      Object.keys(a.fond||{}).forEach(k => { clés[k] = 1; });
      vrai(Object.keys(clés).length >= 3, a.id+' : moins de trois ingrédients');
      vrai(a.mesure >= 50 && a.mesure <= 500, a.id+' : mesuré hors de la fourchette 50–500');
    });
    /* Règle 3 : « Pour regarder à deux » a été écartée, elle ne doit pas
       réapparaître par la petite porte. */
    vrai(!RECH_AMBIANCES.some(a=>/deux/i.test(a.t)), 'une ambiance écartée est revenue');
  });

  /* LOT E — `paramsRech(media)` N'EXISTE PLUS. La grille n'est plus « une
     requête paginée » mais une LISTE DE FLUX. Les trois remplaçantes :
       · `paramsSocleRech(media)` — ce que TOUTE requête porte (famille,
         recette mesurée, note, plateformes) ;
       · `jeuxParamsRech(media)`  — un jeu de paramètres par combinaison
         (point 6 : l'UNION) ;
       · `etagesRech()`           — les étages de la SÉQUENCE (point 14).
     Les règles éprouvées ci-dessous n'ont pas bougé d'un mot : elles changent
     seulement de point d'entrée. */
  test('une recette part telle qu\'elle a été mesurée', ()=>{
    const r = rechVierge('film');
    r.amb = 'famille';
    const p = paramsSocleRech('movie');
    egal(p.with_genres, '10751', 'genre');

    egal(p['vote_average.gte'], '6.3', 'note');
    egal(p['vote_count.gte'], '500', 'plancher de votes');
    /* Rien à décomposer : le socle EST la requête, et il n'y en a qu'une. */
    egal(jeuxParamsRech('movie').length, 1, 'une recette nue part en plusieurs requêtes');
  });

  test('retirer un mot retire son ingrédient, et lui seul', ()=>{
    const r = rechVierge('film');

     l'inverse (« la phrase n'est jamais vide »). À l'ouverture, la phrase ne
     porte plus que le sujet, la famille est « Tout », et rien ne force les

  test('cycle 3, point 1 — la phrase est VIDE à l\'ouverture, sur la famille « Tout »', ()=>{

  test('cycle 3, point 1 — sans critère, aucune requête ne porte les plateformes', ()=>{

    genresTMDB.movie = [{ id:16, nom:'Animation' }];

    const e = etagesRech();
    const medias = {};
    e.forEach(x => x.flux.forEach(f => {
      medias[f.media] = 1;
      vrai(f.p.with_watch_providers === undefined,
           'une requête sans critère est restreinte aux plateformes déclarées');
      vrai(f.p.without_genres === undefined,

    egal(Object.keys(medias).sort().join(','), 'movie,tv',

    genresTMDB.tv = null; genresTMDB.movie = null;

  test('cycle 3, point 1 — sous Films, l\'animation revient si (et seulement si) son genre est coché', ()=>{
    const r = rechVierge('film');

  test('cycle 3, point 3 — changer de puce vide la grille ; poser un mot la garde', ()=>{
    const r = rechVierge('film');

    r.res = [{ id:1, __media:'movie', genre_ids:[] }, { id:2, __media:'movie', genre_ids:[] }];
    r.charge = true;
    /* Poser un mot : `relancerRech` garde les affiches (point 5 du cycle 2)… */
    const vraiCharger = window.chargerGrilleRech, vraiRender = window.render;

      /* …changer de puce : on vide franchement, l\'ancien catalogue ment. */

      egal(r.charge, false, 'l\'écran croit encore que la grille est chargée');

  /* ========== CYCLE 3, POINT 2 — le calendrier d'« En cours » ==========
     Une série « à voir » DÉJÀ DIFFUSÉE ne remplit plus le calendrier ; une
     série « à voir » PAS ENCORE diffusée y annonce sa première ; les séries
     commencées gardent leurs prochains épisodes, sans étiquette. */
  groupe('Cycle 3, point 2 — « En cours » et les séries à voir');

  function calFollow(){
    /* Le HTML de l'écran entier : le correctif vit dans la boucle du
       calendrier de `viewFollow`, on l'éprouve par ce qui est peint. */
    oublierOrdreRattrapage();
    return viewFollow();
  }

  test('une série à voir DÉJÀ diffusée n\'apparaît nulle part', ()=>{
    baseVierge();
    /* Le cas de la capture d'Adrien : *Grand Blue Dreaming*, diffusée depuis
       des années, dans la liste à voir, épisodes futurs annoncés. */
    db.shows[901] = serie(901, [ep(1, HIER), ep(2, DEMAIN)], {},
                          { status:'Returning Series', first:'2018-07-14' });
    const html = calFollow();
    vrai(html.indexOf('S901') < 0, 'la série à voir déjà diffusée remplit encore le calendrier');
  });

  test('une série à voir SANS date de première connue n\'apparaît pas non plus', ()=>{
    baseVierge();
    db.shows[902] = serie(902, [ep(1, DEMAIN)], {}, { status:'Returning Series' });
    const html = calFollow();
    vrai(html.indexOf('S902') < 0,
         'sans date de première, on doit retenir plutôt que déverser');
  });

  /* TEST DURCI PAR LA CORRECTION C2 (tranchée le 06/08 : « seulement la
     première »). Il se contentait jusqu'ici de vérifier que l'étiquette
     « Premier épisode » n'apparaissait QU'UNE FOIS — ce qui laissait passer les
     épisodes suivants, simplement non étiquetés. Il exige désormais UNE SEULE
     LIGNE pour toute la série. Le durcissement est déclaré ici pour que la
     prochaine relecture ne le prenne pas pour une réécriture de complaisance. */
  test('une série à voir PAS ENCORE diffusée annonce sa première, ET RIEN D\'AUTRE', ()=>{
    baseVierge();
    const APRES = new Date(Date.now()+8*86400000).toISOString().slice(0,10);
    db.shows[903] = serie(903, [ep(1, DEMAIN), ep(2, APRES)], {},
                          { status:'Returning Series', first: DEMAIN });
    const html = calFollow();
    vrai(html.indexOf('S903') >= 0, 'la série jamais diffusée a disparu du calendrier');
    vrai(html.indexOf('Premier épisode') >= 0, 'l\'étiquette « Premier épisode » manque');
    /* UNE ligne, pas une par épisode annoncé : c'est tout l'objet de C2. */
    egal((html.match(/S903/g)||[]).length, 1,
         'la série jamais diffusée pose plus d\'une ligne : ses épisodes suivants '+
         'n\'ont rien à faire là avant qu\'elle soit commencée');
    egal((html.match(/Premier épisode/g)||[]).length, 1,
         'l\'étiquette doit marquer la première, et elle seule');
    vrai(html.indexOf('S1E2') < 0 && html.indexOf('E2') < 0,
         'le deuxième épisode d\'une série jamais diffusée est annoncé');
    vrai(html.indexOf('Pas commencé') < 0, 'l\'ancienne étiquette « Pas commencé » est revenue');
    /* Et pas dans « À rattraper » : on ne rattrape pas ce qu\'on n\'a pas commencé. */
    vrai(html.indexOf('rattrap') < 0 || html.split('data-rail="rattrap"').length === 1,
         'une série jamais commencée est entrée dans « À rattraper »');
  });

  test('C2 — la série jamais diffusée retrouve TOUS ses épisodes une fois commencée', ()=>{
    /* Le pendant obligatoire du durcissement : la restriction ne doit valoir
       que tant que la série n'est pas commencée. Sinon on aurait « corrigé »

  /* ========== LOT E — POINT 8 : LES QUATRE CHEMINS DE RETOUR ==========

     LE MARQUEUR `params.rechOuvert` N'EXISTE PLUS. Il voyageait dans `params`
     et se perdait selon le chemin : le retour depuis une fiche de la
     bibliothèque (`show`) gardait la phrase, celui depuis un aperçu
     (`preview`) la jetait. Il est remplacé par `arriveeNeuve(vue)` (app-02),
     qui lit `dernierGo = {vue, dir, historique}` rempli par `go()` — les
     QUATRE chemins de retour y passent, il n'y a plus rien à perdre en route.

     LE TÉMOIN DU DÉFAUT est la puce « ↩ Reprendre » : elle ne s'écrit que dans
     `nouvelleOuvertureRech`, au moment de sauvegarder une phrase qu'on
     remplace. Si elle apparaît au retour, c'est que le retour a été traité
     comme une ouverture. On l'éprouve donc à l'ÉCRAN et pas seulement sur un
     booléen.

     On pilote de vrais `go()` plutôt qu'un navigateur : `dir:'back'` couvre la
     flèche de l'app et le balayage, `{depuisHistorique:true}` couvre le bouton
     matériel d'Android et celui du navigateur. */
  function rechPosee(){
    const r = rechVierge('film');
    r.amb = 'rigoler'; r.touche = true;        // une phrase composée à la main
    r.res = [t_(1,'movie'), t_(2,'movie')];
    r.charge = true; r.total = 351;
    return r;
  }
  function retourVers(depuis, retour){
    /* `go` repeint : on le musèle, on n'éprouve ici que la navigation. */
    const vraiRender = window.render, vraiCharger = window.chargerGrilleRech;
    const sauveV = view, sauveP = params;
    window.render = function(){};
    window.chargerGrilleRech = function(){};
    try{
      go('search', {});                                    // entrée par l'onglet du bas
      go(depuis, { id:1399, type:'tv', from:'search' });    // on ouvre un titre
      retour();                                            // et on revient
      return ouvertureRech();
    } finally {
      window.render = vraiRender; window.chargerGrilleRech = vraiCharger;
      view = sauveV; params = sauveP;
    }
  }
  /* Les quatre appels sont ceux que fait le code réel :
       · la flèche de l'app  → `goBack` → `go(cible, …, 'back', {remplacer:true})`
         (app-02 l.1011) ;
       · le balayage         → `glisseRetour.terminer` → `go(cible, …, 'back',
         {depuisHistorique:true})` quand il recule dans la pile (l.1168) ;
       · `popstate`          → même chose, `{depuisHistorique:true}`.
     On les rejoue tels quels plutôt que de piloter un navigateur. */
  [ ['une fiche de la bibliothèque', 'show',    ()=> go('search', {}, 'back', { remplacer:true })],
    ['un aperçu',                    'preview', ()=> go('search', {}, 'back', { remplacer:true })],
    ['la flèche de l\'app',          'movie',   ()=> go('search', {}, 'back', { remplacer:true })],
    ['le balayage ou le bouton matériel', 'show',
      ()=> go('search', {}, 'back', { depuisHistorique:true })]

      egal(r.res.length, 2, 'les résultats déjà chargés ont disparu');
      egal(r.reprise, null, 'la puce « ↩ Reprendre » a été armée : c\'est le témoin du défaut');
      const boite = document.createElement('div');
      boite.innerHTML = blocPhraseRech();
      vrai(boite.textContent.indexOf('Reprendre') < 0,
           'la puce « ↩ Reprendre » est à l\'écran après un simple retour');

      const veille = new Date(2026, 0, 1, 23, 59, 50).getTime();

      Date.now = ()=> veille;
      const a = todayISO();

      /* +20 s : on a changé de jour, mais la mémoire tient encore. C'est le

         d'Adrien, tous pour la même chaîne. */
      Date.now = ()=> veille + 20000;

      /* +40 s : la mémoire a expiré, le passage de minuit est rattrapé. */
      Date.now = ()=> veille + 40000;

  function vitrineVierge(type){

       à zéro, un test qui montre trois jours de suite le même identifiant
       ferait reculer un titre dans le test suivant, qui échouerait alors pour
       une raison qui n'est pas la sienne. */
    try{ localStorage.removeItem(MEMO_CLE); }catch(e){}
    memoRangees = null; memoFige = null;
    oublierSuggestions();
    const c = suggCourantes();
    Object.assign(c, suggVide());
    c.etat = 'ok'; c.quand = Date.now();
    return c;

  /* ==================== Effacement consenti — C2 ====================
     Deux défauts distincts, réunis parce qu'ils produisent la même perte :

       · `doSupprimerCompte` laissait `db.proprio` sur un compte détruit — le

     Les cas sont asynchrones : la question passe par une promesse. La feuille
     de confirmation est remplacée par un espion — on éprouve la MÉCANIQUE de
     `applySession` (est-ce qu'on demande ? qu'est-ce qu'on fait de la
     réponse ?), pas le dessin du panneau, qui a ses deux cas à lui plus bas. */
  groupe('Effacement consenti — C2');

  /* Une réponse de serveur d'authentification, réduite à ce que le code lit. */
  function session(uid){
    return { access_token:'jeton-'+uid, refresh_token:'refresh-'+uid,
             user:{ id:uid, email:uid+'@exemple.fr' } };
  }
  /* Remplace la feuille ET la synchro le temps d'un cas, puis les rend :
     `syncNow` partirait sur le réseau, ce que cette page n'a pas le droit de
     faire. Compte au passage les appels de chacune. */
  async function avecEspions(reponse, fn){
    const vraieFeuille = window.confirmerDansFeuille, vraieSync = window.syncNow;
    const compte = { demande:0, synchro:0 };
    window.confirmerDansFeuille = ()=>{ compte.demande++; return Promise.resolve(reponse); };
    window.syncNow = ()=>{ compte.synchro++; return Promise.resolve(); };
    try{ await fn(compte); }
    finally{
      window.confirmerDansFeuille = vraieFeuille; window.syncNow = vraieSync;
      /* Sans ça, le `scheduleSync` posé par `saveDB` partirait vraiment sur le
         réseau quinze secondes plus tard. Sans session, il renonce. */
      db.auth = null;
    }
  }

  /* ============ Décochages qui survivent à la synchro — C3 ============

  groupe('Décochages qui survivent à la synchro — C3');

  const MAINTENANT = Date.now(), IL_Y_A_1H = MAINTENANT - 3600000;
  /* Un film à l'état exact que produit chaque geste, sans passer par l'app. */
  function filmVu(id, quand){
    return { id:id, title:'F'+id, genres:['Drame'], seen:true,
             watchedAt:quand, addedAt:1, date:'2010-01-01' };
  }
  function filmDecoche(id, quand){
    return { id:id, title:'F'+id, genres:['Drame'], seen:false,
             watchedAt:null, unseenAt:quand, addedAt:1, date:'2010-01-01' };
  }

  test('C3 — décochage RÉCENT ici contre vu ANCIEN ailleurs : reste décoché', ()=>{

  /* ============ Les goûts, sous-bloc par sous-bloc — C4 ============
     `db.gouts` se fusionnait en tout-ou-rien sur une seule date. Un « Pas pour
     moi » sur une suggestion — le geste le plus fréquent et le moins important
     du bloc — datait TOUT, et écrasait à la synchro les genres, les acteurs,
     les plateformes et les graines réglés le même jour sur l'autre appareil.

     Le cas central est le premier : c'est le critère d'acceptation, et c'est le
     seul qui échouait avant. Les suivants gardent la compatibilité, qui est la

  groupe('Les goûts, sous-bloc par sous-bloc — C4');

  /* Des goûts complets, avec des dates par bloc posées à la main. */
  function goutsDe(champs, blocs, maj){
    const g = { genres:[], genresFam:{}, exclus:[], acteurs:[], graines:[],
                plates:[], animeSous:[], pasVus:[], pasPourMoi:{},
                amorcageFait:false, propose:false, platesDemande:false,
                suggMesPlates:false, jour:'', toutesOrigines:false };
    Object.assign(g, champs || {});
    if(blocs) g.majBlocs = blocs;
    if(maj !== undefined) g.maj = maj;
    return g;
  }

    baseVierge();
    /* Ici, c'est A : il vient de refuser une suggestion, rien d'autre. */
    db.gouts = goutsDe({ pasPourMoi:{ 'movie:1':{quand:2000, g:['Drame']} } },
                       { pasPourMoi:2000, genres:1000, acteurs:1000, graines:1000,
                         plates:1000, pasVus:1000, divers:1000 }, 2000);
    /* Là-bas, c'est B : il a coché des genres, un peu plus tôt dans la journée. */
    mergeRemote({ shows:{}, movies:{}, gouts: goutsDe(
      { genres:['Comédie','Action'] },
      { pasPourMoi:1000, genres:1500, acteurs:1000, graines:1000,
        plates:1000, pasVus:1000, divers:1000 }, 1500) });
    egal(db.gouts.genres, ['Comédie','Action'], 'les genres cochés sur B ont été écrasés par un refus');
    vrai(db.gouts.pasPourMoi['movie:1'], 'le refus posé sur A a été perdu');
  });

  /* ============================================================
     SPEC-08 — B5 : l'affichage d'abord, et les requêtes qui s'annulent
     ============================================================
     Le décor est le même pour tout le groupe : on FABRIQUE les étages plutôt
     que de les laisser naître des critères. `chargerGrilleRech` rebâtit le
     moteur à chaque rechargement complet (`r.flux = null`), un moteur posé à la
     main serait donc jeté avant d'avoir servi. On remplace `etagesRech` le
     temps du test — c'est la seule façon de tenir un nombre d'étages connu, et
     donc de compter des requêtes.
     `view` est laissé hors de `search` : `peindreRech` sort alors immédiatement
     et aucune jaquette n'est construite. Cette page n'a le droit d'aller ni sur
     le réseau, ni sur les images de TMDB. */
  function decorB5(nbEtages, parEtage, parPage){
    const r = rechVierge('film');
    const flux = (id) => ({ p:{ __id:id }, media:'movie', page:0, pages:3, total:null,
                            tampon:[], fini:false, echec:false });
    const etages = [];
    for(let e = 0; e < nbEtages; e++){
      const l = [];
      for(let f = 0; f < parEtage; f++) l.push(flux(e+':'+f));
      etages.push({ compte:true, recoupe:false, flux:l });
    }
    const appels = [];
    /* Le point de mesure est LA PEINTURE, pas la fin de la fonction : avec un
       réseau instantané (celui de cette page), l'amorçage de fond a le temps de
       passer un paquet entier avant que la promesse de `chargerGrilleRech` ne
       se dénoue. On note donc combien de requêtes étaient parties au moment où
       les premières jaquettes sont arrivées à l'écran — c'est exactement ce que
       B5 prétend réduire, et rien d'autre. */
    const mesure = { avantPeinture: null };
    const vraiePeinture = window.peindreRech;
    window.peindreRech = function(){
      const r2 = etatRech();
      if(mesure.avantPeinture === null && !r2.loading && r2.res && r2.res.length)
        mesure.avantPeinture = appels.length;
      return vraiePeinture.apply(this, arguments);
    };
    window.etagesRech = function(){ return etages; };
    window.chargerGenres = function(){ return Promise.resolve(null); };
    window.tmdb = function(path, params, extra){
      appels.push({ path:path, page:params && params.page, signal: extra && extra.signal });
      const res = [];
      for(let i = 0; i < (parPage == null ? 60 : parPage); i++)
        res.push({ id: appels.length * 1000 + i, poster_path:'/p.jpg', genre_ids:[],
                   title:'T'+i, vote_average:5 });
      /* 1 000 résultats par flux : le total attendu est donc connu d'avance. */
      return Promise.resolve({ page:1, total_pages:3, total_results:1000, results:res });
    };
    return { r:r, etages:etages, appels:appels, mesure:mesure };
  }
  /* Laisse tourner l'amorçage de fond jusqu'à ce qu'il ait fini. Les réponses
     sont immédiates : quelques tours de file suffisent, la borne n'est là que
     pour qu'un test cassé échoue au lieu de bloquer la page. */
  async function finirFondB5(r){
    for(let i = 0; i < 200 && r.flux && r.flux.amorce; i++)
      await new Promise(res => setTimeout(res, 0));
  }

  testAsync('B5 — abandonner sa propre génération n\'allume aucun bandeau', async ()=>{
    /* LE cas limite du lot. Les correctifs B3/B4 ont fait de toute lecture
       ratée un `echec`, et d'un `echec` sans fournée une panne affichée. Une
       requête que NOUS coupons rejette exactement comme une coupure réseau —
       si on ne les distingue pas, poser un mot de plus fait clignoter
       « Pas de connexion » sur une grille en parfait état. */
    const vue = view; view = 'home';
    const vraiEtages = window.etagesRech, vraiGenres = window.chargerGenres,
          vraiTmdb = window.tmdb, vraiePeinture = window.peindreRech;
    try{
      const d = decorB5(3, 2, 60);
      /* Un réseau qui ne répond QUE lorsqu'on l'abandonne. */
      window.tmdb = function(path, params, extra){
        return new Promise((ok, ko)=>{
          const sig = extra && extra.signal;
          if(!sig) return;
          const partir = ()=>{ const e = new Error('abandon'); e.name = 'AbortError'; ko(e); };
          if(sig.aborted) partir(); else sig.addEventListener('abort', partir, { once:true });
        });
      };
      d.r.res = [{ id:1, __media:'movie', genre_ids:[], poster_path:null }];
      const enVol = chargerGrilleRech();
      await new Promise(res => setTimeout(res, 0));
      vrai(d.r.flux && d.r.flux.ctrl, 'la génération n\'a pas de signal d\'abandon à donner');
      d.r.flux.ctrl.abort();
      await enVol;
      egal(d.r.err, '', 'un abandon volontaire s\'affiche comme une panne réseau');
      egal(d.r.res.length, 1, 'la grille déjà peinte a été effacée par notre propre abandon');
      vrai(d.etages[0].flux.every(f => !f.echec),
           'un flux qu\'on a cessé d\'écouter est marqué en échec : il sera « retenté » pour rien');
    } finally {
      window.etagesRech = vraiEtages; window.chargerGenres = vraiGenres;
      window.tmdb = vraiTmdb; window.peindreRech = vraiePeinture; view = vue;
    }
  });

  /* ============ SPEC-05 lot A — la Recherche nouvelle génération ============

     Ce que ces cas empêchent :

       · qu'un critère que « + préciser » savait poser hier devienne
         inatteignable (le §1 exige un SUR-ENSEMBLE STRICT — c'est la règle
         d'or de la spec, et la seule qui puisse faire régresser un usage
         quotidien sans qu'on s'en aperçoive) ;
       · qu'une ambiance recopie ses règles dans les filtres ponctuels — alors
         la retirer ne retirerait plus rien ;
       · que « Tout effacer » emporte l'ambiance active (§9) ;
       · que le tri « mes goûts » FILTRE au lieu de trier, ou qu'il réordonne
         ce qui est déjà à l'écran ;
       · que le titre montré en carte soit aussi dans la grille ;
       · qu'un `with_status` parte sur `/discover/movie`, que TMDB refuserait. */
  groupe('SPEC-05 lot A — pilules, filtres, ambiances, match, tri');

  function rechNG(fam){
    const r = rechVierge(fam || 'tout');
    db.avis = { tv:{}, movie:{} };
    db.podium = { film:[], serie:[], anime:[], maj:0 };
    db.gouts.ambiances = [];
    r.ambiance = null; r.statut = null; r.gore = null; r.avec = null; r.matchI = 0;
    try{ localStorage.removeItem(TRI_CLE); }catch(e){}
    return r;
  }
  /* La feuille est du HTML : on la lit dans une boîte détachée plutôt que
     d'ouvrir vraiment `#sheetin`, qui appartient à d'autres cas. */
  function boiteHtml(html){
    const d = document.createElement('div'); d.innerHTML = html; return d;
  }
  function sectionsOuvertes(){
    return sectionsFiltresRech().map(s=>{
      sectionFiltreOuverte = s.id;
      return { id:s.id, html: optionsSectionFiltre(s.id) };
    });
  }

  test('RA1 — la feuille Filtres est un sur-ensemble STRICT de « + préciser »', ()=>{
    const r = rechNG('serie');
    genresTMDB.tv = [{id:18,nom:'Drame'},{id:35,nom:'Comédie'}];
    genresTMDB.movie = [{id:18,nom:'Drame'}];
    db.gouts.plates = [{ id:8, nom:'Netflix' }];
    const parSection = {};
    sectionsOuvertes().forEach(s=>{ parSection[s.id] = s.html; });
    /* Les sept critères d'hier ont chacun leur section, et « genre » couvre à
       la fois les tuiles mesurées et les genres TMDB. */
    ['genre','epoque','duree','origine','plate','note'].forEach(c=>{
      vrai(parSection[c] && parSection[c].length > 0, 'la section « '+c+' » est vide ou absente');
    });
    vrai(/poserFiltreRech\('pasvu','non'\)/.test(parSection.divers || ''),
         '« que je n\'ai pas vu » a disparu de la feuille');
    /* Et chaque VALEUR des tables mesurées est proposée, pas seulement la
       section : c'est là que se cachait le risque de perte. */
    RECH_EPOQUES.forEach(e=> vrai(parSection.epoque.indexOf(e.id) >= 0,
      'l\'époque « '+e.mot+' » a disparu'));
    RECH_NOTES.forEach(n=> vrai(parSection.note.indexOf("'"+n.id+"'") >= 0,
      'la note « '+n.mot+' » a disparu'));
    originesRech().forEach(o=> vrai(parSection.origine.indexOf("'"+o.id+"'") >= 0,
      'l\'origine « '+o.mot+' » a disparu'));
    ambiancesRech().forEach(a=> vrai(parSection.genre.indexOf("'"+a.id+"'") >= 0,
      'la tuile « '+(a.t||a.mot)+' » a disparu'));
    vrai(parSection.genre.indexOf('Comédie') >= 0, 'les genres TMDB ont disparu');
    vrai(parSection.plate.indexOf('Netflix') >= 0, 'les plateformes déclarées ont disparu');

  test('D-J1 — la formule de la jauge, telle que le §4.3 l\'écrit', ()=>{

    for(let i = 1; i <= 5; i++) ecrireClassement('film', i, 1000 + i, 5);
    egal(stabiliteDuel('film'), 97, 'le plafond de 97 % ne mord pas — 100 % serait un mensonge');
    /* 5 × 2 → 10/25 → 40. */
    for(let i = 1; i <= 5; i++) ecrireClassement('film', i, 1000 + i, 2);
    egal(stabiliteDuel('film'), 40);
    /* 3 titres classés × 5 duels → 15/25 → 60. */
    db.classement.film = {};
    for(let i = 1; i <= 3; i++) ecrireClassement('film', i, 1000 + i, 5);
    egal(stabiliteDuel('film'), 60);
    /* Rien de joué → 0. */
    db.classement.film = {};
    egal(stabiliteDuel('film'), 0);
  });

    /* Il apparaît dans « Titres écartés », avec la bonne mention. */
    const ec = titresEcartes();
    const t = ec.find(x => x.media === 'movie' && String(x.id) === '3');
    vrai(t && t.pasVu, 'le titre récusé n\'apparaît pas dans « Titres écartés »');
    vrai(sansEcran(()=> blocEcartes()).indexOf('pas vu') >= 0,
         'la mention « pas vu » manque : un 👎 et un « pas vu » ne se reprennent pas pareil');
    /* Et la reprise le rend éligible ET restitue sa graine. */
    sansEcran(()=> reprendreEcarte('movie', 3));
    egal(db.gouts.pasVus.indexOf('movie:3'), -1, 'le titre reste récusé après reprise');
    egal(db.gouts.graines.length, 1, 'la graine n\'a pas été restituée');
    egal(db.gouts.grainesSuspendues.length, 0);
    vrai(titresEligiblesDuel('film').some(x => String(x.id) === '3'),
         'le titre repris n\'est pas éligible à la session suivante');
  });

  test('D-8 — un 👎 se reprend toujours comme avant', ()=>{
    duelBase(12);
    poserAvis('movie', 4, -1);
    const t = titresEcartes().find(x => String(x.id) === '4');
    vrai(t && !t.pasVu, 'un 👎 est présenté comme un « pas vu »');
    sansEcran(()=> reprendreEcarte('movie', 4));
    egal(avisDe('movie', 4), 0, 'le 👎 n\'a pas été retiré');
  });

  test('D-9 — la pastille compte juste, plafonne à « 9+ », et disparaît à zéro', ()=>{
    duelBase(12);
    egal(compteDuelPastille(), 12, 'les nouveaux titres ne sont pas comptés');
    egal(texteDuelPastille(), '9+', 'au-delà de 9, le §4.4 demande « 9+ »');
    /* Tous départagés : plus de pastille. */
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    db.podium.film = [];
    for(let i = 1; i <= 12; i++) db.podium.film.push(String(i));
    egal(compteDuelPastille(), 0);
    egal(texteDuelPastille(), '', 'une pastille vide reste affichée');
  });

  test('D-10 — la carte est en tête du profil, et le bloc de Mes goûts est intact', ()=>{
    const c = codeDe(viewProfile);
    const iCarte = c.indexOf('carteDuelProfil');
    const iCartes = c.indexOf('cartesProfil');
    vrai(iCarte >= 0 && iCarte < iCartes, 'la carte n\'est pas en tête de Mon profil');
    /* §0.6 — rien ne disparaît : le bloc Duel de Mes goûts est toujours appelé. */
    vrai(codeDe(viewGouts).indexOf('carteDuelGouts') >= 0,
         'le bloc Duel de Mes goûts a été déménagé au lieu d\'être doublé');
    vrai(codeDe(viewGouts).indexOf('blocEcartes') >= 0, '« Titres écartés » a disparu');
  });

  test('D-11 — le panthéon exige TROIS titres, pas deux', ()=>{
    duelBase(12);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    vrai(sansEcran(()=> pantheonHtml('film')).indexOf('dpant') >= 0);
    db.podium.film = ['1','2'];
    egal(sansEcran(()=> pantheonHtml('film')), '',
         'un podium à deux marches s\'affiche : ce n\'est pas un podium');
  });

  test('D-12 — « bâti sur N duels » ne compte pas chaque duel deux fois', ()=>{
    duelBase(12);
    /* Un duel touche DEUX titres : deux entrées à n=1 valent UN duel. */
    ecrireClassement('film', 1, 1016, 1);
    ecrireClassement('film', 2, 984, 1);
    egal(totalDuelsFamille('film'), 1, 'le total annonce le double de la réalité');
  });

  test('D-13 — l\'éclair ne se pose qu\'une fois par titre, et une par session', ()=>{
    duelBase(12);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    let ouvertes = 0;
    const vraiOpen = window.openSheet;
    window.openSheet = ()=>{ ouvertes++; };
    try{
      db.movies[20] = film(20, ['Drame'], true);
      proposerDuelEclair('movie', 20, 'F20');
      egal(eclairsPoses().indexOf('movie:20') >= 0, true, 'le titre n\'est pas mémorisé');
      /* Un second titre dans la même session n'ouvre rien (§3.3). */
      db.movies[21] = film(21, ['Drame'], true);
      proposerDuelEclair('movie', 21, 'F21');
      egal(eclairsPoses().indexOf('movie:21'), -1,
           'un second éclair a été posé dans la même session d\'app');
      /* Et le même titre, session suivante, ne revient pas. */
      eclairFaitCetteSession = false;
      proposerDuelEclair('movie', 20, 'F20');
      egal(ouvertes, 0, 'la feuille s\'est ouverte alors que les minuteurs sont différés');
    }finally{ window.openSheet = vraiOpen; }
  });

  test('D-14 — pas d\'éclair sans adversaire légitime', ()=>{
    duelBase(12);
    db.podium = { film:[], serie:[], anime:[], maj:0 };
    db.movies[30] = film(30, ['Drame'], true);
    proposerDuelEclair('movie', 30, 'F30');
    egal(eclairsPoses().indexOf('movie:30'), -1,
         'une question a été posée sans podium : le duel ne voudrait rien dire');
  });

  test('D-15 — un vote éclair passe par le chemin existant, « je ne sais pas » n\'écrit rien', ()=>{
    duelBase(12);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    const avant = duelsJoues('film', 1);
    sansEcran(()=> voterEclair('movie', 1, 'film', 2, 1));
    egal(duelsJoues('film', 1), avant + 1, 'le vote éclair n\'a pas été écrit');
    vrai(scoreClassement('film', 1) > 1001, 'le gagnant n\'a pas monté');
    /* « Je ne sais pas » est le bouton qui ferme la feuille : il n'appelle pas
       `voterEclair`, donc rien n'est écrit. */
    vrai(codeDe(ouvrirFeuilleEclair).indexOf('closeSheet()"') >= 0,
         '« Je ne sais pas » écrit quelque chose');
  });

  test('D-16 — l\'éclair se déclenche sur un geste local, jamais sur une synchro', ()=>{
    /* La garantie est de FORME : l'accroche est dans `applyWatched` et dans
       `marquerFilmVu`, deux fonctions qu'aucun import ni aucune synchro
       n'emprunte. Un drapeau « c'est un import » aurait pu être oublié ; un
       chemin de code qui n'existe pas ne s'oublie pas. */
    vrai(codeDe(applyWatched).indexOf('proposerDuelEclair') >= 0,
         'la fin de série ne déclenche plus rien');
    vrai(codeDe(applyWatched).indexOf('finiAvant') >= 0,
         'sans l\'état d\'avant, une série déjà finie reposerait la question');
    vrai(codeDe(marquerFilmVu).indexOf('proposerDuelEclair') >= 0,
         'la fin de film ne déclenche plus rien');
    vrai(codeDe(mergeRemote).indexOf('proposerDuelEclair') < 0,
         'une synchro peut ouvrir la feuille éclair');
  });

  test('D-17 — le partage : trois titres au minimum, et un texte en dernier recours', ()=>{
    duelBase(12);
    db.podium.film = ['1','2'];
    egal(nomsPodium('film').length, 2);
    db.podium.film = ['1','2','3'];
    egal(nomsPodium('film'), ['F1','F2','F3']);
    /* Le repli texte dit la même chose sans dépendre d'aucune capacité. */
    const c = codeDe(partagerPodium);
    vrai(c.indexOf('navigator.canShare') >= 0 && c.indexOf('createObjectURL') >= 0 &&
         c.indexOf('partagerPodiumTexte') >= 0,
         'les trois chemins du §5.2 ne sont pas tous là');
    /* Et l'affiche est chargée en CORS, sans quoi le canvas se souille et
       `toBlob` échoue à la dernière étape. */
    vrai(codeDe(chargerAffichePartage).indexOf("crossOrigin = 'anonymous'") >= 0,
         'sans crossOrigin, l\'image ne se génère jamais');
  });

  testAsync('D-18 — l\'image se génère même quand les affiches ne chargent pas', async ()=>{
    duelBase(12);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    db.podium.film = ['1','2','3'];
    /* Réseau coupé : chaque affiche échoue, et l'image sort quand même. */
    const vraieImage = window.Image;
    window.Image = function(){ const o = {}; setTimeout(()=>{ if(o.onerror) o.onerror(); }, 0);
                               return o; };
    try{
      const b = await construirePodiumPng('film');
      vrai(b && b.size > 0, 'aucune image produite hors ligne');
    }finally{ window.Image = vraieImage; }
  });


  /* ===== Lot D — ce que la relecture a trouvé absent ===== */
  groupe('SPEC-06 — corrections de relecture');

  testAsync('D-19 — JOUER le duel du jour ne fait AUCUNE requête réseau', async ()=>{
    duelBase(14);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    let requetes = 0;
    const vraiTmdb = window.tmdb, vraiSb = window.sbFetch;
    window.tmdb = async ()=>{ requetes++; return { results: [] }; };
    window.sbFetch = async ()=>{ requetes++; return {}; };
    try{
      sansEcran(()=>{ bandeauDuelJour(); jouerDuelJour(); appliquerVote(0); });
      await new Promise(r=> setTimeout(r, 60));
      /* C'est le §8, mot pour mot : « onglet réseau vide à l'affichage ET AU
         JEU ». `terminerDuel` appelait `chargerSuggDuel` en mode jour, pour une
         réponse que l'écran léger n'affiche même pas. */
      egal(requetes, 0, 'le duel du jour a demandé quelque chose au réseau');
    }finally{ window.tmdb = vraiTmdb; window.sbFetch = vraiSb; }
  });

  test('D-20 — une session normale, elle, garde ses suggestions', ()=>{
    /* La correction ne doit pas priver l'écran de résultat de SESSION de sa
       rangée « dans le même esprit » : elle, elle est affichée. */
    const c = codeDe(terminerDuel);
    vrai(/duel\.mode !== 'jour'/.test(c) && c.indexOf('chargerSuggDuel') >= 0,
         'les suggestions de fin de session ont disparu avec la correction');
  });

  test('D-21 — l\'éclair passe par appliquerVote, pas par un second Elo', ()=>{
    const c = codeDe(voterEclair);
    vrai(c.indexOf('appliquerVote') >= 0,
         'l\'éclair recalcule l\'Elo dans son coin : deux portes, deux comportements');
    vrai(!/Math\.pow\(10/.test(c), 'la formule Elo est encore dupliquée');
    vrai(!/: 32/.test(c), 'un K = 32 en dur a réapparu');
    /* Et la règle du §1.7 s'applique donc à l'éclair comme au duel : un titre
       non noté qui bat un titre 👍 passe à 👍. */
    duelBase(12);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    poserAvis('movie', 2, 1);
    egal(avisDe('movie', 1), 0, 'le titre de départ ne doit pas être noté');
    sansEcran(()=> voterEclair('movie', 1, 'film', 2, 1));
    egal(avisDe('movie', 1), 1,
         'un titre non noté qui bat un 👍 ne passe pas à 👍 : la règle §1.7 ne s\'applique pas à l\'éclair');
    egal(duel.actif, false, 'la session posée pour l\'éclair n\'a pas été refermée');
  });

  test('D-22 — la jauge est bien sur les TROIS écrans du §4.3', ()=>{
    vrai(codeDe(ecranDuelResultat).indexOf('jaugeDuelHtml') >= 0,
         'la jauge manque sur le résultat de session — le §4.3 la nomme pourtant');
    vrai(codeDe(ecranResultatDuelJour).indexOf('jaugeDuelHtml') >= 0);
    vrai(codeDe(carteDuelProfil).indexOf('jaugeDuelHtml') >= 0);
  });

  test('D-23 — « Retour à Découvrir » y retourne vraiment', ()=>{
    vrai(codeDe(retourDecouvrirDuel).indexOf("go('discover')") >= 0,
         'le bouton ferme le duel et laisse la personne sur Mes goûts : le libellé ment');
    vrai(codeDe(ecranResultatDuelJour).indexOf('retourDecouvrirDuel') >= 0);
  });

  test('D-24 — la paire du jour oppose bien une TÊTE de podium', ()=>{
    duelBase(14);
    for(let i = 1; i <= 12; i++) ecrireClassement('film', i, 1000 + i, 3);
    projeterPodium('film');
    /* Un podium à l'ordre connu : le n° 1 est le mieux classé. */
    db.podium.film = ['12','11','10','9','8'];
    /* Plusieurs titres jamais joués : le neuf est tiré au hasard parmi eux —
       c'est voulu, et le test ne doit donc rien supposer sur LEQUEL. Ce qu'il
       éprouve, c'est l'AUTRE moitié de la paire. */
    db.movies[13] = film(13, ['Drame'], true);
    db.movies[14] = film(14, ['Drame'], true);
    const joues = {};
    Object.keys(db.classement.film).forEach(id=>{ joues[id] = 1; });
    for(let essai = 0; essai < 12; essai++){
      const o = sansEcran(()=> composerDuelJour());
      vrai(o, 'aucune paire composée');
      const neufs = o.paire.filter(c => !joues[String(c).slice(6)]);
      egal(neufs.length, 1, 'la paire du jour n\'oppose pas un neuf à un ancien');
      const adverse = o.paire.find(c => c !== neufs[0]);
      egal(adverse, 'movie:12',
           'l\'adversaire n\'est pas la tête du podium mais un titre quelconque du paquet');
      try{ localStorage.removeItem(DUELJOUR_CLE); }catch(e){}
    }
  });

  test('D-25 — une graine récusée garde son nom dans « Titres écartés »', ()=>{
    duelBase(12);
    /* Une graine n'est PAS dans la bibliothèque : c'est tout le cas. */
    db.gouts.graines = [{ media:'movie', id:'900', nom:'Le Parrain', famille:'film' }];
    db.gouts.grainesSuspendues = [];
    sansEcran(()=>{ ouvrirDuel('film'); duelPasVu('movie', 900); });
    const t = titresEcartes().find(x => String(x.id) === '900');
    vrai(t, 'la graine récusée n\'apparaît pas dans « Titres écartés »');
    egal(t.nom, 'Le Parrain',
         'on ne sait pas ce qu\'on reprend : le §6.2 promet qu\'on peut le reprendre');
  });

  test('D-26 — la pastille ne repart pas à chaque rendu', ()=>{
    duelBase(12);
    let passes = 0;
    const vraiNouveaux = window.nouveauxADepartager;
    window.nouveauxADepartager = f => { passes++; return vraiNouveaux(f); };
    try{
      pastilleDuelMemo = { sig:null, n:0 };
      compteDuelPastille();
      const apres = passes;
      compteDuelPastille(); compteDuelPastille(); compteDuelPastille();
      egal(passes, apres,
           'la pastille reparcourt la bibliothèque à chaque rendu — le §4.4 dit « jamais en continu »');
      /* Mais un goût qui change l'invalide bien. */
      poserAvis('movie', 3, 1);
      compteDuelPastille();
      vrai(passes > apres, 'la pastille ne voit plus les goûts changer');
    }finally{ window.nouveauxADepartager = vraiNouveaux; }
  });

  test('D-27 — « Défendre mon podium » défend celui qui est affiché', ()=>{
    const c = codeDe(carteDuelProfil);
    vrai(/pantheon \|\| fam/.test(c),
         'le bouton ouvre une famille dont la carte ne montre rien');
  });

  /* ==================== Bilan ====================
     Écrit UNE FOIS, après la file asynchrone. `window.__testsFinis` est le
     signal que le lanceur attend : sans lui il lirait un bilan encore
     provisoire et déclarerait la suite verte avant qu'elle ait fini. */
  window.__testsFinis = false;
  function bilan(){
    const b = document.getElementById('bilan');
    b.className = 'bilan ' + (ko ? 'rouge' : 'vert');
    b.textContent = ko ? (ko + ' échec' + (ko>1?'s':'') + ' sur ' + n + ' tests')
                       : ('Tout passe — ' + n + ' tests');
    document.title = ko ? (ko + ' échec(s) — Mes Séries') : (n + ' tests OK — Mes Séries');
  }
  bilan();                                   // provisoire : la page dit déjà où elle en est
  jouerAsync().then(()=>{
    bilan();
    window.__testsFinis = true;
  });
})();
</script>
