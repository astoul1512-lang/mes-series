<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Séries">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Mes Séries</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1115'/%3E%3Crect x='18' y='30' width='64' height='44' rx='7' fill='none' stroke='%23ff6b57' stroke-width='7'/%3E%3Cpath d='M36 30 50 16 64 30' fill='none' stroke='%23ff6b57' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --surface:#181b22; --surface2:#212530; --line:#2b303c;
    --text:#e8eaf0; --muted:#8b92a4; --accent:#ff6b57; --accent-dim:#ff6b5722;
    --ok:#3ecf8e; --warn:#ffb84d; --radius:14px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);height:100%;-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    font-size:15px;line-height:1.45;
    min-height:100%;
    overscroll-behavior:none;              /* supprime le rebond « page web » */
    touch-action:manipulation;             /* supprime le zoom au double-tap */
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  input,textarea{-webkit-user-select:text;user-select:text}
  body.booting .app,body.booting nav{opacity:0}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer;padding:0}
  a{color:var(--accent);text-decoration:none}
  img{display:block}
  .app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
  @supports (min-height:100dvh){ .app{min-height:100dvh} }
  /* le bandeau d'annulation flotte au-dessus de la barre : on réserve la place correspondante */
  body.undo .app{padding-bottom:calc(142px + var(--safe-b))}
  /* transition d'écran, façon application */
  .app.enter{animation:slidein .26s cubic-bezier(.22,.68,.32,1)}
  .app.back{animation:slideback .26s cubic-bezier(.22,.68,.32,1)}
  @keyframes slidein{from{opacity:.25;transform:translateX(16px)}to{opacity:1;transform:none}}
  @keyframes slideback{from{opacity:.25;transform:translateX(-16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .app.enter,.app.back{animation:none} }

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:30;background:rgba(15,17,21,.9);
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--line);padding-top:var(--safe-t);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  }
  .hbar{display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:56px}
  .htitle{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    color:var(--muted);flex:none}
  .iconbtn:active{background:var(--surface2)}
  .iconbtn svg{width:20px;height:20px}

  /* ---------- Generic ---------- */
  .wrap{padding:16px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .tiny{font-size:12px}
  .center{text-align:center}
  .row{display:flex;align-items:center;gap:10px}
  .spacer{flex:1}
  .chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
    color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{background:var(--accent);color:#fff;border-radius:11px;padding:11px 16px;font-weight:650;
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn svg{width:18px;height:18px;flex:none}
  .btn:active{filter:brightness(.9)}
  .btn.ghost{background:var(--surface2);color:var(--text)}
  .btn.block{display:flex;width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}
  input[type=text],input[type=search],input[type=password],select{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .empty{padding:56px 24px;text-align:center;color:var(--muted)}
  .empty svg{width:44px;height:44px;opacity:.35;margin-bottom:14px}
  .empty h3{color:var(--text);margin:0 0 6px;font-size:17px}
  .empty p{margin:0 0 18px;font-size:14px}
  .sectitle{font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:22px 16px 10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

  /* ---------- Show rows ---------- */
  .list{display:flex;flex-direction:column;gap:10px;padding:4px 16px}
  .srow{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px;align-items:stretch;text-align:left;width:100%}
  .srow:active{background:var(--surface2)}
  .poster{width:64px;height:96px;border-radius:9px;object-fit:cover;background:var(--surface2);flex:none}
  .poster.ph{display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;padding:4px}
  .sinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .sname{font-weight:680;font-size:15px;letter-spacing:-.01em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .snext{font-size:13px;color:var(--muted)}
  .snext b{color:var(--text);font-weight:640}
  .bar{height:4px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:auto}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .bar.done>i{background:var(--ok)}
  .watchbtn{align-self:center;flex:none;width:44px;height:44px;border-radius:50%;
    background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;border:1px solid var(--accent)}
  .watchbtn:active{background:var(--accent);color:#fff}
  .watchbtn svg{width:20px;height:20px}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
  .badge.live{background:#3ecf8e22;color:var(--ok)}
  .badge.end{background:#8b92a422;color:var(--muted)}

  /* ---------- Search grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding:4px 16px;align-items:start}
  .gcard{text-align:left;position:relative}
  .gcard .poster{width:100%;height:auto;aspect-ratio:2/3}
  .gname{font-size:12.5px;font-weight:640;margin-top:6px;min-height:2.5em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gyear{font-size:11px;color:var(--muted)}
  .gcard .tick{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;
    padding:0 6px;background:var(--ok);color:#08130d;display:grid;place-items:center;
    font-size:10.5px;font-weight:750;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .gcard .tick svg{width:14px;height:14px}
  .gcard .tick.avoir{background:var(--accent);color:#fff}
  .gcard .tick.suivi{background:var(--accent);color:#fff}
  .gstat{font-size:10.5px;font-weight:750;margin-top:1px}
  .gstat.avoir{color:var(--accent)}
  .gstat.asuivre{color:var(--accent)}
  .gstat.vu{color:var(--ok)}

  /* ---------- Decouvrir ---------- */
  .gcard .gnote{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.74);color:#ffd166;
    font-size:11px;font-weight:750;padding:3px 7px;border-radius:9px;
    display:flex;align-items:center;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .gcard .gnote svg{width:10px;height:10px}
  .resume{padding:0 16px 10px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
  .resume b{color:var(--text);font-weight:650}
  .iconbtn.actif{color:var(--accent)}
  .fgrp{font-size:11px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;
    color:var(--muted);margin:14px 0 8px}
  .fchips{display:flex;flex-wrap:wrap;gap:8px}
  .plus{padding:16px;text-align:center}

  /* ---------- Detail ---------- */
  .hero{position:relative;height:190px;background:var(--surface2);overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;opacity:.5}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(15,17,21,.25),var(--bg))}
  .dhead{display:flex;gap:14px;padding:0 16px;margin-top:-58px;position:relative;z-index:2}
  .dhead .poster{width:92px;height:138px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .dmeta{padding-top:62px;min-width:0;flex:1}
  .dmeta h2{margin:0 0 4px;font-size:19px;line-height:1.25;letter-spacing:-.02em}
  .overview{color:var(--muted);font-size:14px;margin:14px 16px 0}
  .overview.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
  .stat span{font-size:11px;color:var(--muted)}
  .season{border-top:1px solid var(--line)}
  .shead{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:left}
  .shead b{font-size:15px}
  .shead .caret{transition:transform .18s;color:var(--muted);display:grid;place-items:center}
  .shead.open .caret{transform:rotate(90deg)}
  .eprow{display:flex;align-items:center;gap:11px;padding:9px 16px}
  .epthumb{width:100px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:none;
    background:var(--surface2);position:relative}
  .epthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .epthumb.ph{display:grid;place-items:center;color:var(--line)}
  .epthumb.ph svg{width:26px;height:26px}
  .eprow.seen .epthumb{opacity:.42}
  .eprow.future .epthumb{opacity:.35}
  .eprow+.eprow{border-top:1px solid rgba(43,48,60,.5)}
  .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;
    display:grid;place-items:center;color:transparent}
  .ck.on{background:var(--ok);border-color:var(--ok);color:#08130d}
  .ck svg{width:14px;height:14px}
  .epinfo{flex:1;min-width:0}
  .epname{font-size:14px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .crow .epname{-webkit-line-clamp:1}
  .epsub{font-size:12px;color:var(--muted)}
  .future .epname,.future .epsub{opacity:.5}

  /* ---------- Calendar ---------- */
  .day{margin:0 16px 8px}
  .daylbl{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);margin:20px 0 8px}
  .daylbl.past{color:var(--muted)}
  .crow{display:flex;gap:12px;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
  .cthumb{width:74px;height:42px;border-radius:7px;object-fit:cover;background:var(--surface2);flex:none}

  /* ---------- Nav ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(15,17,21,.94);
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border-top:1px solid var(--line);padding-bottom:var(--safe-b);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .navin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
  .tab{padding:10px 0 9px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:10.5px;font-weight:600;transition:color .15s}
  .tab svg{width:23px;height:23px;transition:transform .18s}
  .tab.on{color:var(--accent)}
  .tab.on svg{transform:translateY(-1px) scale(1.06)}
  .tab:active svg{transform:scale(.9)}

  /* ---------- Misc ---------- */
  .toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(84px + var(--safe-b));
    background:var(--surface2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;
    z-index:90;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .undobar{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--safe-b));
    max-width:688px;margin:0 auto;
    background:var(--surface2);border:1px solid var(--line);padding:10px 10px 10px 16px;border-radius:12px;
    z-index:85;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:space-between;gap:12px}
  .undobar.show{display:flex}
  .undobar span{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .undobar button{color:var(--accent);font-weight:750;padding:6px 10px;border-radius:8px;
    background:var(--accent-dim);white-space:nowrap}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheetin{background:var(--surface);border:1px solid var(--line);border-bottom:0;
    border-radius:18px 18px 0 0;width:100%;max-width:720px;padding:18px 16px calc(24px + var(--safe-b))}
  .sheetin h3{margin:0 0 4px;font-size:17px}
  .sheet .opt{display:block;width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--line);font-weight:600}
  .sheet .opt.danger{color:#ff5a5a}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .banner{margin:16px;padding:14px;border-radius:12px;background:#ffb84d18;border:1px solid #ffb84d44;
    color:#ffd399;font-size:13.5px}
  .banner b{color:#fff}
  label.fld{display:block;margin:0 0 16px}
  label.fld span{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
  label.fld em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:6px}
  .kv{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:0}

  /* ---------- Fiche / aperçu ---------- */
  .note{display:inline-flex;align-items:center;gap:4px;background:#ffb84d1e;color:#ffc46b;
    padding:3px 8px;border-radius:7px;font-size:12.5px;font-weight:700}
  .note svg{width:12px;height:12px}
  .actions{display:flex;gap:10px;padding:16px 16px 0}
  .actions .btn{flex:1}
  .cast{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
  .cast::-webkit-scrollbar{display:none}
  .cperson{width:74px;flex:none;text-align:center}
  .cperson img,.cperson .ph2{width:74px;height:74px;border-radius:50%;object-fit:cover;background:var(--surface2)}
  .cperson .ph2{display:grid;place-items:center;color:var(--muted);font-size:20px;font-weight:700}
  .cname{font-size:11.5px;font-weight:640;margin-top:6px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .crole{font-size:10.5px;color:var(--muted);line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .seasonpill{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
  .seasonpill::-webkit-scrollbar{display:none}
  .spill{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:9px 13px;text-align:center;min-width:78px}
  .spill b{display:block;font-size:13px}
  .spill span{display:block;font-size:11px;color:var(--muted);line-height:1.35}

  /* ---------- Profil ---------- */
  .phead{display:flex;align-items:center;gap:14px;padding:18px 16px 4px}
  .ro{display:inline-flex;align-items:center;gap:7px;justify-content:center}
  .ro svg{width:15px;height:15px;flex:none}
  .codebox{font-size:30px;font-weight:800;letter-spacing:.22em;text-align:center;
    padding:14px 8px;margin-bottom:10px;border-radius:12px;background:var(--surface2);
    border:1px dashed var(--accent);color:var(--accent);-webkit-user-select:all;user-select:all}
  .aborow{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
  .aborow::-webkit-scrollbar{display:none}
  .abomini{flex:none;width:66px;text-align:center;color:var(--text)}
  .abomini .avatar{width:52px;height:52px;font-size:20px;margin:0 auto}
  .abomini .avatar.plus{background:var(--surface2);border:1px dashed var(--line);color:var(--muted)}
  .abomini .avatar.plus svg{width:20px;height:20px}
  .abomini span{display:block;font-size:11.5px;font-weight:640;margin-top:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#b3452f);
    display:grid;place-items:center;font-size:22px;font-weight:750;color:#fff;flex:none}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding:4px 16px;align-items:start}
  .pcard{position:relative;text-align:left}
  .ptap{cursor:pointer}
  .pcard .poster{width:100%;height:auto;aspect-ratio:2/3}
  .pcard .pbadge{position:absolute;top:6px;right:6px;background:rgba(10,12,16,.82);
    backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:700;padding:3px 6px;border-radius:6px}
  .pcard .pbadge.done{background:rgba(62,207,142,.9);color:#08130d}
  .pcard .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55)}
  .pcard .pbar>i{display:block;height:100%;background:var(--accent)}
  .pcard .pbar>i.full{background:var(--ok)}
  .pcard .wrapimg{position:relative;border-radius:9px;overflow:hidden}
  .pname{font-size:12.5px;font-weight:640;margin-top:6px;min-height:2.5em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .psub{font-size:11px;color:var(--muted)}
  .sectitle .cnt{color:var(--accent);margin-left:4px}
  .sectitle.rowt{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .minibtn{font-size:11.5px;font-weight:750;letter-spacing:0;text-transform:none;
    padding:6px 11px;border-radius:9px;background:var(--accent-dim);color:var(--accent);
    border:1px solid var(--accent);display:inline-flex;align-items:center;gap:5px}
  .minibtn svg{width:12px;height:12px}
  .minibtn.on{background:var(--surface2);color:var(--muted);border-color:var(--line)}
  .minibtn:active{filter:brightness(1.2)}
</style>
</head>
<body class="booting">
<div class="app" id="app"></div>
<nav><div class="navin" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<div class="undobar" id="undo"></div>
<div class="sheet" id="sheet"><div class="sheetin" id="sheetin"></div></div>

<script>
"use strict";

/* ============================ Stockage ============================ */
/* IndexedDB en base principale (quota large, non purgé comme localStorage),
   miroir localStorage en secours, et écriture forcée dès que l'app passe en arrière-plan. */
const KEY = 'mesSeries.v1';
const IDB_NAME = 'mesSeries', IDB_STORE = 'kv', IDB_KEY = 'db';
let memoryOnly = false, storageMode = 'idb';
/* Serveur de sauvegarde pré-configuré (clé publiable : conçue pour être dans le client,
   les données sont protégées par les règles RLS côté base). Modifiable dans l'écran Compte. */
const DEFAULT_SYNC = { url:'https://mqwryzopmtykjidabqfv.supabase.co',
                       key:'sb_publishable_ZnfMBfcEQOhdpg3g9u0eZg_Iaw_Fo7y' };
let db = { apiKey:'', lang:'fr-FR', shows:{}, movies:{}, lastExport:null,
           sync:Object.assign({}, DEFAULT_SYNC), auth:null, pseudo:'',
           deleted:{shows:{},movies:{}}, syncedAt:null, v:1 };

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!self.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error || new Error('idb error'));
    r.onblocked = ()=> rej(new Error('idb blocked'));
  });
}
function idbReq(mode, fn){
  return idbOpen().then(conn => new Promise((res,rej)=>{
    const tx = conn.transaction(IDB_STORE, mode);
    const rq = fn(tx.objectStore(IDB_STORE));
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error);
    tx.oncomplete = ()=> conn.close();
  }));
}
const idbGet = ()=> idbReq('readonly', st => st.get(IDB_KEY));
const idbSet = v => idbReq('readwrite', st => st.put(v, IDB_KEY));

/* Demande au navigateur de marquer le stockage comme "persistant" :
   il ne sera pas purgé automatiquement pour faire de la place. */
async function askPersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(!(await navigator.storage.persisted())) await navigator.storage.persist();
    }
  }catch(e){}
}

async function loadDB(){
  let loaded = null;
  try{ loaded = await idbGet(); }
  catch(e){ storageMode = 'ls'; }

  if(!loaded){
    /* Première ouverture après la mise à jour : on récupère l'ancienne base localStorage */
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ loaded = JSON.parse(raw); }
    }catch(e){}
  }
  if(loaded && typeof loaded === 'object') db = Object.assign(db, loaded);
  if(!db.sync || !db.sync.url || !db.sync.key) db.sync = Object.assign({}, DEFAULT_SYNC);
  if(!db.deleted) db.deleted = {shows:{},movies:{}};

  /* Vérifie qu'au moins un canal d'écriture fonctionne */
  try{ await writeNow(); }
  catch(e){
    try{ localStorage.setItem(KEY, JSON.stringify(db)); storageMode = 'ls'; }
    catch(e2){ memoryOnly = true; }
  }
}

let saveTimer = null, dirty = false;
function saveDB(){
  dirty = true;
  if(typeof scheduleSync === 'function') scheduleSync();
  if(memoryOnly) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ writeNow().catch(()=>{}); }, 150);
}
async function writeNow(){
  if(memoryOnly) return;
  const snapshot = JSON.parse(JSON.stringify(db));
  let ok = false;
  try{ await idbSet(snapshot); ok = true; storageMode = 'idb'; }
  catch(e){ storageMode = 'ls'; }
  /* miroir localStorage : secours si IndexedDB est vidé, et compatibilité avec l'ancienne version */
  try{ localStorage.setItem(KEY, JSON.stringify(snapshot)); ok = true; }
  catch(e){}
  if(!ok) throw new Error('aucun stockage disponible');
  dirty = false;
}
/* iOS peut tuer l'app sans prévenir : on écrit dès qu'elle passe en arrière-plan */
function flushDB(){ if(dirty){ clearTimeout(saveTimer); writeNow().catch(()=>{}); } }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushDB(); });
window.addEventListener('pagehide', flushDB);
window.addEventListener('blur', flushDB);

/* ============================ TMDB ============================ */
const IMG = (p,size)=> p ? 'https://image.tmdb.org/t/p/'+size+p : '';
const isBearer = ()=> db.apiKey.startsWith('eyJ') || db.apiKey.length > 60;

async function tmdb(path, params, extra){
  if(!db.apiKey) throw new Error('NOKEY');
  const u = new URL('https://api.themoviedb.org/3'+path);
  u.searchParams.set('language', db.lang || 'fr-FR');
  for(const k in (params||{})) u.searchParams.set(k, params[k]);
  const opt = {};
  if(extra && extra.signal) opt.signal = extra.signal;      // permet d'abandonner la requête
  if(isBearer()) opt.headers = { Authorization:'Bearer '+db.apiKey };
  else u.searchParams.set('api_key', db.apiKey);
  const r = await fetch(u.toString(), opt);
  if(r.status === 401) throw new Error('BADKEY');
  if(r.status === 429){ await sleep(1200); return tmdb(path, params, extra); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* Récupère la série + toutes ses saisons (par paquets de 20 via append_to_response) */
async function fetchShowFull(id, onStep){
  const base = await tmdb('/tv/'+id);
  const nums = (base.seasons||[]).map(s=>s.season_number).sort((a,b)=>a-b);
  const seasons = {};
  for(let i=0;i<nums.length;i+=20){
    const chunk = nums.slice(i,i+20);
    if(onStep) onStep(Math.min(i+20,nums.length), nums.length);
    const d = await tmdb('/tv/'+id, { append_to_response: chunk.map(n=>'season/'+n).join(',') });
    chunk.forEach(n=>{
      const sd = d['season/'+n];
      if(sd && sd.episodes && sd.episodes.length){
        seasons[n] = sd.episodes.map(ep=>({
          e: ep.episode_number, n: ep.name || ('Épisode '+ep.episode_number),
          d: ep.air_date || null, r: ep.runtime || null, st: ep.still_path || null
        }));
      }
    });
  }
  return {
    id: base.id, name: base.name, poster: base.poster_path, backdrop: base.backdrop_path,
    overview: base.overview, first: base.first_air_date, status: base.status,
    runtime: (base.episode_run_time && base.episode_run_time[0]) || null,
    genres: (base.genres||[]).map(g=>g.name),
    note: base.vote_average || null,
    network: (base.networks && base.networks[0] && base.networks[0].name) || null,
    next: base.next_episode_to_air ? {
      s: base.next_episode_to_air.season_number, e: base.next_episode_to_air.episode_number,
      n: base.next_episode_to_air.name, d: base.next_episode_to_air.air_date
    } : null,
    seasons, updated: Date.now()
  };
}

/* ============================ Synchronisation ============================ */
/* Sauvegarde en ligne via Supabase : chaque utilisateur possède une ligne unique
   contenant l'ensemble de ses données. Les appareils fusionnent au lieu d'écraser. */

const TABLE = 'mes_series';
let syncing = false, syncTimer = null, syncState = 'off', syncError = '';

const syncReady = ()=> !!(db.sync && db.sync.url && db.sync.key);
const signedIn  = ()=> !!(db.auth && db.auth.token && db.auth.uid);
const sbBase    = ()=> String(db.sync.url).replace(/\/+$/,'');

async function sbFetch(path, opt, retry){
  opt = opt || {};
  const h = Object.assign({ apikey: db.sync.key, 'Content-Type':'application/json' }, opt.headers||{});
  if(signedIn() && !opt.noAuth) h.Authorization = 'Bearer ' + db.auth.token;
  const r = await fetch(sbBase()+path, Object.assign({}, opt, {headers:h}));
  if(r.status === 401 && signedIn() && !retry){
    if(await sbRefresh()) return sbFetch(path, opt, true);
  }
  const txt = await r.text();
  let body = null; try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
  if(!r.ok){
    const msg = (body && (body.msg || body.message || body.error_description || body.error)) || ('erreur '+r.status);
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return body;
}

async function sbSignUp(email, password){
  const d = await sbFetch('/auth/v1/signup', {method:'POST', noAuth:true,
    body: JSON.stringify({email, password})});
  if(d && d.access_token) return applySession(d);
  /* confirmation par e-mail activée côté Supabase */
  throw new Error('CONFIRM');
}
async function sbSignIn(email, password){
  const d = await sbFetch('/auth/v1/token?grant_type=password', {method:'POST', noAuth:true,
    body: JSON.stringify({email, password})});
  return applySession(d);
}
async function sbRefresh(){
  try{
    const d = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', noAuth:true,
      body: JSON.stringify({refresh_token: db.auth.refresh})});
    applySession(d); return true;
  }catch(e){ return false; }
}
function applySession(d){
  if(!d || !d.access_token) throw new Error('réponse inattendue du serveur');
  db.auth = { token:d.access_token, refresh:d.refresh_token,
              uid:(d.user&&d.user.id)||(db.auth&&db.auth.uid), email:(d.user&&d.user.email)||(db.auth&&db.auth.email) };
  saveDB();
  return db.auth;
}
function sbSignOut(){ db.auth = null; syncState='off'; saveDB(); render(); }

/* --- Fusion : on ne perd jamais un épisode coché, et les suppressions se propagent --- */
function payload(){
  return { apiKey: db.apiKey, lang: db.lang, pseudo: db.pseudo, shows: db.shows, movies: db.movies,
           deleted: db.deleted || {shows:{},movies:{}} };
}
function mergeRemote(rem){
  if(!rem || typeof rem !== 'object') return false;
  const del = db.deleted = db.deleted || {shows:{},movies:{}};
  const rdel = rem.deleted || {shows:{},movies:{}};
  ['shows','movies'].forEach(k=>{
    Object.keys(rdel[k]||{}).forEach(id=>{
      if(!del[k][id] || rdel[k][id] > del[k][id]) del[k][id] = rdel[k][id];
    });
  });

  let changed = false;
  /* séries */
  Object.values(rem.shows||{}).forEach(rs=>{
    if(del.shows[rs.id] && del.shows[rs.id] > (rs.addedAt||0)) return;   // supprimée ici après coup
    const ls = db.shows[rs.id];
    if(!ls){ db.shows[rs.id] = rs; changed = true; return; }
    /* fiche la plus récente, union des épisodes vus */
    const base = (rs.updated||0) > (ls.updated||0) ? Object.assign({}, rs) : Object.assign({}, ls);
    const w = Object.assign({}, ls.watched||{});
    Object.keys(rs.watched||{}).forEach(k=>{ if(!w[k]) { w[k] = rs.watched[k]; changed = true; } });
    base.watched = w;
    base.addedAt = Math.min(ls.addedAt||Date.now(), rs.addedAt||Date.now());
    db.shows[rs.id] = base;
  });
  /* films */
  Object.values(rem.movies||{}).forEach(rm=>{
    if(del.movies[rm.id] && del.movies[rm.id] > (rm.addedAt||0)) return;
    const lm = db.movies[rm.id];
    if(!lm){ db.movies[rm.id] = rm; changed = true; return; }
    if((rm.watchedAt||0) > (lm.watchedAt||0)){ db.movies[rm.id] = rm; changed = true; }
  });
  /* suppressions distantes à appliquer localement */
  ['shows','movies'].forEach(k=>{
    Object.keys(del[k]).forEach(id=>{
      const it = db[k][id];
      if(it && del[k][id] > (it.addedAt||0)){ delete db[k][id]; changed = true; }
    });
  });
  if(!db.apiKey && rem.apiKey){ db.apiKey = rem.apiKey; changed = true; }
  if(!db.pseudo && rem.pseudo){ db.pseudo = rem.pseudo; changed = true; }
  return changed;
}
function markDeleted(kind, id){
  db.deleted = db.deleted || {shows:{},movies:{}};
  db.deleted[kind][id] = Date.now();
}

async function syncNow(silent){
  if(!syncReady() || !signedIn() || syncing) return;
  syncing = true; syncState = 'busy'; syncError = ''; if(!silent) render();
  try{
    const got = await sbFetch('/rest/v1/'+TABLE+'?select=data&user_id=eq.'+encodeURIComponent(db.auth.uid), {});
    if(Array.isArray(got) && got.length) mergeRemote(got[0].data);
    await sbFetch('/rest/v1/'+TABLE, {
      method:'POST',
      headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: db.auth.uid, data: payload(), updated_at: new Date().toISOString() })
    });
    db.syncedAt = Date.now(); syncState = 'ok';
    await writeNow().catch(()=>{});
    if(!silent) toast('Synchronisé');
    render();
  }catch(e){
    syncState = 'err'; syncError = e.message || 'échec';
    if(!silent) toast('Synchro impossible : '+syncError);
    render();
  }
  syncing = false;
}
function scheduleSync(){
  if(!syncReady() || !signedIn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=> syncNow(true), 4000);
}

/* ============================ Partage par abonnement ============================ */
/* On ne consulte jamais la bibliothèque de quelqu'un sans y être abonné, et on ne
   s'abonne que par un code que la personne a elle-même généré. Tout est en lecture
   seule : rien de ce qui suit n'écrit dans les données d'autrui. */

let partage = { suivis:[], abonnes:[], charge:false, occupe:false, code:null };
const biblios = {};                       // caches mémoire, jamais enregistrés localement

async function majProfil(){
  if(!signedIn()) return;
  const pseudo = (db.pseudo || '').trim() || (db.auth.email||'').split('@')[0];
  db.pseudo = pseudo;
  try{
    await sbFetch('/rest/v1/profils', { method:'POST',
      headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: db.auth.uid, pseudo: pseudo, maj: new Date().toISOString() }) });
  }catch(e){}
}

async function chargerPartage(){
  if(!signedIn()) return;
  partage.occupe = true; partage.erreur = null;
  try{
    const liens = await sbFetch('/rest/v1/abonnements?select=suiveur,suivi,depuis', {});
    const moi = db.auth.uid;
    const idsSuivis  = liens.filter(l=>l.suiveur===moi).map(l=>l.suivi);
    const idsAbonnes = liens.filter(l=>l.suivi===moi).map(l=>l.suiveur);
    const tous = [...new Set(idsSuivis.concat(idsAbonnes))];
    let noms = {};
    if(tous.length){
      const ps = await sbFetch('/rest/v1/profils?select=user_id,pseudo&user_id=in.('+tous.join(',')+')', {});
      ps.forEach(p=> noms[p.user_id] = p.pseudo);
    }
    partage.suivis  = idsSuivis.map(id=>({ id, pseudo: noms[id] || 'Sans nom' }));
    partage.abonnes = idsAbonnes.map(id=>({ id, pseudo: noms[id] || 'Sans nom' }));
    partage.charge = true;
  }catch(e){ partage.erreur = e.message; }
  partage.occupe = false;
  if(view==='abos') render();
}

async function genererCode(){
  if(!signedIn()) return;
  const lettres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // sans I, O, 0, 1 pour éviter les confusions
  let code = '';
  const buf = new Uint32Array(6);
  (self.crypto || window.crypto).getRandomValues(buf);
  for(let i=0;i<6;i++) code += lettres[buf[i] % lettres.length];
  try{
    await majProfil();
    await sbFetch('/rest/v1/codes_partage', { method:'POST',
      headers:{ Prefer:'return=minimal' },
      body: JSON.stringify({ code: code, proprio: db.auth.uid }) });
    partage.code = code;
    render();
  }catch(e){ toast('Impossible de créer le code'); }
}

async function utiliserCode(saisi){
  const code = (saisi||'').trim().toUpperCase();
  if(code.length < 4) return toast('Code trop court');
  try{
    await majProfil();
    const r = await sbFetch('/rest/v1/rpc/utiliser_code', { method:'POST',
      body: JSON.stringify({ le_code: code }) });
    const nom = (Array.isArray(r) && r[0] && r[0].pseudo) || 'cette personne';
    toast('Tu suis maintenant '+nom);
    await chargerPartage();
    render();
  }catch(e){
    const m = String(e.message||'');
    if(/CODE_INVALIDE/.test(m))   toast('Code inconnu, déjà utilisé ou expiré');
    else if(/CODE_A_SOI/.test(m)) toast('Ce code est le tien');
    else toast('Échec : '+m);
  }
}

async function rompre(id, jeSuis){
  const q = jeSuis === 'suiveur'
    ? '?suiveur=eq.'+db.auth.uid+'&suivi=eq.'+id
    : '?suiveur=eq.'+id+'&suivi=eq.'+db.auth.uid;
  try{
    await sbFetch('/rest/v1/abonnements'+q, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    delete biblios[id];
    await chargerPartage();
    render();
    toast(jeSuis === 'suiveur' ? 'Désabonné' : 'Abonné retiré');
  }catch(e){ toast('Échec : '+e.message); }
}

/* Récupère la bibliothèque d'une personne suivie — lecture seule, gardée en mémoire */
async function chargerBiblio(id){
  try{
    const r = await sbFetch('/rest/v1/'+TABLE+'?select=data&user_id=eq.'+encodeURIComponent(id), {});
    biblios[id] = (Array.isArray(r) && r.length) ? (r[0].data || {}) : {};
  }catch(e){ biblios[id] = { erreur: e.message }; }
  if(view==='biblio') render();
}

/* ============================ Utilitaires ============================ */
const todayISO = ()=> new Date().toISOString().slice(0,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = (s,e)=> s+'x'+e;
const aired = ep => !!ep.d && ep.d <= todayISO();

function epRuntime(show, ep){ return ep.r || show.runtime || 42; }

function seasonNums(show, withSpecials){
  return Object.keys(show.seasons||{}).map(Number)
    .filter(n => withSpecials ? true : n > 0).sort((a,b)=>a-b);
}
function allEpisodes(show, withSpecials){
  const out = [];
  seasonNums(show, withSpecials).forEach(s=>{
    (show.seasons[s]||[]).forEach(ep=> out.push(Object.assign({}, ep, {s:s})));
  });
  return out;
}
function progress(show){
  const eps = allEpisodes(show,false).filter(aired);
  const w = eps.filter(ep => show.watched[key(ep.s,ep.e)]).length;
  return { watched:w, total:eps.length, pct: eps.length ? Math.round(w/eps.length*100) : 0 };
}
function nextToWatch(show){
  const eps = allEpisodes(show,false);
  for(const ep of eps){
    if(!aired(ep)) break;
    if(!show.watched[key(ep.s,ep.e)]) return ep;
  }
  return null;
}
function isFinished(show){
  const p = progress(show);
  const ended = show.status==='Ended' || show.status==='Canceled';
  return p.total>0 && p.watched===p.total && ended && !show.next;
}

/* ===== STATUT D'UN TITRE — source unique de vérité =====
   Un titre a exactement un statut, déduit des épisodes réellement cochés :
     'avoir'   : rien de vu             (films non vus, séries à 0 épisode vu)
     'asuivre' : commencé, pas terminé  (séries en cours, y compris « à jour »)
     'vu'      : terminé                (films vus, séries finies intégralement)
   Les épisodes hors-série (saison 0) sont visibles mais ne comptent jamais.
   Aucun écran ne doit appliquer sa propre règle : tout passe par ici.        */
function statutSerie(s){
  if(progress(s).watched === 0) return 'avoir';
  if(isFinished(s)) return 'vu';
  return 'asuivre';
}
function statutFilm(m){ return m.seen ? 'vu' : 'avoir'; }
function statut(o){ return o && o.seasons !== undefined ? statutSerie(o) : statutFilm(o); }
const LIB_STATUT = { avoir:'À voir', asuivre:'À suivre', vu:'Vu' };

function fmtDur(min){
  if(!min) return '0 min';
  const d = Math.floor(min/1440), h = Math.floor((min%1440)/60), m = min%60;
  const p = [];
  if(d) p.push(d+' j');
  if(h) p.push(h+' h');
  if(m && !d) p.push(m+' min');
  return p.join(' ') || '0 min';
}
/* ===== Numérotation des épisodes — une seule fonction pour toute l'app =====
   Forme unique « S5E132 », utilisée partout : liste des épisodes, à rattraper,
   calendrier, fenêtres de confirmation et messages. */
function codeEp(s, e){ return 'S'+s+'E'+e; }

function fmtDurShort(min){
  if(!min) return '0h';
  const d = Math.floor(min/1440), h = Math.floor((min%1440)/60), m = min%60;
  if(d) return d+'j '+h+'h';
  if(h) return h+'h'+(m?String(m).padStart(2,'0'):'');
  return m+'min';
}
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function fmtDate(iso){
  if(!iso) return 'Date inconnue';
  const d = new Date(iso+'T12:00:00');
  return d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear();
}
function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso+'T12:00:00');
  return d.getDate()+' '+MOIS[d.getMonth()];
}
function fmtDayLabel(iso){
  const t = todayISO();
  if(iso===t) return "Aujourd'hui";
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const tm = new Date(Date.now()+86400000).toISOString().slice(0,10);
  if(iso===y) return 'Hier';
  if(iso===tm) return 'Demain';
  const d = new Date(iso+'T12:00:00');
  return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
}
const year = iso => iso ? iso.slice(0,4) : '';

function posterEl(path, size, cls, alt){
  if(path) return '<img class="poster '+(cls||'')+'" loading="lazy" onerror="posterFail(this)" src="'+
    IMG(path,size)+'" alt="'+esc(alt||'')+'">';
  return '<div class="poster ph '+(cls||'')+'">'+esc((alt||'?').slice(0,18))+'</div>';
}
/* Vignette d'épisode : image TMDB si elle existe, sinon un cadre neutre de même taille.
   Chargement différé pour que les longues saisons restent fluides. */
function epThumb(ep){
  if(ep && ep.st)
    return '<div class="epthumb"><img loading="lazy" decoding="async" alt="" '+
           'onerror="thumbFail(this)" src="'+IMG(ep.st,'w300')+'"></div>';
  return '<div class="epthumb ph">'+I.frame+'</div>';
}
function thumbFail(img){
  const box = img.parentNode;
  if(box){ box.classList.add('ph'); box.innerHTML = I.frame; }
}

/* Si l'affiche ne charge pas, on retombe proprement sur le titre plutôt qu'une image cassée */
function posterFail(img){
  const d = document.createElement('div');
  d.className = img.className + ' ph';
  d.textContent = (img.getAttribute('alt')||'?').slice(0,18);
  img.replaceWith(d);
}

let view = 'follow';
let params = {};
let ui = { profTab:'series', editServer:false, searchType:'tv', searchQ:'', searchRes:null, searching:false, searchErr:'',
           openSeasons:{}, busy:false,
           /* Découvrir : type affiché, genres cochés, tri, note minimale, page en cours */
           disc:{ type:'tv', genres:[], tri:'nouveau', noteMin:0,
                  page:1, pages:1, res:[], loading:false, err:'', charge:false } };

const DEPTH = { search:0, discover:0, follow:0, profile:0, preview:1, show:1, movie:1, settings:1, abos:1, account:2, biblio:2 };
let navDir = 'none';
function go(v, p, dir){
  if(view===v && JSON.stringify(params)===JSON.stringify(p||{})){ window.scrollTo(0,0); render(); return; }
  const a = DEPTH[view]||0, b = DEPTH[v]||0;
  navDir = dir || (b > a ? 'enter' : b < a ? 'back' : 'none');
  view = v; params = p||{}; window.scrollTo(0,0);
  if(typeof hideUndo === 'function') hideUndo();
  render();
}
/* Cible du retour selon l'écran courant — utilisée par la flèche et par le balayage */
function currentBack(){
  if(view==='show' || view==='movie') return params.from || 'follow';
  if(view==='preview') return params.from || 'search';
  if(view==='settings') return params.from || null;
  if(view==='account') return 'settings';
  if(view==='abos') return params.from || 'profile';
  if(view==='biblio') return 'abos';
  return null;
}
function goBack(){
  if(document.getElementById('sheet').classList.contains('show')) return closeSheet();
  const t = currentBack();
  if(t) go(t, {}, 'back');
}
/* Balayage depuis le bord gauche pour revenir en arrière */
(function swipeBack(){
  let x0=null, y0=null, t0=0;
  document.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    if(t.clientX <= 28 && currentBack()){ x0=t.clientX; y0=t.clientY; t0=Date.now(); } else x0=null;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(x0===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX-x0, dy = Math.abs(t.clientY-y0);
    if(dx > 60 && dy < 45 && Date.now()-t0 < 700) goBack();
    x0=null;
  }, {passive:true});
})();

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(view==='follow') html = viewFollow();
  else if(view==='search') html = viewSearch();
  else if(view==='discover') html = viewDiscover();
  else if(view==='profile') html = viewProfile();
  else if(view==='settings') html = viewSettings();
  else if(view==='show') html = viewShow();
  else if(view==='preview') html = viewPreview();
  else if(view==='movie') html = viewMovie();
  else if(view==='account') html = viewAccount();
  else if(view==='abos') html = viewAbos();
  else if(view==='biblio') html = viewBiblio();
  app.innerHTML = html;
  app.classList.remove('enter','back');
  if(navDir==='enter' || navDir==='back'){ void app.offsetWidth; app.classList.add(navDir); }
  navDir = 'none';
  renderNav();
  if(view==='search'){
    const inp = document.getElementById('q');
    if(inp && ui.focusSearch){ inp.focus(); ui.focusSearch=false; }
  }
  /* Premier passage sur Découvrir : on va chercher les suggestions */
  if(view==='discover' && !ui.disc.charge && !ui.disc.loading && db.apiKey) chargerDecouverte();
}
function renderNav(){
  const tabs = [

    ['discover','Découvrir',I.boussole],

function needKeyBanner(){

/* ---------- Vue : À suivre (à rattraper + à venir) ---------- */
function viewFollow(){
  const shows = Object.values(db.shows);
  const t = todayISO();

  /* --- À rattraper : le prochain épisode non vu de chaque série --- */
  const todo = [];
  shows.forEach(s=>{
    if(statutSerie(s) !== 'asuivre') return;   // ni les non commencées, ni les terminées
    const nx = nextToWatch(s);
    if(nx) todo.push({s:s, ep:nx});
  });
  todo.sort((a,b)=> (b.ep.d||'').localeCompare(a.ep.d||''));   // épisode le plus récent d'abord

  /* --- À venir : diffusions futures --- */
  /* Les séries pas encore commencées (« À voir ») n'apparaissent pas ici :
     cet onglet ne parle que de ce qu'on suit réellement. */
  const items = [];
  shows.forEach(s=>{
    if(statutSerie(s) === 'avoir') return;
    allEpisodes(s,false).forEach(ep=>{ if(ep.d && ep.d >= t) items.push({d:ep.d, show:s, ep:ep}); });
    if(s.next && s.next.d && s.next.d >= t && !(s.seasons[s.next.s]||[]).some(e=>e.e===s.next.e))
      items.push({d:s.next.d, show:s, ep:{s:s.next.s, e:s.next.e, n:s.next.n, d:s.next.d}});
  });
  items.sort((a,b)=>a.d.localeCompare(b.d));
  const upcoming = items.slice(0,80);

  let html = header('À suivre', {right:'<button class="iconbtn" onclick="go(\'search\')">'+I.plus+'</button>'});
  html += needKeyBanner();

  if(!shows.length){
    return html + '<div class="empty">'+I.tv+'<h3>Rien à suivre pour l\'instant</h3>'+
      '<p>Ajoute une série ou un film depuis la recherche : tu retrouveras ici tes prochains épisodes et les dates de diffusion.</p>'+
      '<button class="btn" onclick="go(\'search\')">Chercher une série</button></div>';
  }

  /* Section 1 */
  html += '<div class="sectitle">À rattraper'+(todo.length?'<span class="cnt">'+todo.length+'</span>':'')+'</div>';
  if(!todo.length){
    const enAttente = shows.filter(x=>statutSerie(x)==='avoir').length;
    html += '<div class="wrap" style="padding-top:0"><div class="card" style="padding:18px;text-align:center">'+
      (enAttente
        ? '<div style="font-size:15px;font-weight:650">Rien de commencé</div>'+
          '<div class="small muted" style="margin-top:3px">'+enAttente+' série'+(enAttente>1?'s':'')+
          ' t\'attend'+(enAttente>1?'ent':'')+' dans « À voir ».</div>'+
          '<button class="btn ghost" style="margin-top:12px" onclick="ui.profTab=\'avoir\';go(\'profile\')">Ouvrir À voir</button>'
        : '<div style="font-size:15px;font-weight:650">Tu es à jour partout 🎉</div>'+
          '<div class="small muted" style="margin-top:3px">Plus aucun épisode diffusé en attente.</div>')+
      '</div></div>';
  } else {
    html += '<div class="list">'+todo.map(x=>catchupRow(x.s,x.ep)).join('')+'</div>';
  }

  /* Section 2 */
  html += '<div class="sectitle">À venir</div>';
  if(!upcoming.length){
    html += '<div class="wrap" style="padding-top:0"><div class="card" style="padding:18px;text-align:center">'+
      '<div class="small muted">Aucune date de diffusion annoncée pour tes séries.</div></div></div>';
  } else {
    let cur = '', out = '<div class="day">';
    upcoming.forEach(i=>{
      if(i.d !== cur){ cur = i.d; out += '<div class="daylbl">'+fmtDayLabel(i.d)+'</div>'; }
      const thumb = IMG(i.ep.st,'w300') || IMG(i.show.backdrop,'w300') || IMG(i.show.poster,'w154');
      out += '<div class="crow" onclick="go(\'show\',{id:'+i.show.id+',from:\'follow\'})">'+
        (thumb ? '<img class="cthumb" loading="lazy" src="'+thumb+'" alt="">' : '<div class="cthumb"></div>')+
        '<div class="epinfo">'+
          '<div class="epname">'+esc(i.show.name)+'</div>'+
          '<div class="epsub">'+codeEp(i.ep.s,i.ep.e)+' · '+esc(i.ep.n||'')+'</div>'+
        '</div></div>';
    });
    out += '</div>';
    html += out;
  }
  return html + '<div style="height:24px"></div>';
}

function catchupRow(s, nx){
  const p = progress(s);
  const recent = nx.d && nx.d < todayISO() && (Date.now()-Date.parse(nx.d)) < 45*86400000;
  return '<div class="srow">'+
    '<div style="display:flex;gap:12px;flex:1;min-width:0" onclick="go(\'show\',{id:'+s.id+',from:\'follow\'})">'+
      posterEl(s.poster,'w154','',s.name)+
      '<div class="sinfo">'+
        '<div class="sname">'+esc(s.name)+'</div>'+
        '<div class="snext"><b>'+codeEp(nx.s,nx.e)+'</b> · '+esc(nx.n)+'</div>'+
        '<div class="tiny muted" style="margin-top:2px">'+
          p.watched+' / '+p.total+' épisodes'+
          (recent ? ' · sorti le '+fmtDateShort(nx.d) : '')+'</div>'+
        '<div class="bar"><i style="width:'+p.pct+'%"></i></div>'+
      '</div>'+
    '</div>'+
    '<button class="watchbtn" title="Marquer '+codeEp(nx.s,nx.e)+' comme vu" onclick="quickWatch('+s.id+',event)">'+I.check+'</button>'+
  '</div>';
}

/* ---------- Vue : Mon profil ---------- */
function lastWatchedAt(s){
  let m = 0;
  for(const k in s.watched){ if(s.watched[k] > m) m = s.watched[k]; }
  return m;
}

function viewProfile(){
  let epCount = 0, minutes = 0, doneShows = 0;
  Object.values(db.shows).forEach(s=>{
    allEpisodes(s,true).forEach(ep=>{
      if(s.watched[key(ep.s,ep.e)]){ epCount++; minutes += epRuntime(s,ep); }
    });
    if(isFinished(s)) doneShows++;
  });
  const seenMovies = Object.values(db.movies).filter(m=>m.seen);
  seenMovies.forEach(m=> minutes += (m.runtime||100));

  const startedShows = Object.values(db.shows).filter(s=>statutSerie(s)!=='avoir')
    .sort((a,b)=>lastWatchedAt(b)-lastWatchedAt(a));
  const watchedMovies = Object.values(db.movies).filter(m=>statutFilm(m)==='vu')
    .sort((a,b)=>(b.watchedAt||0)-(a.watchedAt||0));
  const toWatch = [].concat(
    Object.values(db.shows).filter(s=>statutSerie(s)==='avoir').map(s=>({type:'show', o:s})),
    Object.values(db.movies).filter(m=>statutFilm(m)==='avoir').map(m=>({type:'movie', o:m}))
  );

  const tabs = [['series','Séries',startedShows.length],
                ['films','Films',watchedMovies.length],
                ['avoir','À voir',toWatch.length]];

  let html = header('Mon profil', {
    right:'<button class="iconbtn" onclick="profileMenu()">'+I.dots+'</button>',
    sub:'<div class="chips">'+tabs.map(([id,l,n])=>
      '<button class="chip '+(ui.profTab===id?'on':'')+'" onclick="ui.profTab=\''+id+'\';render()">'+
      l+' <span style="opacity:.65">'+n+'</span></button>').join('')+'</div>'
  });

  html += '<div class="stats">'+
    '<div class="stat"><b>'+epCount+'</b><span>épisode'+(epCount>1?'s':'')+' vu'+(epCount>1?'s':'')+'</span></div>'+
    '<div class="stat"><b>'+fmtDurShort(minutes)+'</b><span>de visionnage</span></div>'+
    '<div class="stat"><b>'+doneShows+'</b><span>série'+(doneShows>1?'s':'')+' finie'+(doneShows>1?'s':'')+'</span></div>'+
  '</div>';
  html += '<div class="wrap" style="padding-top:0"><div class="card" style="padding:13px;text-align:center">'+
    '<span class="small muted">'+startedShows.length+' série'+(startedShows.length>1?'s':'')+' suivie'+(startedShows.length>1?'s':'')+
    ' · '+watchedMovies.length+' film'+(watchedMovies.length>1?'s':'')+' vu'+(watchedMovies.length>1?'s':'')+
    ' · soit '+fmtDur(minutes)+'</span></div></div>';

  if(signedIn() && partage.suivis.length){
    html += '<div class="sectitle">Mes abonnements<span class="cnt">'+partage.suivis.length+'</span></div>'+
      '<div class="aborow">'+partage.suivis.slice(0,8).map(p=>
        '<button class="abomini" onclick="ouvrirBiblio(\''+p.id+'\')">'+
          '<div class="avatar">'+esc((p.pseudo||'?').charAt(0).toUpperCase())+'</div>'+
          '<span>'+esc(p.pseudo)+'</span></button>').join('')+
        '<button class="abomini" onclick="ouvrirAbos()"><div class="avatar plus">'+I.plus+'</div><span>Gérer</span></button>'+
      '</div>';
  }

  let cards = '';
  if(ui.profTab==='series'){
    if(!startedShows.length) cards = emptyProf('Aucune série commencée', 'Coche un épisode et la série apparaîtra ici.');
    else cards = '<div class="pgrid">'+startedShows.map(showCard).join('')+'</div>';
  } else if(ui.profTab==='films'){
    if(!watchedMovies.length) cards = emptyProf('Aucun film vu', 'Marque un film comme vu depuis la recherche.');
    else cards = '<div class="pgrid">'+watchedMovies.map(movieCard).join('')+'</div>';
  } else {
    if(!toWatch.length) cards = emptyProf('Rien en attente', 'Les séries ajoutées mais pas commencées et les films « à voir » se rangent ici.');
    else cards = '<div class="pgrid">'+toWatch.map(x=> x.type==='show' ? showCard(x.o) : movieCard(x.o)).join('')+'</div>';
  }
  return html + cards + '<div style="height:26px"></div>';
}

}

function showCard(s){
  const p = progress(s);
  const full = p.total>0 && p.watched===p.total;
  const st = statutSerie(s);
  const sub = st==='avoir'
      ? (p.total ? p.total+' épisode'+(p.total>1?'s':'') : 'Pas encore diffusée')
      : (full ? (isFinished(s)?'Terminée':'À jour') : p.pct+'%');
  return '<div class="pcard">'+
    '<div class="ptap" onclick="go(\'show\',{id:'+s.id+',from:\'profile\'})">'+
      '<div class="wrapimg">'+posterEl(s.poster,'w342','',s.name)+
        (st!=='avoir' && p.total ? '<div class="pbadge '+(full?'done':'')+'">'+p.watched+'/'+p.total+'</div>' : '')+
        (st!=='avoir' ? '<div class="pbar"><i class="'+(full?'full':'')+'" style="width:'+p.pct+'%"></i></div>' : '')+
      '</div>'+
      '<div class="pname">'+esc(s.name)+'</div>'+
      '<div class="psub">'+sub+'</div>'+
    '</div>'+
  '</div>';
}

function movieCard(m){
  return '<div class="pcard">'+
    '<div class="ptap" onclick="go(\'movie\',{id:'+m.id+',from:\'profile\'})">'+
      '<div class="wrapimg">'+posterEl(m.poster,'w342','',m.title)+
        (statutFilm(m)==='vu' ? '<div class="pbadge done">vu</div>' : '')+
      '</div>'+
      '<div class="pname">'+esc(m.title)+'</div>'+
      '<div class="psub">'+esc(year(m.date))+'</div>'+
    '</div>'+
  '</div>';
}

/* ---------- Vue : Recherche ---------- */
/* Recherche progressive : 2 caractères minimum, 300 ms d'attente après la dernière
   frappe, requête précédente abandonnée, 8 résultats au maximum. Le champ n'est jamais
   redessiné pendant la frappe — seule la zone de résultats est rafraîchie. */
const SEARCH_MIN = 2, SEARCH_WAIT = 300, SEARCH_MAX = 8;
let searchTimer = null, searchAbort = null, searchSeq = 0;

function viewSearch(){
  const sub = '<div class="chips">'+
    '<button class="chip '+(ui.searchType==='tv'?'on':'')+'" onclick="setSearchType(\'tv\')">Séries</button>'+
    '<button class="chip '+(ui.searchType==='movie'?'on':'')+'" onclick="setSearchType(\'movie\')">Films</button>'+
    '</div>';
  const body = '<div class="wrap" style="padding-bottom:4px">'+
    '<input type="search" id="q" enterkeyhint="search" autocomplete="off" autocorrect="off" '+
    'placeholder="'+(ui.searchType==='tv'?'Nom d\'une série…':'Titre d\'un film…')+'" '+
    'value="'+esc(ui.searchQ)+'" oninput="onSearchInput(this.value)" '+
    'onkeydown="if(event.key===\'Enter\'){this.blur();searchNow()}">'+
    '</div>'+
    '<div id="sres">'+searchBody()+'</div>';
  return header('Recherche',{sub:sub}) + needKeyBanner() + body + '<div style="height:20px"></div>';
}

/* Zone de résultats seule : chargement, erreur, aucun résultat, ou la grille */
function searchBody(){
  if(ui.searching)
    return '<div class="empty"><span class="spin"></span><p style="margin-top:12px">Recherche…</p></div>';
  if(ui.searchErr)
    return '<div class="empty">'+I.search+'<h3>'+esc(ui.searchErr)+'</h3>'+
      '<p>Vérifie ta connexion, puis réessaie.</p>'+
      '<button class="btn ghost" onclick="searchNow()">Réessayer</button></div>';
  if(ui.searchRes === null)
    return '<div class="empty">'+I.search+'<h3>Cherche '+(ui.searchType==='tv'?'une série':'un film')+'</h3>'+
      '<p>Les suggestions apparaissent dès '+SEARCH_MIN+' lettres.</p></div>';
  if(!ui.searchRes.length)
    return '<div class="empty"><h3>Aucun résultat</h3><p>Essaie une autre orthographe, ou l\'autre onglet.</p></div>';
  return '<div class="grid">'+ui.searchRes.map(searchCard).join('')+'</div>';
}

/* Rafraîchit uniquement les résultats : le champ garde le focus et le curseur */
function paintSearch(){
  const el = document.getElementById('sres');
  if(view==='search' && el) el.innerHTML = searchBody();
  else render();
}

function onSearchInput(v){
  ui.searchQ = v;
  clearTimeout(searchTimer);
  abortSearch();
  const q = v.trim();
  if(q.length < SEARCH_MIN){
    ui.searchRes = null; ui.searching = false; ui.searchErr = '';
    paintSearch(); return;
  }
  ui.searching = true; ui.searchErr = '';
  paintSearch();
  searchTimer = setTimeout(()=> runSearch(q), SEARCH_WAIT);
}

function searchNow(){
  clearTimeout(searchTimer);
  const q = (ui.searchQ||'').trim();
  if(q.length < SEARCH_MIN) return;
  ui.searching = true; ui.searchErr = ''; paintSearch();
  runSearch(q);
}

function abortSearch(){
  if(searchAbort){ try{ searchAbort.abort(); }catch(e){} searchAbort = null; }
}

async function runSearch(q){
  if(!db.apiKey){
    ui.searching = false; paintSearch();
    toast('Ajoute ta clé TMDB dans Réglages');
    return go('settings', {from:'search'});
  }
  const seq = ++searchSeq;
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  searchAbort = ctrl;
  try{
    const d = await tmdb('/search/'+ui.searchType, { query:q, include_adult:'false' },
                         ctrl ? {signal:ctrl.signal} : null);
    if(seq !== searchSeq) return;                      // une frappe plus récente a pris la main
    ui.searchRes = (d.results||[]).slice(0, SEARCH_MAX);
    ui.searching = false; ui.searchErr = '';
    paintSearch();
  }catch(e){
    if((e && e.name === 'AbortError') || seq !== searchSeq) return;
    ui.searching = false;
    ui.searchErr = (e.message === 'BADKEY') ? 'Clé TMDB refusée' : 'Pas de connexion';
    ui.searchRes = [];
    paintSearch();
  }
}

function setSearchType(t){
  if(ui.searchType === t) return;
  ui.searchType = t; ui.searchRes = null; ui.searchErr = '';
  clearTimeout(searchTimer); abortSearch();
  render();
  if((ui.searchQ||'').trim().length >= SEARCH_MIN) searchNow();
}

function searchCard(r){
  const isTv = ui.searchType==='tv';
  const id = r.id;
  const name = isTv ? r.name : r.title;
  const date = isTv ? r.first_air_date : r.release_date;
  const item = isTv ? db.shows[id] : db.movies[id];
  const st   = item ? statut(item) : null;
  const note = r.vote_average ? Math.round(r.vote_average*10)/10 : null;

  let coin = '';
  if(st === 'vu')      coin = '<div class="tick vu">'+I.check+'</div>';
  else if(st === 'avoir')   coin = '<div class="tick avoir">'+I.bookmark+'</div>';
  else if(st === 'asuivre'){
    const p = progress(item);
    coin = '<div class="tick suivi">'+p.watched+'/'+p.total+'</div>';
  }

  return '<button class="gcard" onclick="openPreview('+id+',\''+(isTv?'tv':'movie')+'\',\'search\')">'+
    posterEl(r.poster_path,'w342','',name)+ coin +
    '<div class="gname">'+esc(name)+'</div>'+
    '<div class="gyear">'+esc(year(date))+(note?' · ★ '+note:'')+'</div>'+
    (st ? '<div class="gstat '+st+'">'+LIB_STATUT[st]+'</div>' : '')+
  '</button>';
}

async function addMovie(id, seen){
  try{
    const m = db.movies[id] ? null : await tmdb('/movie/'+id);
    if(m){
      db.movies[id] = { id:m.id, title:m.title, poster:m.poster_path, backdrop:m.backdrop_path,
        date:m.release_date, runtime:m.runtime, overview:m.overview,

        seen:!!seen, watchedAt: seen?Date.now():null, addedAt:Date.now() };

      db.movies[id].watchedAt = seen?Date.now():null;

/* ---------- Vue : Découvrir (suggestions, filtres, nouveautés) ----------
   Tout passe par /discover/tv et /discover/movie. Les genres ne sont jamais
   codés en dur : ils sont demandés à TMDB (/genre/tv/list, /genre/movie/list)
   pour que les identifiants et les libellés français viennent de la source. */

const DISC_TYPES = [
  { id:'tv',    label:'Séries' },
  { id:'movie', label:'Films' },
  { id:'mini',  label:'Mini-séries' },
  { id:'anime', label:'Animés' }
];
const DISC_TRIS = [
  { id:'nouveau',   label:'Sorti récemment' },
  { id:'populaire', label:'Populaire' },
  { id:'note',      label:'Mieux notés' }
];
const DISC_NOTES = [
  { v:0, label:'Toutes' }, { v:6, label:'6 et +' }, { v:7, label:'7 et +' }, { v:8, label:'8 et +' }
];
const DISC_FENETRE = 90;     // « sorti récemment » = les 90 derniers jours

const genresTMDB = { tv:null, movie:null };
let discSeq = 0;

/* Le média TMDB derrière chaque puce : mini-séries et animés restent des séries. */
function discMedia(){ return ui.disc.type === 'movie' ? 'movie' : 'tv'; }
function isoIlYA(jours){ return new Date(Date.now() - jours*86400000).toISOString().slice(0,10); }

function genreParNom(media, nom){
  const l = genresTMDB[media] || [];
  const g = l.find(x => (x.nom||'').toLowerCase() === nom.toLowerCase());
  return g ? g.id : null;
}

/* Les genres proposés dépendent du type choisi. Pour les animés, « Animation »
   est déjà imposé : inutile de le proposer une deuxième fois. */
function genresAffiches(){
  const l = genresTMDB[discMedia()] || [];
  return ui.disc.type === 'anime' ? l.filter(g => (g.nom||'').toLowerCase() !== 'animation') : l;
}

/* Traduit l'état des filtres en paramètres TMDB.
   Les genres sont retenus par leur nom : « Comédie » suit quand on passe
   des séries aux films, même si TMDB ne lui donne pas le même identifiant. */
function discParams(){
  const d = ui.disc, media = discMedia();
  const p = { include_adult:'false', page:String(d.page) };

  const noms = d.genres.slice();
  if(d.type === 'mini') p.with_type = '2';                       // 2 = mini-série chez TMDB
  if(d.type === 'anime'){
    p.with_original_language = 'ja';
    if(noms.indexOf('Animation') < 0) noms.unshift('Animation');
  }
  const ids = noms.map(n => genreParNom(media, n)).filter(x => x != null);
  if(ids.length) p.with_genres = ids.join(',');

  if(d.tri === 'note'){ p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = '300'; }
  else p.sort_by = 'popularity.desc';

  if(d.tri === 'nouveau'){
    const champ = media === 'movie' ? 'primary_release_date' : 'first_air_date';
    p[champ+'.gte'] = isoIlYA(DISC_FENETRE);
    p[champ+'.lte'] = todayISO();
  }
  if(d.noteMin){
    p['vote_average.gte'] = String(d.noteMin);
    if(!p['vote_count.gte']) p['vote_count.gte'] = '100';        // évite les 10/10 à trois votes
  }
  return p;
}

async function chargerGenres(media){
  if(genresTMDB[media]) return genresTMDB[media];
  const d = await tmdb('/genre/'+media+'/list');
  genresTMDB[media] = (d.genres||[]).map(g=>({ id:g.id, nom:g.name }));
  return genresTMDB[media];
}

async function chargerDecouverte(suite){
  const d = ui.disc;
  if(!db.apiKey){ toast('Ajoute ta clé TMDB dans Réglages'); return go('settings', {from:'discover'}); }
  const seq = ++discSeq;
  d.page = suite ? d.page + 1 : 1;
  if(!suite){ d.res = []; d.pages = 1; }
  d.loading = true; d.err = '';
  peindreDisc();
  try{
    const media = discMedia();
    await chargerGenres(media);
    /* Un genre qui n'existe pas pour ce type est retiré, mais on le dit. */
    const perdus = d.genres.filter(n => genreParNom(media, n) == null);
    if(perdus.length){
      d.genres = d.genres.filter(n => genreParNom(media, n) != null);
      toast(perdus.length > 1
        ? 'Genres sans équivalent ici : '+perdus.join(', ')
        : '« '+perdus[0]+' » n\'existe pas pour ce type');
    }
    const data = await tmdb('/discover/'+media, discParams());
    if(seq !== discSeq) return;
    const trouves = (data.results||[]).filter(r => r.poster_path);
    d.res = suite ? d.res.concat(trouves) : trouves;
    d.pages = data.total_pages || 1;
    d.loading = false; d.err = ''; d.charge = true;
    peindreDisc();
  }catch(e){
    if(seq !== discSeq) return;
    if(suite) d.page = Math.max(1, d.page - 1);
    d.loading = false; d.charge = true;
    d.err = (e.message === 'BADKEY') ? 'Clé TMDB refusée' : 'Pas de connexion';
    peindreDisc();
  }
}

/* Ne repeint que la zone des résultats : les puces gardent leur défilement.
   La ligne de résumé et le bouton Filtres sont remis à jour au passage,
   pour que l'état des filtres reste visible sous les puces de type. */
function peindreDisc(){
  if(view !== 'discover') return;
  const el = document.getElementById('dres');
  if(!el) return render();
  el.innerHTML = discBody();
  const r = document.querySelector('.resume');
  if(r) r.innerHTML = '<b>'+esc(resumeFiltres())+'</b>';
  const b = document.querySelector('header .iconbtn');
  if(b) b.classList.toggle('actif', filtresActifs());
}

function setDiscType(t){
  if(ui.disc.type === t) return;
  ui.disc.type = t;
  render();
  chargerDecouverte();
}
function setDiscTri(t){ ui.disc.tri = t; ouvrirFiltres(); chargerDecouverte(); }
function setDiscNote(n){ ui.disc.noteMin = n; ouvrirFiltres(); chargerDecouverte(); }
function bascGenre(i){
  const g = genresAffiches()[i];
  if(!g) return;
  const sel = ui.disc.genres, k = sel.indexOf(g.nom);
  if(k < 0) sel.push(g.nom); else sel.splice(k,1);
  ouvrirFiltres(); chargerDecouverte();
}
function resetFiltres(){
  ui.disc.genres = []; ui.disc.tri = 'nouveau'; ui.disc.noteMin = 0;
  ouvrirFiltres(); chargerDecouverte();
}

function resumeFiltres(){
  const d = ui.disc;
  const bouts = [ (DISC_TRIS.find(t=>t.id===d.tri)||{}).label ];
  if(d.noteMin) bouts.push('note '+d.noteMin+' et +');
  d.genres.forEach(n=> bouts.push(n.toLowerCase()));
  return bouts.join(' · ');
}
function filtresActifs(){ return ui.disc.genres.length > 0 || ui.disc.noteMin > 0 || ui.disc.tri !== 'nouveau'; }

function ouvrirFiltres(){
  const d = ui.disc;
  const genres = genresAffiches();
  const quoi = (DISC_TYPES.find(t=>t.id===d.type)||{}).label || '';
  let h = '<h3>Filtres</h3><div class="small muted" style="margin-top:-4px">'+
    'Ces réglages s\'appliquent à <b>'+esc(quoi.toLowerCase())+'</b>.</div>';
  h += '<div class="fgrp">Trier par</div><div class="fchips">'+
    DISC_TRIS.map(t=>'<button class="chip '+(d.tri===t.id?'on':'')+'" onclick="setDiscTri(\''+t.id+'\')">'+
      t.label+'</button>').join('')+'</div>';
  h += '<div class="fgrp">Note minimale</div><div class="fchips">'+
    DISC_NOTES.map(n=>'<button class="chip '+(d.noteMin===n.v?'on':'')+'" onclick="setDiscNote('+n.v+')">'+
      n.label+'</button>').join('')+'</div>';
  h += '<div class="fgrp">Genres'+(d.genres.length?' ('+d.genres.length+')':'')+
       (d.type==='anime'?' · animation déjà incluse':'')+'</div>';
  h += genres.length
    ? '<div class="fchips">'+genres.map((g,i)=>'<button class="chip '+(d.genres.indexOf(g.nom)>=0?'on':'')+
        '" onclick="bascGenre('+i+')">'+esc(g.nom)+'</button>').join('')+'</div>'
    : '<div class="small muted">Les genres arrivent avec les premiers résultats.</div>';
  h += '<button class="btn" style="margin-top:18px" onclick="closeSheet()">Voir les résultats</button>';
  if(filtresActifs()) h += '<button class="opt" onclick="resetFiltres()">Tout effacer</button>';
  openSheet(h);
}

function viewDiscover(){
  const d = ui.disc;
  const sub = '<div class="chips">'+DISC_TYPES.map(t=>
    '<button class="chip '+(d.type===t.id?'on':'')+'" onclick="setDiscType(\''+t.id+'\')">'+
      t.label+'</button>').join('')+'</div>'+
    '<div class="resume"><b>'+esc(resumeFiltres())+'</b></div>';
  const bouton = '<button class="iconbtn '+(filtresActifs()?'actif':'')+'" onclick="ouvrirFiltres()">'+I.filtre+'</button>';
  return header('Découvrir', {right:bouton, sub:sub}) + needKeyBanner() +
    '<div id="dres">'+discBody()+'</div>' + '<div style="height:20px"></div>';
}

function discBody(){
  const d = ui.disc;
  if(!db.apiKey)
    return '<div class="empty">'+I.boussole+'<h3>Clé TMDB manquante</h3>'+
      '<p>Les suggestions viennent de TMDB : ajoute ta clé dans les réglages.</p>'+
      '<button class="btn ghost" onclick="go(\'settings\',{from:\'discover\'})">Ouvrir les réglages</button></div>';
  if(d.loading && !d.res.length)
    return '<div class="empty"><span class="spin"></span><p style="margin-top:12px">Recherche de titres…</p></div>';
  if(d.err)
    return '<div class="empty">'+I.boussole+'<h3>'+esc(d.err)+'</h3>'+
      '<p>Vérifie ta connexion, puis réessaie.</p>'+
      '<button class="btn ghost" onclick="chargerDecouverte()">Réessayer</button></div>';
  if(!d.res.length)
    return '<div class="empty">'+I.boussole+'<h3>Rien avec ces filtres</h3>'+
      '<p>Élargis la note minimale ou retire un genre.</p>'+
      '<button class="btn ghost" onclick="ouvrirFiltres()">Ouvrir les filtres</button></div>';
  return '<div class="grid">'+d.res.map(discCard).join('')+'</div>'+
    (d.page < d.pages
      ? '<div class="plus"><button class="btn ghost" onclick="chargerDecouverte(true)"'+
        (d.loading?' disabled':'')+'>'+(d.loading?'<span class="spin"></span> Chargement…':'Voir plus')+'</button></div>'
      : '');
}

function discCard(r){
  const media = discMedia(), isTv = media === 'tv';
  const name = isTv ? r.name : r.title;
  const date = isTv ? r.first_air_date : r.release_date;
  const item = isTv ? db.shows[r.id] : db.movies[r.id];
  const st   = item ? statut(item) : null;
  const note = r.vote_average ? Math.round(r.vote_average*10)/10 : null;
  const votes = r.vote_count || 0;

  let coin = '';
  if(st === 'vu')         coin = '<div class="tick vu">'+I.check+'</div>';
  else if(st === 'avoir') coin = '<div class="tick avoir">'+I.bookmark+'</div>';
  else if(st === 'asuivre'){
    const p = progress(item);
    coin = '<div class="tick suivi">'+p.watched+'/'+p.total+'</div>';
  }

  return '<button class="gcard" onclick="openPreview('+r.id+',\''+media+'\',\'discover\')">'+
    posterEl(r.poster_path,'w342','',name)+ coin +
    (note ? '<div class="gnote">'+I.star+note.toFixed(1)+'</div>' : '')+
    '<div class="gname">'+esc(name)+'</div>'+
    '<div class="gyear">'+esc(year(date))+(votes?' · '+votes+' vote'+(votes>1?'s':''):'')+'</div>'+
    (st ? '<div class="gstat '+st+'">'+LIB_STATUT[st]+'</div>' : '')+
  '</button>';
}

/* ---------- Vue : aperçu avant ajout (série ou film) ---------- */
function openPreview(id, type, from){
  ui.preview = { id:id, type:type, loading:true, data:null };
  go('preview', {id:id, type:type, from:from||'search'});
  loadPreview();
}
async function loadPreview(){
  const id = params.id, type = params.type;
  try{
    const d = await tmdb('/'+type+'/'+id, { append_to_response:'credits' });
    if(ui.preview.id===id) ui.preview = { id:id, type:type, loading:false, data:d };
  }catch(e){
    if(ui.preview.id===id) ui.preview = { id:id, type:type, loading:false, error:
      (e.message==='BADKEY' ? 'Clé TMDB invalide' : 'Impossible de charger la fiche') };
  }
  if(view==='preview') render();
}

function castStrip(credits){
  const cast = ((credits||{}).cast||[]).slice(0,12);
  if(!cast.length) return '';
  return '<div class="sectitle">Casting</div><div class="cast">'+cast.map(p=>
    '<div class="cperson">'+
      (p.profile_path ? '<img loading="lazy" src="'+IMG(p.profile_path,'w185')+'" alt="">'
                      : '<div class="ph2">'+esc((p.name||'?')[0])+'</div>')+
      '<div class="cname">'+esc(p.name)+'</div>'+
      '<div class="crole">'+esc(p.character||'')+'</div>'+
    '</div>').join('')+'</div>';
}

function viewPreview(){
  const isTv = params.type==='tv';
  const back = "goBack()";
  const st = ui.preview || {};

  if(st.loading) return header('Chargement…',{back:back})+
    '<div class="empty"><span class="spin"></span><p style="margin-top:12px">Chargement de la fiche…</p></div>';
  if(st.error) return header('Erreur',{back:back})+
    '<div class="empty"><h3>Oups</h3><p>'+esc(st.error)+'</p>'+
    '<button class="btn ghost" onclick="loadPreview()">Réessayer</button></div>';
  if(!st.data) return header('',{back:back});

  const d = st.data;
  const title = isTv ? d.name : d.title;
  const date = isTv ? d.first_air_date : d.release_date;
  const inList = isTv ? !!db.shows[d.id] : !!db.movies[d.id];
  const note = d.vote_average ? Math.round(d.vote_average*10)/10 : null;

  let html = header(title,{back:back});
  html += '<div class="hero">'+(d.backdrop_path?'<img src="'+IMG(d.backdrop_path,'w780')+'" alt="">':'')+'</div>';
  html += '<div class="dhead">'+posterEl(d.poster_path,'w342','',title)+

/* Cocher une saison marque aussi les précédentes ; la décocher libère les suivantes.
   Les hors-série (saison 0) restent indépendants et ne déclenchent aucune cascade. */
function toggleWholeSeason(id, n){
  const sh = db.shows[id];
  const eps = sh.seasons[n] || [];
  const allOn = eps.length > 0 && eps.every(ep => sh.watched[key(n, ep.e)]);
  const cibles = (n === 0) ? [0]
      : allOn ? seasonNums(sh,false).filter(x => x >= n)
              : seasonNums(sh,false).filter(x => x <= n);

  let nb = 0;
  cibles.forEach(x => (sh.seasons[x]||[]).forEach(ep=>{
    const on = !!sh.watched[key(x, ep.e)];
    if(allOn ? on : (!on && aired(ep))) nb++;
  }));
  if(!nb) return;

  const quoi = (n === 0) ? 'Hors-série'
      : cibles.length > 1 ? 'Saisons '+Math.min.apply(null,cibles)+' à '+Math.max.apply(null,cibles)
      : 'Saison '+n;
  applyWatched(id, s2=>{
    const t = Date.now();
    cibles.forEach(x => (s2.seasons[x]||[]).forEach(ep=>{
      if(allOn) delete s2.watched[key(x, ep.e)];
      else if(aired(ep)) s2.watched[key(x, ep.e)] = t;
    }));
  }, quoi+' · '+nb+(allOn ? ' décoché' : ' vu')+(nb>1?'s':''));
}

/* Toute la série vue / tout décocher — même moteur, donc annulable */
function marquerToutVu(id){
  const sh = db.shows[id];
  const nb = allEpisodes(sh,true).filter(ep=>aired(ep) && !sh.watched[key(ep.s,ep.e)]).length;
  if(!nb) return toast('Déjà tout vu');
  applyWatched(id, s=>{
    const t = Date.now();
    allEpisodes(s,true).forEach(ep=>{ if(aired(ep)) s.watched[key(ep.s,ep.e)] = t; });
  }, nb+' épisode'+(nb>1?'s':'')+' marqué'+(nb>1?'s':'')+' vu'+(nb>1?'s':''));
}
function toutDecocher(id){
  const nb = Object.keys(db.shows[id].watched).length;
  if(!nb) return;
  applyWatched(id, s=>{ s.watched = {}; },
    nb+' épisode'+(nb>1?'s':'')+' décoché'+(nb>1?'s':''));
}
function toggleToutVu(id){
  const p = progress(db.shows[id]);
  if(p.total > 0 && p.watched === p.total) toutDecocher(id); else marquerToutVu(id);
}
/* ===== Marquage groupé, statut recalculé une seule fois, action annulable ===== */
let undoData = null, undoTimer = null;

function pushUndo(showId, prevWatched, label){
  undoData = { showId, prev: prevWatched };
  const el = document.getElementById('undo');
  el.innerHTML = '<span>'+esc(label)+'</span><button onclick="doUndo()">Annuler</button>';
  el.classList.add('show');
  document.body.classList.add('undo');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, 10000);
}
function hideUndo(){
  clearTimeout(undoTimer);
  const el = document.getElementById('undo');
  if(el) el.classList.remove('show');
  document.body.classList.remove('undo');
  undoData = null;
}
function doUndo(){
  if(!undoData) return;
  const sh = db.shows[undoData.showId];
  if(sh){ sh.watched = undoData.prev; saveDB(); }
  hideUndo(); render(); toast('Annulé');
}

/* Applique une modification d'un coup : une sauvegarde, un rendu, un statut recalculé */
function applyWatched(showId, mutate, label){
  const sh = db.shows[showId];
  if(!sh) return;
  const prev = Object.assign({}, sh.watched);
  mutate(sh);
  saveDB(); render();
  pushUndo(showId, prev, label);
}

/* Épisodes antérieurs, diffusés et non vus, sur toute la série (hors-série exclus) */
function episodesAvant(sh, n, e){
  return allEpisodes(sh, false).filter(ep=>
    (ep.s < n || (ep.s === n && ep.e < e)) && aired(ep) && !sh.watched[key(ep.s,ep.e)]);
}

/* Appui sur une ligne d'épisode */
function tapEp(id, n, e){
  const sh = db.shows[id];
  if(!sh) return;
  if(sh.watched[key(n,e)]){ toggleEp(id,n,e); return; }      // déjà vu → on décoche, sans question
  const avant = episodesAvant(sh, n, e);
  if(!avant.length){ marquerSeul(id, n, e); return; }         // rien derrière → on coche directement
  const ep = (sh.seasons[n]||[]).find(x=>x.e===e) || {};
  const nb = avant.length;
  openSheet('<h3>'+codeEp(n,e)+' · '+esc(ep.n||'')+'</h3>'+
    '<p class="small muted" style="margin:0 0 8px">Marquer aussi '+
      (nb>1 ? 'les '+nb+' épisodes précédents' : "l'épisode précédent")+' comme vus&nbsp;?</p>'+
    '<button class="opt" onclick="closeSheet();marquerCascade('+id+','+n+','+e+')">Tout marquer</button>'+
    '<button class="opt" onclick="closeSheet();marquerSeul('+id+','+n+','+e+')">Cet épisode uniquement</button>'+
    '<button class="opt" onclick="closeSheet()">Annuler</button>');
}

function marquerSeul(id, n, e){
  applyWatched(id, sh=>{ sh.watched[key(n,e)] = Date.now(); },
               codeEp(n,e)+' marqué vu');
}
function marquerCascade(id, n, e){
  const sh = db.shows[id];
  const liste = episodesAvant(sh, n, e).concat([{s:n, e:e}]);
  const nb = liste.length;
  applyWatched(id, s2=>{ const t = Date.now(); liste.forEach(ep=> s2.watched[key(ep.s,ep.e)] = t); },
               nb+' épisodes marqués vus');
}

function quickWatch(id, ev){
  if(ev) ev.stopPropagation();
  const s = db.shows[id], nx = nextToWatch(s);
  if(!nx) return;
  s.watched[key(nx.s,nx.e)] = Date.now(); saveDB(); render();
  toast(codeEp(nx.s,nx.e)+' vu ✓');
}

function ligneAbo(p, role){

      '<div class="sinfo" style="justify-content:center">'+
        '<div class="sname">'+esc(p.pseudo)+'</div>'+

}

function confirmerRupture(id, role, nom){
  openSheet('<h3>'+esc(nom)+'</h3>'+
    '<p class="small muted" style="margin:0 0 8px">'+
      (role==='suiveur' ? 'Tu ne verras plus sa bibliothèque.' : 'Cette personne ne verra plus la tienne.')+'</p>'+
    '<button class="opt danger" onclick="closeSheet();rompre(\''+id+'\',\''+role+'\')">'+
      (role==='suiveur' ? 'Me désabonner' : 'Retirer cet abonné')+'</button>'+
